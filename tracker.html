<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>상태창 및 항목 템플릿 생성기</title>
<style>
body{background-color:#1a1b26;color:#a9b1d6;font-family:'Malgun Gothic',sans-serif;display:flex;justify-content:center;padding:40px 20px 150px;margin:0}
.container{width:100%;max-width:600px}
.top-nav-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.tracker-title{font-size:20px;font-weight:bold;color:#c0caf5;letter-spacing:.5px}
.slot-container{display:flex;gap:6px}
.slot-btn{background-color:#24283b;color:#565f89;border:1px solid #414868;border-radius:6px;width:32px;height:32px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;padding:0}
.slot-btn.active{background-color:#7aa2f7;color:#1a1b26;border-color:#7aa2f7}
.header-actions-wrapper{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;flex-grow:1}
.header-actions::-webkit-scrollbar{display:none}
.action-btn{background-color:transparent;color:#7aa2f7;border:1px solid #7aa2f7;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:bold;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.template-paste-btn{background-color:rgba(158,206,106,.1);color:#9ece6a;border-color:#9ece6a}
.char-count{color:#565f89;font-size:14px;white-space:nowrap;flex-shrink:0;padding-bottom:4px}
.item-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
textarea{background-color:#24283b;color:#c0caf5;border:none;border-radius:8px;padding:12px 15px;font-size:16px;font-family:inherit;resize:none;overflow:hidden;min-height:24px;line-height:1.5;box-sizing:border-box;outline:none}
textarea:focus{box-shadow:0 0 0 2px #7aa2f7}
textarea::placeholder{color:#565f89}
.item-name{width:30%}
.item-value{width:60%;flex-grow:1}
.delete-btn{background:none;border:none;color:#565f89;font-size:18px;cursor:pointer;padding:12px 5px;transition:color .2s}
.add-btn{width:100%;background-color:transparent;color:#7aa2f7;border:1.5px dashed #414868;border-radius:8px;padding:15px;font-size:16px;cursor:pointer;margin-top:10px;transition:all .2s}
.shortcut-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background-color:rgba(36,40,59,.95);backdrop-filter:blur(5px);padding:10px 12px;border-radius:30px;box-shadow:0 4px 15px rgba(0,0,0,.5);display:flex;gap:5px;align-items:center;z-index:1000;max-width:95vw;overflow-x:auto;white-space:nowrap}
.shortcut-bar::-webkit-scrollbar{display:none}
.shortcut-btn{background-color:#414868;color:#c0caf5;border:none;border-radius:22px;padding:10px 13px;font-size:15px;font-weight:bold;cursor:pointer;transition:background-color .2s,color .2s;white-space:nowrap}
.divider{width:1px;height:22px;background-color:#565f89;margin:0 3px;flex-shrink:0}
.copy-btn{background-color:#9ece6a;color:#1a1b26}
.move-btn{background-color:#24283b;border:1px solid #565f89}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(26,27,38,.8);backdrop-filter:blur(3px);z-index:2000;display:flex;justify-content:center;align-items:center}
/* 👇 모달 컨텐츠가 화면 높이(90vh)를 초과하지 않도록 제한하고 스크롤(overflow-y) 추가 */
.modal-content{background-color:#24283b;width:90%;max-width:450px;border-radius:12px;padding:25px 20px;position:relative;box-shadow:0 10px 25px rgba(0,0,0,.5);box-sizing:border-box;max-height:90vh;overflow-y:auto}
.modal-close-btn{position:absolute;top:15px;right:15px;background:none;border:none;color:#565f89;font-size:20px;cursor:pointer;padding:5px}
.modal-content h3{margin-top:0;color:#c0caf5;font-size:16px;margin-bottom:5px}
.modal-content p{font-size:12px;color:#565f89;margin-bottom:15px;margin-top:0;line-height:1.4}
/* 👇 입력창이 일정 높이(50vh)까지만 커지고 그 안에서 자체 스크롤되도록 제한 */
.modal-textarea{width:100%;background-color:#1a1b26;border:1px solid #414868;border-radius:8px;padding:12px;color:#c0caf5;font-size:14px;resize:vertical;margin-bottom:15px;box-sizing:border-box;font-family:inherit;outline:none;max-height:50vh!important;overflow-y:auto!important}
.modal-textarea:focus{border-color:#7aa2f7}
.modal-confirm-btn{width:100%;background-color:#7aa2f7;color:#1a1b26;border:none;border-radius:8px;padding:12px;font-size:16px;font-weight:bold;cursor:pointer}
.merge-btn-group{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.merge-option-btn{width:100%;background-color:#1a1b26;color:#c0caf5;border:1px solid #414868;border-radius:8px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer;text-align:left;transition:all .2s}
@media (hover:hover){
.shortcut-btn:hover{background-color:#7aa2f7;color:#1a1b26}
.copy-btn:hover{background-color:#73daca}
.delete-btn:hover{color:#f7768e}
.add-btn:hover{border-color:#7aa2f7;background-color:rgba(122,162,247,.1)}
.action-btn:hover{background-color:#7aa2f7;color:#1a1b26} 
.template-paste-btn:hover{background-color:#9ece6a;color:#1a1b26}
.slot-btn:hover:not(.active){background-color:#414868;color:#c0caf5}
.modal-close-btn:hover{color:#f7768e}
.modal-confirm-btn:hover{background-color:#8db0f8}
.merge-option-btn:hover{background-color:#7aa2f7;color:#1a1b26;border-color:#7aa2f7}
}
.shortcut-btn:active{background-color:#7aa2f7;color:#1a1b26}
.copy-btn:active{background-color:#73daca}
.delete-btn:active{color:#f7768e}
.add-btn:active{border-color:#7aa2f7;background-color:rgba(122,162,247,.1)}
.action-btn:active{background-color:#7aa2f7;color:#1a1b26} 
.template-paste-btn:active{background-color:#9ece6a;color:#1a1b26}
.slot-btn:active:not(.active){background-color:#414868;color:#c0caf5}
.merge-option-btn:active{background-color:#7aa2f7;color:#1a1b26;border-color:#7aa2f7}
</style>
</head>
<body>
<div class="container">
    <div class="top-nav-bar">
        <div class="tracker-title">트래커</div>
        <div class="slot-container">
            <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
            <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
            <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
            <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
            <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
        </div>
    </div>
    <div class="header-actions-wrapper">
        <div class="header-actions">
            <button class="action-btn" id="copyAllBtn" onclick="copyAllData(this)">전체 복사</button>
            <button class="action-btn" onclick="openImportModal(this)">붙여넣기</button>
            <button class="action-btn" id="copyTemplateBtn" onclick="copyTemplateData(this)">템플릿 복사</button>
            <button class="action-btn template-paste-btn" id="pasteTemplateBtn" onclick="triggerTemplatePaste(this)" style="display:none;">템플릿 붙이기</button>
        </div>
        <div id="charCount" class="char-count">0 / 1,000</div>
    </div>
    <div id="itemList"></div>
    <button class="add-btn" onclick="addRow(this)">+ 항목 추가</button>
</div>

<div id="importModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeImportModal()">✕</button>
        <h3>외부 텍스트 붙여넣기</h3>
        <p>'항목이름: 항목설명' 형식의 텍스트를 붙여넣으세요.</p>
        <textarea id="importTextarea" class="modal-textarea" rows="8" placeholder="예시)&#10;이름: 홍길동&#10;성격: 활발하고 밝음"></textarea>
        <button class="modal-confirm-btn" onclick="submitImportText()">확인</button>
    </div>
</div>

<div id="mergeModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeMergeModal()">✕</button>
        <h3>중복 데이터 감지</h3>
        <p>현재 템플릿에 이미 작성된 내용이 있습니다. 방식을 선택해 주세요.</p>
        <div class="merge-btn-group">
            <button class="merge-option-btn" onclick="executeMerge('overwrite')">1. 기존 내용 삭제 후 붙여넣기</button>
            <button class="merge-option-btn" onclick="executeMerge('top')">2. 기존 내용 최상단에 붙여넣기</button>
            <button class="merge-option-btn" onclick="executeMerge('bottom')">3. 기존 내용 최하단에 붙여넣기</button>
            <button class="merge-option-btn" onclick="executeMerge('match')">4. 기존 내용 순서에 맞게 붙여넣기</button>
        </div>
    </div>
</div>

<div class="shortcut-bar" id="shortcutBar">
    <button class="shortcut-btn" onclick="insertShortcut(this, '→')">→</button>
    <button class="shortcut-btn" onclick="insertShortcut(this, '↔')">↔</button>
    <button class="shortcut-btn" onclick="insertShortcut(this, '·')">·</button>
    <button class="shortcut-btn" onclick="insertShortcut(this, 'char')">char</button>
    <button class="shortcut-btn" onclick="insertShortcut(this, 'user')">user</button>
    <div class="divider"></div>
    <button class="shortcut-btn move-btn" onclick="moveRow(this, 'up')">↑</button>
    <button class="shortcut-btn move-btn" onclick="moveRow(this, 'down')">↓</button>
    <button class="shortcut-btn copy-btn" id="copyBtn" onclick="copyFocusedField(this)">복사</button>
</div>

<script>
const itemList=document.getElementById('itemList'),charCountDisplay=document.getElementById('charCount'),shortcutBar=document.getElementById('shortcutBar'),copyBtn=document.getElementById('copyBtn'),copyAllBtn=document.getElementById('copyAllBtn'),copyTemplateBtn=document.getElementById('copyTemplateBtn'),pasteTemplateBtn=document.getElementById('pasteTemplateBtn'),importModal=document.getElementById('importModal'),importTextarea=document.getElementById('importTextarea'),mergeModal=document.getElementById('mergeModal');
let lastFocusedTextarea=null,currentSlot=1,pendingImportData=null;

function parseTextToItems(text){const lines=text.split('\n');let parsedItems=[],currentItem=null;lines.forEach(line=>{const colonIndex=line.indexOf(':');if(colonIndex!==-1){currentItem={name:line.substring(0,colonIndex).trim(),value:line.substring(colonIndex+1).trim()};parsedItems.push(currentItem);}else if(currentItem&&line.trim()!==''){currentItem.value+='\n'+line.trim();}});return parsedItems;}
function isCurrentSlotEmpty(){const rows=document.querySelectorAll('.item-row');if(rows.length===0)return true;if(rows.length===1){if(rows[0].querySelector('.item-name').value.trim()===''&&rows[0].querySelector('.item-value').value.trim()==='')return true;}return false;}
function openImportModal(btn){if(btn)btn.blur();importModal.style.display='flex';importTextarea.value='';importTextarea.focus();}
function closeImportModal(){importModal.style.display='none';}
function closeMergeModal(){mergeModal.style.display='none';pendingImportData=null;}
function submitImportText(){const newItems=parseTextToItems(importTextarea.value);if(newItems.length===0){alert('올바른 형식(항목이름: 항목설명)의 텍스트를 찾을 수 없습니다.');return;}closeImportModal();handleIncomingData(newItems);}
function triggerTemplatePaste(btn){if(btn)btn.blur();const savedClipboard=localStorage.getItem('clipboardTemplateData');if(!savedClipboard)return;handleIncomingData(JSON.parse(savedClipboard));localStorage.removeItem('clipboardTemplateData');localStorage.removeItem('clipboardSourceSlot');checkClipboardState();}
function handleIncomingData(newItems){if(isCurrentSlotEmpty()){applyMergeData('overwrite',newItems);}else{pendingImportData=newItems;mergeModal.style.display='flex';}}
function executeMerge(mode){if(!pendingImportData)return;const dataToProcess=pendingImportData;closeMergeModal();applyMergeData(mode,dataToProcess);}
function applyMergeData(mode,newItems){let existingItems=[];if(mode!=='overwrite'){document.querySelectorAll('.item-row').forEach(row=>{const name=row.querySelector('.item-name').value,value=row.querySelector('.item-value').value;if(name.trim()!==''||value.trim()!=='')existingItems.push({name,value});});}let finalItems=[];if(mode==='overwrite'){finalItems=newItems;}else if(mode==='top'){finalItems=[...newItems,...existingItems];}else if(mode==='bottom'){finalItems=[...existingItems,...newItems];}else if(mode==='match'){let map={},processedNames=new Set();existingItems.forEach(item=>{if(!map[item.name])map[item.name]=[];map[item.name].push(item.value);});existingItems.forEach(item=>{if(!processedNames.has(item.name)){processedNames.add(item.name);map[item.name].forEach(val=>finalItems.push({name:item.name,value:val}));newItems.filter(ni=>ni.name===item.name).forEach(ni=>finalItems.push(ni));}});newItems.forEach(ni=>{if(!processedNames.has(ni.name))finalItems.push(ni);});}itemList.innerHTML='';if(finalItems.length>0){finalItems.forEach(item=>addRow(null,item.name,item.value));}else{addRow();}saveData();}
function copyTemplateData(btn){if(btn)btn.blur();const dataToCopy=[];document.querySelectorAll('.item-row').forEach(row=>{dataToCopy.push({name:row.querySelector('.item-name').value,value:row.querySelector('.item-value').value});});localStorage.setItem('clipboardTemplateData',JSON.stringify(dataToCopy));localStorage.setItem('clipboardSourceSlot',currentSlot.toString());copyTemplateBtn.textContent='복사 완료!';setTimeout(()=>{copyTemplateBtn.textContent='템플릿 복사';},1000);checkClipboardState();}
function checkClipboardState(){const hasData=localStorage.getItem('clipboardTemplateData'),sourceSlot=parseInt(localStorage.getItem('clipboardSourceSlot'));if(hasData&&sourceSlot!==currentSlot){pasteTemplateBtn.style.display='inline-block';}else{pasteTemplateBtn.style.display='none';}}
function switchSlot(slotNumber){if(currentSlot===slotNumber)return;saveData();currentSlot=slotNumber;document.querySelectorAll('.slot-btn').forEach(btn=>btn.classList.remove('active'));document.getElementById('slot-'+slotNumber).classList.add('active');lastFocusedTextarea=null;itemList.innerHTML='';loadData(slotNumber);checkClipboardState();}
function copyAllData(btn){if(btn)btn.blur();let resultText=[];document.querySelectorAll('.item-row').forEach(row=>{const n=row.querySelector('.item-name').value,v=row.querySelector('.item-value').value;if(n.trim()!==''||v.trim()!=='')resultText.push(`${n}: ${v}`);});const finalString=resultText.join('\n');if(finalString===''){alert('복사할 내용이 없습니다!');return;}navigator.clipboard.writeText(finalString).then(()=>{copyAllBtn.textContent='완료!';setTimeout(()=>{copyAllBtn.textContent='전체 복사';},1000);}).catch(err=>{alert('복사에 실패했습니다.');});}
function saveData(){const dataToSave=[];document.querySelectorAll('.item-row').forEach(row=>{dataToSave.push({name:row.querySelector('.item-name').value,value:row.querySelector('.item-value').value});});localStorage.setItem('charTemplateData_'+currentSlot,JSON.stringify(dataToSave));}
function loadData(slotNumber=1){if(slotNumber===1&&!localStorage.getItem('charTemplateData_1')&&localStorage.getItem('charTemplateData')){localStorage.setItem('charTemplateData_1',localStorage.getItem('charTemplateData'));}const savedData=localStorage.getItem('charTemplateData_'+slotNumber);if(savedData){const dataArray=JSON.parse(savedData);if(dataArray.length>0){dataArray.forEach(item=>addRow(null,item.name,item.value));checkClipboardState();return;}}addRow();checkClipboardState();}
document.addEventListener('focusin',function(e){if(e.target.tagName.toLowerCase()==='textarea')lastFocusedTextarea=e.target;});
document.addEventListener('input',function(e){if(e.target.tagName.toLowerCase()==='textarea'){adjustHeight(e.target);updateCharCount();saveData();}});
function adjustHeight(element){element.style.height='auto';element.style.height=(element.scrollHeight)+'px';}
function insertShortcut(btn,text){if(btn)btn.blur();if(lastFocusedTextarea){setTimeout(()=>{const start=lastFocusedTextarea.selectionStart,end=lastFocusedTextarea.selectionEnd,currentValue=lastFocusedTextarea.value;lastFocusedTextarea.value=currentValue.substring(0,start)+text+currentValue.substring(end);lastFocusedTextarea.selectionStart=lastFocusedTextarea.selectionEnd=start+text.length;adjustHeight(lastFocusedTextarea);updateCharCount();saveData();lastFocusedTextarea.focus();},10);}}
function moveRow(btn,direction){if(btn)btn.blur();if(!lastFocusedTextarea)return;const currentRow=lastFocusedTextarea.closest('.item-row');if(!currentRow)return;if(direction==='up'){const prevRow=currentRow.previousElementSibling;if(prevRow){itemList.insertBefore(currentRow,prevRow);saveData();lastFocusedTextarea.focus();}}else if(direction==='down'){const nextRow=currentRow.nextElementSibling;if(nextRow){itemList.insertBefore(currentRow,nextRow.nextElementSibling);saveData();lastFocusedTextarea.focus();}}}
function copyFocusedField(btn){if(btn)btn.blur();if(lastFocusedTextarea){navigator.clipboard.writeText(lastFocusedTextarea.value).then(()=>{copyBtn.textContent='완료!';setTimeout(()=>{copyBtn.textContent='복사';},1000);}).catch(err=>{alert('복사에 실패했습니다.');});lastFocusedTextarea.focus();}}
function addRow(btn=null,nameStr='',valueStr=''){if(btn)btn.blur();const row=document.createElement('div');row.className='item-row';row.innerHTML=`<textarea class="item-name" rows="1" placeholder="항목 이름"></textarea><textarea class="item-value" rows="1" placeholder="세부 설정"></textarea><button class="delete-btn" onclick="deleteRow(this)">✕</button>`;const textareas=row.querySelectorAll('textarea');textareas[0].value=nameStr;textareas[1].value=valueStr;itemList.appendChild(row);setTimeout(()=>{textareas.forEach(ta=>adjustHeight(ta));updateCharCount();},0);saveData();}
function deleteRow(btn){if(btn)btn.blur();btn.parentElement.remove();if(itemList.children.length===0){addRow();}else{updateCharCount();saveData();}}
function updateCharCount(){let totalLength=0;document.querySelectorAll('.item-row textarea').forEach(textarea=>{totalLength+=textarea.value.length;});if(charCountDisplay)charCountDisplay.textContent=`${totalLength.toLocaleString()} / 1,000`;}
if(window.visualViewport){const updateBarPosition=()=>{shortcutBar.style.bottom='auto';shortcutBar.style.top=(window.visualViewport.offsetTop+window.visualViewport.height-70)+'px';};window.visualViewport.addEventListener('resize',updateBarPosition);window.visualViewport.addEventListener('scroll',updateBarPosition);updateBarPosition();}
loadData(1);

/* 👇 신규 추가: Ctrl + B 단축키로 항목 자동 추가 (오직 이 부분만 기능 추가됨) */
document.addEventListener('keydown', e => {
    // Mac의 Cmd키(metaKey)와 Window의 Ctrl키 모두 대응
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault(); // 브라우저의 기본 기능(북마크 열기, 글자 굵게 등)을 강제 차단
        addRow(); // 기존에 잘 작동하던 +항목 추가 버튼의 로직 그대로 실행
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); // 새로 생긴 항목을 바로 볼 수 있게 스르륵 스크롤
    }
});
</script>
</body>
</html>
