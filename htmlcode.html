<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 디자인 에디터</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; padding: 20px; padding-bottom: 100px; margin: 0; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-title { font-size: 20px; font-weight: bold; color: #c0caf5; margin-bottom: 5px; border-bottom: 2px solid #414868; padding-bottom: 10px; }
        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 미리보기 캔버스 */
        .preview-box { background-color: #ffffff; background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 15px 15px; border: 2px dashed #565f89; border-radius: 12px; padding: 20px; min-height: 150px; overflow-x: hidden; color: #333; }

        /* 컨트롤 패널 (추가 버튼) */
        .palette-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .add-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 8px; padding: 10px 15px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; flex-grow: 1; }
        .add-btn:active { background-color: #7aa2f7; color: #1a1b26; }

        /* 레이어 리스트 */
        .layer-list { display: flex; flex-direction: column; gap: 10px; }
        .layer-item { background-color: #24283b; border: 1px solid #414868; border-radius: 8px; overflow: hidden; }
        .layer-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #1f2335; cursor: pointer; }
        .layer-title { font-size: 14px; font-weight: bold; color: #c0caf5; display: flex; align-items: center; gap: 8px; }
        .layer-actions button { background: none; border: none; color: #565f89; font-size: 16px; cursor: pointer; padding: 0 5px; }
        .layer-actions button.delete { color: #f7768e; }
        
        /* 속성 편집기 (에디터) */
        .inspector { padding: 15px; border-top: 1px solid #414868; display: none; flex-direction: column; gap: 12px; }
        .inspector.active { display: flex; }
        
        .prop-group { display: flex; flex-direction: column; gap: 5px; }
        .prop-group label { font-size: 12px; color: #7aa2f7; font-weight: bold; display: flex; justify-content: space-between; }
        
        .inspector input[type="text"], .inspector textarea { background-color: #1a1b26; color: #c0caf5; border: 1px solid #414868; border-radius: 6px; padding: 10px; font-size: 13px; font-family: inherit; width: 100%; box-sizing: border-box; outline: none; }
        .inspector textarea { resize: vertical; min-height: 50px; }
        
        /* 컬러 피커 및 슬라이더 묶음 */
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row input[type="color"] { width: 40px; height: 30px; padding: 0; border: none; border-radius: 4px; cursor: pointer; background: none; }
        .flex-row input[type="range"] { flex-grow: 1; accent-color: #7aa2f7; }
        
        /* 토글 버튼 그룹 (정렬, 굵기 등) */
        .toggle-group { display: flex; border: 1px solid #414868; border-radius: 6px; overflow: hidden; }
        .toggle-btn { flex: 1; background-color: #1a1b26; color: #565f89; border: none; padding: 8px; font-size: 12px; cursor: pointer; border-right: 1px solid #414868; }
        .toggle-btn:last-child { border-right: none; }
        .toggle-btn.active { background-color: #7aa2f7; color: #1a1b26; font-weight: bold; }

        /* 결과 코드 영역 */
        .code-box { background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 8px; padding: 15px; font-family: Consolas, monospace; font-size: 12px; min-height: 100px; word-break: break-all; white-space: pre-wrap; }
        .copy-code-btn { background-color: #9ece6a; color: #1a1b26; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }

        @media (hover: hover) {
            .add-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .layer-actions button:hover { color: #c0caf5; }
            .copy-code-btn:hover { background-color: #73daca; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">🎨 상태창 자유 디자인 에디터</div>

        <!-- 1. 미리보기 캔버스 (흰 배경으로 실제 출력 느낌 부여) -->
        <div>
            <div class="section-title">👀 실시간 캔버스</div>
            <div id="previewCanvas" class="preview-box"></div>
        </div>

        <!-- 2. 요소 추가 버튼 -->
        <div>
            <div class="section-title">🧱 도형 및 텍스트 추가</div>
            <div class="palette-group">
                <button class="add-btn" onclick="addBlock('box')">🟦 텍스트 / 도형 상자</button>
                <button class="add-btn" onclick="addBlock('accordion')">📂 접기 / 펼치기</button>
                <button class="add-btn" onclick="addBlock('divider')">➖ 가로 구분선</button>
            </div>
        </div>

        <!-- 3. 속성 편집기 (레이어 리스트) -->
        <div>
            <div class="section-title">🛠️ 레이어 편집기 (클릭하여 수정)</div>
            <div id="layerList" class="layer-list"></div>
        </div>

        <!-- 4. 최종 코드 -->
        <div>
            <div class="section-title">
                <span>📝 생성된 HTML 코드</span>
                <button class="copy-code-btn" id="copyCodeBtn" onclick="copyResultCode(this)">코드 복사</button>
            </div>
            <div id="codeBox" class="code-box"></div>
        </div>
    </div>

    <script>
        let blocks = [];
        let activeBlockId = null;

        // 공통 속성 초기값 정의
        function getDefaultStyles(type) {
            if(type === 'divider') {
                return { color: '#e2e8f0', size: '2', padding: '15' };
            }
            return {
                text: type === 'box' ? '새로운 텍스트 상자' : '숨겨진 내용',
                title: type === 'accordion' ? '여기를 클릭하세요' : '',
                textColor: '#333333',
                bgColor: type === 'box' ? '#f1f5f9' : '#ffffff',
                bgTransparent: false,
                fontSize: '15',
                fontWeight: 'normal',
                textAlign: 'left',
                borderRadius: '8',
                padding: '15',
                borderWidth: '0',
                borderColor: '#000000'
            };
        }

        // 요소 추가
        function addBlock(type) {
            const id = Date.now();
            blocks.push({
                id: id,
                type: type,
                style: getDefaultStyles(type)
            });
            activeBlockId = id; // 추가하자마자 편집창 열기
            renderAll();
        }

        function deleteBlock(index, e) {
            e.stopPropagation();
            blocks.splice(index, 1);
            activeBlockId = null;
            renderAll();
        }

        function moveBlock(index, direction, e) {
            e.stopPropagation();
            if (direction === 'up' && index > 0) {
                [blocks[index - 1], blocks[index]] = [blocks[index], blocks[index - 1]];
            } else if (direction === 'down' && index < blocks.length - 1) {
                [blocks[index + 1], blocks[index]] = [blocks[index], blocks[index + 1]];
            }
            renderAll();
        }

        function toggleInspector(id) {
            activeBlockId = activeBlockId === id ? null : id;
            renderAll();
        }

        function updateStyle(id, key, value) {
            const block = blocks.find(b => b.id === id);
            if (block) {
                block.style[key] = value;
                renderPreviewAndCode(); // 입력할 때마다 실시간 렌더링
                
                // 표시 값 업데이트 (슬라이더 옆 숫자)
                const valueDisplay = document.getElementById(`val_${id}_${key}`);
                if(valueDisplay) valueDisplay.textContent = value;
            }
        }

        // XSS 방지 및 줄바꿈 처리
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // 💡 핵심: 허용된 태그와 인라인 스타일로만 HTML을 생성하는 로직
        function generateHTML(block) {
            const s = block.style;
            // 플랫폼 필수 규격 강제 적용 (반응형, 줄바꿈 방지)
            const baseRule = "box-sizing:border-box; max-width:100%; width:100%; word-break:keep-all; text-wrap:pretty;";
            
            if (block.type === 'box') {
                const bg = s.bgTransparent ? 'transparent' : s.bgColor;
                const border = s.borderWidth > 0 ? `${s.borderWidth}px solid ${s.borderColor}` : 'none';
                const styleStr = `${baseRule} color:${s.textColor}; background-color:${bg}; font-size:${s.fontSize}px; font-weight:${s.fontWeight}; text-align:${s.textAlign}; border-radius:${s.borderRadius}px; padding:${s.padding}px; border:${border}; margin-bottom:10px;`;
                
                return `<div style="${styleStr}">${escapeHTML(s.text).replace(/\n/g, '<br>')}</div>`;
            }
            
            if (block.type === 'accordion') {
                const bg = s.bgTransparent ? 'transparent' : s.bgColor;
                const border = s.borderWidth > 0 ? `${s.borderWidth}px solid ${s.borderColor}` : 'none';
                
                return `<details style="${baseRule} margin-bottom:10px;"><summary style="cursor:pointer; color:${s.textColor}; font-size:${s.fontSize}px; font-weight:bold; padding:8px 0;">${escapeHTML(s.title)}</summary><div style="color:${s.textColor}; background-color:${bg}; font-size:${s.fontSize}px; border-radius:${s.borderRadius}px; padding:${s.padding}px; border:${border}; margin-top:5px;">${escapeHTML(s.text).replace(/\n/g, '<br>')}</div></details>`;
            }

            if (block.type === 'divider') {
                return `<hr style="${baseRule} border:0; border-top:${s.size}px solid ${s.color}; margin:${s.padding}px 0;">`;
            }
        }

        function renderPreviewAndCode() {
            const previewCanvas = document.getElementById('previewCanvas');
            const codeBox = document.getElementById('codeBox');
            
            if(blocks.length === 0) {
                previewCanvas.innerHTML = '<div style="text-align: center; color: #94a3b8; margin-top: 50px;">위에 있는 버튼을 눌러 요소를 추가하세요!</div>';
                codeBox.textContent = '';
                return;
            }

            let finalHTML = '';
            blocks.forEach(block => {
                finalHTML += generateHTML(block) + '\n';
            });

            previewCanvas.innerHTML = finalHTML;
            codeBox.textContent = finalHTML;
        }

        // 레이어 리스트 렌더링 (UI 조립)
        function renderAll() {
            const layerList = document.getElementById('layerList');
            layerList.innerHTML = '';

            blocks.forEach((block, index) => {
                const s = block.style;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'layer-item';
                
                let icon = block.type === 'box' ? '🟦' : block.type === 'accordion' ? '📂' : '➖';
                let title = block.type === 'box' ? '텍스트/도형 상자' : block.type === 'accordion' ? '접기/펼치기' : '구분선';
                const isActive = activeBlockId === block.id;

                let html = `
                    <div class="layer-header" onclick="toggleInspector(${block.id})">
                        <div class="layer-title">${icon} ${title} ${isActive ? '▼' : '▶'}</div>
                        <div class="layer-actions">
                            <button onclick="moveBlock(${index}, 'up', event)">↑</button>
                            <button onclick="moveBlock(${index}, 'down', event)">↓</button>
                            <button class="delete" onclick="deleteBlock(${index}, event)">✕</button>
                        </div>
                    </div>
                `;

                // 편집기(Inspector) 영역
                if (isActive) {
                    html += `<div class="inspector active">`;
                    
                    if (block.type === 'divider') {
                        html += `
                            <div class="flex-row">
                                <label style="color:#7aa2f7; font-size:12px; font-weight:bold;">선 색상</label>
                                <input type="color" value="${s.color}" oninput="updateStyle(${block.id}, 'color', this.value)">
                            </div>
                            <div class="prop-group">
                                <label>선 두께 <span id="val_${block.id}_size">${s.size}</span></label>
                                <input type="range" min="1" max="10" value="${s.size}" oninput="updateStyle(${block.id}, 'size', this.value)">
                            </div>
                            <div class="prop-group">
                                <label>위아래 여백 <span id="val_${block.id}_padding">${s.padding}</span></label>
                                <input type="range" min="0" max="50" value="${s.padding}" oninput="updateStyle(${block.id}, 'padding', this.value)">
                            </div>
                        `;
                    } else {
                        // 공통 텍스트/도형 편집기
                        if (block.type === 'accordion') {
                            html += `<div class="prop-group"><label>제목 (버튼)</label><input type="text" value="${escapeHTML(s.title)}" oninput="updateStyle(${block.id}, 'title', this.value)"></div>`;
                        }
                        
                        html += `
                            <div class="prop-group">
                                <label>내용</label>
                                <textarea oninput="updateStyle(${block.id}, 'text', this.value)">${escapeHTML(s.text)}</textarea>
                            </div>
                            
                            <div class="flex-row" style="margin-top:10px;">
                                <div class="prop-group" style="flex:1;"><label>글자 색상</label><input type="color" value="${s.textColor}" oninput="updateStyle(${block.id}, 'textColor', this.value)"></div>
                                <div class="prop-group" style="flex:1;">
                                    <label>배경 색상 <span style="font-weight:normal; font-size:11px; cursor:pointer;"><input type="checkbox" ${s.bgTransparent ? 'checked' : ''} onchange="updateStyle(${block.id}, 'bgTransparent', this.checked)"> 투명</span></label>
                                    <input type="color" value="${s.bgColor}" oninput="updateStyle(${block.id}, 'bgColor', this.value)" ${s.bgTransparent ? 'disabled' : ''}>
                                </div>
                            </div>

                            <div class="prop-group">
                                <label>글자 크기 <span id="val_${block.id}_fontSize">${s.fontSize}px</span></label>
                                <input type="range" min="10" max="40" value="${s.fontSize}" oninput="updateStyle(${block.id}, 'fontSize', this.value)">
                            </div>

                            <div class="flex-row">
                                <div class="toggle-group" style="flex:1;">
                                    <button class="toggle-btn ${s.textAlign === 'left' ? 'active' : ''}" onclick="updateStyle(${block.id}, 'textAlign', 'left'); renderAll();">좌측</button>
                                    <button class="toggle-btn ${s.textAlign === 'center' ? 'active' : ''}" onclick="updateStyle(${block.id}, 'textAlign', 'center'); renderAll();">중앙</button>
                                    <button class="toggle-btn ${s.textAlign === 'right' ? 'active' : ''}" onclick="updateStyle(${block.id}, 'textAlign', 'right'); renderAll();">우측</button>
                                </div>
                                <div class="toggle-group" style="flex:1;">
                                    <button class="toggle-btn ${s.fontWeight === 'normal' ? 'active' : ''}" onclick="updateStyle(${block.id}, 'fontWeight', 'normal'); renderAll();">일반</button>
                                    <button class="toggle-btn ${s.fontWeight === 'bold' ? 'active' : ''}" onclick="updateStyle(${block.id}, 'fontWeight', 'bold'); renderAll();">굵게</button>
                                </div>
                            </div>

                            <div class="prop-group" style="margin-top:10px;">
                                <label>모서리 둥글기 (도형 만들기) <span id="val_${block.id}_borderRadius">${s.borderRadius}px</span></label>
                                <input type="range" min="0" max="50" value="${s.borderRadius}" oninput="updateStyle(${block.id}, 'borderRadius', this.value)">
                            </div>
                            <div class="prop-group">
                                <label>상자 안쪽 여백 (크기 조절) <span id="val_${block.id}_padding">${s.padding}px</span></label>
                                <input type="range" min="0" max="50" value="${s.padding}" oninput="updateStyle(${block.id}, 'padding', this.value)">
                            </div>

                            <div class="flex-row">
                                <div class="prop-group" style="flex:1;"><label>테두리 색상</label><input type="color" value="${s.borderColor}" oninput="updateStyle(${block.id}, 'borderColor', this.value)"></div>
                                <div class="prop-group" style="flex:2;">
                                    <label>테두리 두께 <span id="val_${block.id}_borderWidth">${s.borderWidth}px</span></label>
                                    <input type="range" min="0" max="10" value="${s.borderWidth}" oninput="updateStyle(${block.id}, 'borderWidth', this.value)">
                                </div>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }
                
                itemDiv.innerHTML = html;
                layerList.appendChild(itemDiv);
            });

            renderPreviewAndCode();
        }

        function copyResultCode(btn) {
            if(btn) btn.blur();
            const textToCopy = document.getElementById('codeBox').textContent;
            if(!textToCopy || blocks.length === 0) {
                alert('복사할 코드가 없습니다!');
                return;
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const origin = btn.textContent;
                btn.textContent = '완료!';
                setTimeout(() => { btn.textContent = origin; }, 1000);
            }).catch(err => {
                alert('복사에 실패했습니다.');
            });
        }

        // 초기 화면 세팅
        renderAll();
    </script>
</body>
</html>
