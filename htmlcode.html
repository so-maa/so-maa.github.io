<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML 해독기</title>
    <style>
        body { background: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; display: flex; justify-content: center; overflow-x: hidden; }
        .app-wrapper { width: 100%; max-width: 900px; transition: filter 0.3s; }
        .blurred { filter: blur(8px) brightness(0.6); pointer-events: none; user-select: none; }
        .app-container { display: flex; flex-direction: column; gap: 20px; }
        
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 10px; }
        .tracker-title { font-size: 20px; font-weight: bold; color: #c0caf5; display: flex; align-items: center; gap: 10px; }
        .slot-container { display: flex; gap: 6px; }
        .slot-btn { background: #24283b; color: #565f89; border: 1px solid #414868; border-radius: 6px; width: 32px; height: 32px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; padding: 0; }
        .slot-btn.active { background: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        .box-base { background: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; }
        
        .preview-box {
            background: #fff radial-gradient(#e2e8f0 1px, transparent 0);
            background-size: 15px 15px;
            border-top: 2px dashed #565f89;
            border-bottom: 2px dashed #565f89;
            border-left: none;
            border-right: none;
            border-radius: 0;
            margin: 0 -20px;
            padding: 22px 16px 24px 16px;
            height: 356px;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
            color: #333;
            font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        .preview-box * {
            box-sizing: border-box !important;
        }

        /* 👇 신규 추가: 사용자가 클릭한 요소에 씌워질 형광펜(강조) 효과 */
        .preview-highlight {
            outline: 3px solid #f7768e !important;
            outline-offset: -3px !important;
            box-shadow: inset 0 0 15px rgba(247, 118, 142, 0.4) !important;
            transition: outline 0.1s, box-shadow 0.1s;
            position: relative;
            z-index: 10;
        }
        
        .code-textarea { width: 100%; height: 250px; background: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 12px; padding: 15px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5; }
        .code-textarea:focus { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2); }
        .code-textarea::selection { background: #364A82; color: #fff; }
        .structure-box { min-height: 300px; max-height: 500px; overflow-y: auto; }
        
        .usage-bar { display: none; background: rgba(187, 154, 247, 0.1); border: 1px dashed #bb9af7; border-radius: 8px; padding: 12px 15px; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .usage-bar.active { display: flex; }
        .usage-text { font-size: 12px; font-weight: bold; color: #bb9af7; }
        .usage-subtext { font-size: 11px; color: #a9b1d6; }

        .tree-node { margin: 4px 0; font-size: 13px; line-height: 1.4; }
        .tree-summary { display: inline-block; padding: 6px 10px; background: #1f2335; border: 1px solid #414868; border-radius: 6px; cursor: pointer; transition: 0.2s; color: #c0caf5; user-select: none; font-weight: bold; }
        .tree-summary:hover { background: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        .prop-list { margin: 5px 0 10px 15px; display: flex; flex-direction: column; gap: 4px; }
        .prop-item { display: flex; padding: 4px 8px; background: #1a1b26; border: 1px dashed #414868; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; color: #a9b1d6; }
        .prop-item:hover { background: #364A82; color: #fff; border-color: #7aa2f7; }
        .prop-name { color: #9ece6a; font-weight: bold; width: 140px; flex-shrink: 0; }
        .prop-value { color: #c0caf5; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .tree-children { margin-left: 15px; padding-left: 10px; border-left: 2px dashed #414868; margin-top: 4px; display: flex; flex-direction: column; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; background: #414868; color: #a9b1d6; }
        .badge.box { background: #7aa2f7; color: #1a1b26; }
        .badge.text { background: #bb9af7; color: #1a1b26; }
        .badge.special { background: #f7768e; color: #1a1b26; }
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
        
        .action-btn { background: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary { background: #364A82; border-color: #7aa2f7; color: #fff; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
        
        .bulb-btn { position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px; border-radius: 50%; background: #bb9af7; color: #1a1b26; font-size: 26px; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; z-index: 10000; border: none; transition: transform 0.2s, filter 0.2s; }
        .bulb-btn:hover { filter: brightness(1.1); transform: scale(1.05); }

        .explanation-popup { position: fixed; bottom: 25px; left: 25px; width: 330px; background: #1f2335; border: 2px solid #bb9af7; border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 9999; display: flex; flex-direction: column; gap: 8px; transform: translateX(-150%); opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s, visibility 0.4s; }
        .explanation-popup.show { transform: translateX(0); opacity: 1; visibility: visible; pointer-events: auto; }
        
        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #414868; padding-bottom: 6px; }
        .popup-title { color: #bb9af7; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        
        .popup-reset-btn { font-size: 11px; font-weight: bold; border: 1px solid #414868; padding: 3px 6px; border-radius: 4px; background: transparent; color: #a9b1d6; cursor: pointer; transition: 0.2s; }
        .popup-reset-btn:hover { color: #f7768e; border-color: #f7768e; }
        .popup-min-btn { background: none; border: none; color: #a9b1d6; font-size: 24px; cursor: pointer; padding: 0; font-weight: bold; line-height: 1; margin-top: -4px; transition: 0.2s; }
        .popup-min-btn:hover { color: #bb9af7; }
        .popup-close-btn { background: none; border: none; color: #a9b1d6; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; transition: 0.2s; }
        .popup-close-btn:hover { color: #f7768e; }
        
        .popup-prop-name { color: #1a1b26; font-weight: bold; font-size: 14px; background: #bb9af7; padding: 5px; border-radius: 6px; text-align: center; margin-bottom: 2px; }
        
        .chat-log { max-height: 250px; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .chat-msg { font-size: 13px; line-height: 1.5; padding: 10px; border-radius: 8px; word-break: keep-all; }
        .chat-msg.ai { background: #24283b; color: #c0caf5; border: 1px solid #414868; border-top-left-radius: 0; }
        .chat-msg.user { background: #364A82; color: #fff; align-self: flex-end; border-top-right-radius: 0; }
        
        .ai-req-btn { background: transparent; border: 1px solid #bb9af7; color: #bb9af7; width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .chat-input-row { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input { flex: 1; background: #1a1b26; border: 1px solid #414868; color: #c0caf5; padding: 8px 12px; border-radius: 20px; font-size: 12px; outline: none; }
        .chat-send-btn { background: #bb9af7; color: #1a1b26; border: none; border-radius: 20px; padding: 0 12px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: flex; justify-content: center; align-items: center; background: rgba(26, 27, 38, 0.4); }
        .intro-box { background: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 20px; width: 90%; max-width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .intro-box h2 { margin: 0; font-size: 16px; color: #bb9af7; }
        .intro-box p { margin: 0; font-size: 12px; color: #a9b1d6; line-height: 1.5; }
        .intro-btn-group { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        .intro-btn { padding: 8px; font-size: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-no-api { background: #414868; color: #c0caf5; }
        .btn-yes-api { background: #bb9af7; color: #1a1b26; }
        .api-input-container { display: none; flex-direction: column; gap: 8px; margin-top: 5px; }
        .api-input { padding: 8px; border-radius: 8px; border: 1px solid #414868; background: #1a1b26; color: #c0caf5; outline: none; font-size: 12px; }

        @media (hover: hover) {
            .action-btn:hover, .slot-btn:hover:not(.active) { background: #414868; color: #c0caf5; }
            .popup-close-btn:hover { color: #f7768e; }
            .intro-btn:hover { filter: brightness(1.1); }
            .ai-req-btn:hover { background: #bb9af7; color: #1a1b26; }
        }
        @media (max-width: 768px) {
            .explanation-popup { left: 50%; bottom: 20px; transform: translate(-50%, 150%); width: 90vw; max-width: 330px; }
            .explanation-popup.show { transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div id="introOverlay" class="intro-overlay">
        <div class="intro-box">
            <h2>✨ AI 해독기 설정</h2>
            <p>선생님 기능을 담당할 AI를 설정해주세요.<br>(기존 데이터는 안전하게 보존됩니다!)</p>
            <div class="intro-btn-group" id="introBtnGroup">
                <button class="intro-btn btn-no-api" onclick="selectNoApi()">API키가 없습니다. (기본사전)</button>
                <button class="intro-btn btn-yes-api" onclick="selectYesApi()">API키가 있습니다. (AI 호출)</button>
            </div>
            <div class="api-input-container" id="apiInputContainer">
                <input type="text" id="introApiInput" class="api-input" placeholder="AIzaSy... (API 키 붙여넣기)">
                <button class="intro-btn btn-yes-api" onclick="submitApiKey()">입력 완료 및 시작</button>
            </div>
        </div>
    </div>

    <div id="appWrapper" class="app-wrapper blurred">
        <div class="app-container">
            <div class="top-nav-bar">
                <div class="tracker-title">HTML 해독기</div>
                <div class="slot-container">
                    <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
                    <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
                    <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
                    <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
                    <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
                </div>
            </div>

            <div>
                <!-- 👇 신규 추가: 미리보기 창 상단에 위치 추적 토글 버튼 배치 -->
                <div class="section-title">
                    <span>💻 미리보기</span>
                    <button class="action-btn" id="toggleTrackerBtn" onclick="toggleTracker()">🔍 위치 추적: OFF</button>
                </div>
                <div id="previewBox" class="preview-box"></div>
            </div>

            <div>
                <div class="section-title">
                    <span>📝 코드 편집기</span>
                    <button class="action-btn" onclick="copyCode()">코드 복사</button>
                </div>
                <div class="code-editor-container">
                    <textarea id="codeEditor" class="code-textarea" placeholder="여기에 코드를 붙여넣으세요."></textarea>
                </div>
            </div>

            <div id="usageBar" class="usage-bar">
                <span class="usage-text" id="usageCountText">오늘 AI 질문: 0회 / 500회 (매일 밤 12시 초기화)</span>
                <span class="usage-subtext">Gemini 3.5 Flash-Lite 가동 중</span>
            </div>

            <div>
                <div class="section-title">📁 구조 분석</div>
                <div id="structureBox" class="box-base structure-box">
                    <div class="empty-msg">분석 결과가 나타납니다.</div>
                </div>
            </div>
        </div>
    </div>

    <button id="bulbBtn" class="bulb-btn" onclick="maximizeExplanation()">💡</button>

    <div id="explanationPopup" class="explanation-popup">
        <div class="popup-header">
            <div style="display:flex; gap:8px; align-items:center;">
                <span class="popup-title">✨ AI 코딩 상담소</span>
                <button class="popup-reset-btn" onclick="resetCurrentChat()">🔄 초기화</button>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="popup-min-btn" onclick="minimizeExplanation()">−</button>
                <button class="popup-close-btn" onclick="closeExplanation()">✕</button>
            </div>
        </div>
        <div class="popup-prop-name" id="popupPropName">속성 이름</div>
        <div id="chatLog" class="chat-log"></div>
        <div class="chat-input-row" id="chatInputRow" style="display: none;">
            <input type="text" id="chatInput" class="chat-input" placeholder="궁금한 점을 더 물어보세요!" onkeypress="if(event.key==='Enter') sendChatMsg()">
            <button class="chat-send-btn" onclick="sendChatMsg()">전송</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const MODEL_NAME = "gemini-3.5-flash-lite";
        const MAX_USAGE = 500;
        
        // 👇 신규 추가: 위치 추적용 변수
        let geminiApiKey = null, currentSlot = 1, chatMemories = {}, currKey = '', currVal = '';
        let isTrackerOn = false, domElementMap = [];

        const UI = {
            app: $('appWrapper'), intro: $('introOverlay'), usageBar: $('usageBar'), usageTxt: $('usageCountText'),
            preview: $('previewBox'), editor: $('codeEditor'), tree: $('structureBox'),
            bulb: $('bulbBtn'), popup: $('explanationPopup'), log: $('chatLog'), chatRow: $('chatInputRow'), chatIn: $('chatInput'), propName: $('popupPropName')
        };
        const store = { get: k => localStorage.getItem(k), set: (k,v) => localStorage.setItem(k, v), getObj: k => JSON.parse(localStorage.getItem(k))||null, setObj: (k,v) => localStorage.setItem(k, JSON.stringify(v)) };

        window.onload = () => { loadData(1); const k = store.get('savedGeminiKey'); if(k) $('introApiInput').value = k; }

        const selectNoApi = () => { geminiApiKey = null; closeIntro(); };
        const selectYesApi = () => { $('introBtnGroup').style.display = 'none'; $('apiInputContainer').style.display = 'flex'; };
        const submitApiKey = () => {
            const k = $('introApiInput').value.trim();
            if(k) { geminiApiKey = k; store.set('savedGeminiKey', k); updateUsage(); closeIntro(); } else alert('API 키를 입력해주세요!');
        };
        const closeIntro = () => { UI.intro.style.display = 'none'; UI.app.classList.remove('blurred'); };

        function updateUsage() {
            if(!geminiApiKey) return;
            UI.usageBar.classList.add('active');
            const today = new Date().toDateString();
            let data = store.getObj('geminiUsage') || { d: today, c: 0 };
            if (data.d !== today) { data = { d: today, c: 0 }; store.setObj('geminiUsage', data); }
            
            let stat = data.c >= MAX_USAGE ? `<span style="color:#f7768e;">(100% 소진! 내일 초기화)</span>` : 
                       data.c >= 450 ? `<span style="color:#e0af68;">(한도 임박! 내일 초기화)</span>` : `<span style="color:#a9b1d6;">(매일 밤 12시 초기화)</span>`;
            UI.usageTxt.innerHTML = `오늘 질문: ${data.c}회 / ${MAX_USAGE}회 ${stat}`;
        }
        function incUsage() { let d = store.getObj('geminiUsage') || {d: new Date().toDateString(), c: 0}; d.c++; store.setObj('geminiUsage', d); updateUsage(); }

        const addMsg = (role, html) => { UI.log.insertAdjacentHTML('beforeend', `<div class="chat-msg ${role}">${html}</div>`); UI.log.scrollTop = UI.log.scrollHeight; };
        const formatAi = t => t.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b style="color:#bb9af7;">$1</b>');

        function renderChat() {
            UI.log.innerHTML = '';
            const history = chatMemories[currKey];
            if (history && history.length > 0) {
                history.forEach(m => addMsg(m.r==='user'?'user':'ai', m.html));
                UI.chatRow.style.display = geminiApiKey ? 'flex' : 'none';
            } else {
                addMsg('ai', explanationFallback[currKey] || `<b>[${UI.propName.textContent}]</b><br><br>숫자나 색상을 변경하며 디자인 변화를 관찰해보세요!`);
                if (geminiApiKey) {
                    if ((store.getObj('geminiUsage')||{}).c >= MAX_USAGE) {
                        addMsg('ai', '<span style="color:#f7768e; font-weight:bold;">오늘 무료 사용량을 모두 소진했습니다.</span>');
                        UI.chatRow.style.display = 'none';
                    } else {
                        addMsg('ai', `<button class="ai-req-btn" onclick="reqAi()">✨ AI 선생님에게 상세 해석 맡기기</button>`);
                        UI.chatRow.style.display = 'none'; 
                    }
                } else UI.chatRow.style.display = 'none';
            }
            UI.log.scrollTop = UI.log.scrollHeight;
        }

        const resetCurrentChat = () => { chatMemories[currKey] = []; renderChat(); };

        const callAPI = async (contents) => {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${geminiApiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents })
                });
                const d = await res.json();
                if(d.error) throw new Error(d.error.message);
                incUsage(); return d.candidates[0].content.parts[0].text;
            } catch (e) { return null; }
        };

        const reqAi = async () => {
            UI.log.lastChild.remove();
            const id = 'l_'+Date.now(); addMsg('ai', `<span id="${id}">설명을 떠올리고 있어요...💭</span>`);
            const q = `현재 '${currKey}: ${currVal};' 설정이 사용됨. 뜻과 동작 원리를 초보자가 100% 이해할 수 있게 쉽지만 구체적인 3문장으로 쉽고 친절히 답해줘.`;
            const txt = await callAPI([{ role: 'user', parts: [{text: q}] }]);
            if($(id)) $(id).parentElement.remove();
            if(txt) { chatMemories[currKey] = [{ r: 'model', html: formatAi(txt) }]; renderChat(); } 
            else addMsg('ai', '<span style="color:#f7768e;">통신 실패. 한도 초과 또는 오류입니다.</span>');
        };

        const sendChatMsg = async () => {
            const m = UI.chatIn.value.trim(); if(!m) return;
            UI.chatIn.value = ''; chatMemories[currKey].push({ r: 'user', html: m }); renderChat();
            
            const id = 'l_'+Date.now(); addMsg('ai', `<span id="${id}">작성 중...💭</span>`);
            let ctx = [{ role: 'user', parts: [{ text: `초보자 코딩 강사. 속성: '${currKey}'(값:'${currVal}'). 쉽고 구체적인 설명 사용.` }] }];
            chatMemories[currKey].forEach(h => ctx.push({ role: h.r==='model'?'model':'user', parts: [{ text: h.html }] }));
            
            const txt = await callAPI(ctx);
            if($(id)) $(id).parentElement.remove();
            if(txt) { chatMemories[currKey].push({ r: 'model', html: formatAi(txt) }); renderChat(); }
            else { addMsg('ai', '<span style="color:#f7768e;">통신 실패.</span>'); chatMemories[currKey].pop(); }
        };

        const dict = { 'background':'🎨 배경','background-color':'🎨 배경색','color':'🖍️ 글자색','border':'🔲 테두리','border-radius':'↪️ 라운드','padding':'↔️ 안쪽 여백','margin':'↔️ 바깥 여백','width':'📏 너비','max-width':'📏 최대 너비','height':'↕️ 높이','font-size':'🅰️ 글자 크기','font-weight':'𝐁 굵기','text-align':'📑 정렬','display':'📐 배치 방식','justify-content':'가로 정렬','align-items':'세로 정렬','gap':'틈(간격)','position':'📍 위치 기준','transform':'🔄 변형','z-index':'겹침 순서','box-sizing':'크기 계산법','opacity':'👻 투명도' };
        const explanationFallback = { 'margin':'<b>거리두기</b> 구역입니다.','padding':'<b>뽁뽁이(완충재)</b> 구역입니다.','border-radius':'<b>사포로 둥글게</b> 가는 효과입니다.','display':'<b>마법의 지휘관(Flex)</b>입니다.' };

        function parseHTML(html) {
            const rx = /(<!--[\s\S]*?-->)|<(\/?)([a-zA-Z0-9\-]+)([^>]*?)>|([^<]+)/g;
            let tokens = [], m;
            while ((m = rx.exec(html)) !== null) {
                if(m[1] || (!m[3] && (m[5]||'').trim() === '')) continue;
                tokens.push({ isTag: !!m[3], isClose: m[2]==='/', name: m[3]?m[3].toLowerCase():null, attrs: m[4]||'', text: m[0], raw: (m[5]||'').trim(), s: m.index, e: rx.lastIndex });
            }
            let root = { n: 'root', c: [], s: 0, oe: html.length, e: html.length }, stack = [root];
            const voids = ['br','hr','img','input'];
            for (let t of tokens) {
                let p = stack[stack.length - 1];
                if (t.isTag && !t.isClose) {
                    let node = { n: t.name, s: t.s, oe: t.e, e: t.e, c: [], a: t.attrs }; p.c.push(node);
                    if (!voids.includes(t.name)) stack.push(node);
                } else if (t.isTag && t.isClose) {
                    for (let i = stack.length - 1; i >= 1; i--) if (stack[i].n === t.name) { stack[i].e = t.e; stack.length = i; break; }
                } else if (!t.isTag) p.c.push({ n: '#t', txt: t.raw, s: t.s, e: t.e });
            }
            return root.c;
        }

        const transTag = (n, t) => n==='div'?{b:'box',t:'📦 상자'}:n==='span'?{b:'text',t:'🏷️ 글자'}:n==='details'?{b:'special',t:'📂 펼치기 틀'}:n==='summary'?{b:'special',t:'▶ 제목'}:n==='#t'?{b:'',t:`📝 "${t.length>15?t.substring(0,15)+'...':t}"`}:{b:'',t:`<${n}>`};

        function getStyles(a) {
            const m = (a||'').match(/style\s*=\s*(["'])(.*?)\1/i); if(!m) return [];
            return m[2].replace(/\/\*[\s\S]*?\*\//g, '').split(';').filter(r=>r.trim()).map(r => {
                const p = r.split(':'); return p.length>1 ? { k: p[0].trim().toLowerCase(), v: p.slice(1).join(':').trim() } : null;
            }).filter(Boolean);
        }

        function renderTree(nodes) {
            return nodes.map(nd => {
                const info = transTag(nd.n, nd.txt), styles = getStyles(nd.a);
                let h = `<div class="tree-node">`;
                if (nd.n === '#t' || nd.n === 'br') h += `<div class="tree-summary" onclick="hlTag(event, ${nd.s}, ${nd.e}, '${nd.n}', '${info.t}')">${info.t}</div>`;
                else {
                    h += `<details><summary class="tree-summary" onclick="hlTag(event, ${nd.s}, ${nd.e}, '${nd.n}', '${info.t}')">${info.b?`<span class="badge ${info.b}">${info.b.toUpperCase()}</span>`:''}${info.t} (${styles.length})</summary>`;
                    if (styles.length) h += `<div class="prop-list">` + styles.map(p => `<div class="prop-item" onclick="hlProp(event, ${nd.s}, ${nd.oe}, '${p.k}', '${dict[p.k]||p.k}', '${p.v.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><span class="prop-name">${dict[p.k]||p.k}</span><span class="prop-value">${p.v}</span></div>`).join('') + `</div>`;
                    if (nd.c.length) h += `<div class="tree-children">${renderTree(nd.c)}</div>`;
                    h += `</details>`;
                }
                return h + `</div>`;
            }).join('');
        }

        // 👇 신규 추가: 위치 추적 토글 제어 함수
        function toggleTracker() {
            isTrackerOn = !isTrackerOn;
            const btn = $('toggleTrackerBtn');
            if (isTrackerOn) {
                btn.innerHTML = '🔍 위치 추적: ON';
                btn.style.background = '#bb9af7';
                btn.style.color = '#1a1b26';
                highlightTargetElement(); 
            } else {
                btn.innerHTML = '🔍 위치 추적: OFF';
                btn.style.background = '#414868';
                btn.style.color = '#c0caf5';
                clearHighlight();
            }
        }

        function clearHighlight() {
            const els = UI.preview.querySelectorAll('.preview-highlight');
            els.forEach(el => el.classList.remove('preview-highlight'));
        }

        // 👇 신규 추가: 에디터 커서 위치를 바탕으로 요소에 형광펜 칠하기
        function highlightTargetElement() {
            if (!isTrackerOn) return;
            clearHighlight();
            
            const cursorPos = UI.editor.selectionStart;
            let targetIndex = -1;
            
            // 구조 분석 트리에서 커서가 위치한 가장 깊은 태그 찾기
            for (let i = 0; i < domElementMap.length; i++) {
                const node = domElementMap[i];
                if (cursorPos >= node.s && cursorPos <= node.e) {
                    targetIndex = i;
                }
            }
            
            if (targetIndex !== -1) {
                const domElements = UI.preview.querySelectorAll('*');
                if (domElements[targetIndex]) {
                    domElements[targetIndex].classList.add('preview-highlight');
                }
            }
        }

        UI.editor.addEventListener('input', () => { 
            UI.preview.innerHTML = UI.editor.value; 
            analyzeCode(UI.editor.value); 
            store.set('htmlCodeSlot_'+currentSlot, UI.editor.value); 
        });
        
        // 👇 신규 추가: 에디터 창을 클릭하거나 키보드를 움직일 때 실시간 추적 실행
        UI.editor.addEventListener('click', highlightTargetElement);
        UI.editor.addEventListener('keyup', highlightTargetElement);
        
        function analyzeCode(html) { 
            const ast = parseHTML(html);
            UI.tree.innerHTML = !html.trim() ? '<div class="empty-msg">결과가 나타납니다.</div>' : renderTree(ast); 
            
            // 👇 신규 추가: 렌더링된 화면과 코드를 1:1로 매핑하는 가상의 그림자 지도 생성
            domElementMap = [];
            function mapElements(nodes) {
                for(let nd of nodes) {
                    if(nd.n !== '#t') { 
                        domElementMap.push(nd);
                        if(nd.c && nd.c.length > 0) mapElements(nd.c);
                    }
                }
            }
            mapElements(ast);
            if(isTrackerOn) highlightTargetElement();
        }

        function openPop(k, kn, v) { 
            currKey = k; currVal = v; 
            UI.propName.textContent = kn; 
            renderChat();
            UI.popup.classList.remove('show');
            UI.bulb.style.display = 'flex';
        }
        
        const maximizeExplanation = () => { UI.bulb.style.display = 'none'; UI.popup.classList.add('show'); };
        const minimizeExplanation = () => { UI.popup.classList.remove('show'); UI.bulb.style.display = 'flex'; };
        const closeExplanation = () => { UI.popup.classList.remove('show'); UI.bulb.style.display = 'none'; };

        function hlTag(e, s, end, n, kn) {
            if(e) e.stopPropagation(); UI.editor.focus({preventScroll:true}); UI.editor.setSelectionRange(s, end);
            if(n && n !== '#t') openPop(['div','details','span'].includes(n)?n:'태그', kn, '전체');
            highlightTargetElement(); // 클릭 시 함께 연동되도록 추가
        }

        function hlProp(e, s, oe, k, kn, v) {
            e.stopPropagation(); const c = UI.editor.value, tc = c.substring(s, oe), rx = new RegExp(`(?<![\\w-])${k.replace(/-/g, '\\-')}\\s*:\\s*[^;"]+`, 'i'), m = tc.match(rx);
            UI.editor.focus({preventScroll:true});
            if (m) UI.editor.setSelectionRange(s + m.index, s + m.index + m[0].length); else UI.editor.setSelectionRange(s, oe);
            openPop(k, kn, v);
            highlightTargetElement(); // 클릭 시 함께 연동되도록 추가
        }

        function switchSlot(num) {
            if(currentSlot===num) return; store.set('htmlCodeSlot_'+currentSlot, UI.editor.value); currentSlot=num;
            document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active')); $('slot-'+num).classList.add('active'); loadData(num); closeExplanation();
        }

        function loadData(n) { UI.editor.value = store.get('htmlCodeSlot_'+n)||''; UI.editor.dispatchEvent(new Event('input')); }
        const copyCode = () => !UI.editor.value ? alert('내용이 없습니다.') : navigator.clipboard.writeText(UI.editor.value).then(()=>alert('복사 완료!'));

        if (window.visualViewport) {
            const adjustKeyboard = () => {
                let offset = window.innerHeight - (window.visualViewport.height + window.visualViewport.offsetTop);
                if (offset < 0) offset = 0;
                
                const popupBase = window.innerWidth <= 768 ? 20 : 25;
                UI.popup.style.bottom = (offset + popupBase) + 'px';
                UI.bulb.style.bottom = (offset + 30) + 'px';
            };
            window.visualViewport.addEventListener('resize', adjustKeyboard);
            window.visualViewport.addEventListener('scroll', adjustKeyboard);
        }
    </script>
</body>
