<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자유도 MAX 상태창 에디터</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-title { font-size: 20px; font-weight: bold; color: #c0caf5; border-bottom: 2px solid #414868; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; }

        /* 💡 도구 모음 (툴바) */
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; background-color: #24283b; padding: 12px; border-radius: 12px; border: 1px solid #414868; }
        .tool-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; flex-grow: 1; }
        .tool-btn:active { background-color: #7aa2f7; color: #1a1b26; }

        .workspace { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .workspace { flex-direction: row; } }
        
        .canvas-section { flex: 2; display: flex; flex-direction: column; }
        .property-section { flex: 1; background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; position: sticky; top: 20px; height: fit-content; }

        /* 💡 그림판 캔버스 영역 */
        #canvas { 
            position: relative; 
            width: 100%; 
            height: 500px; /* 고정 높이 캔버스 */
            background-color: #ffffff; 
            background-image: radial-gradient(#cbd5e1 1px, transparent 0); 
            background-size: 20px 20px; 
            border: 2px solid #565f89; 
            border-radius: 8px; 
            overflow: hidden; 
            touch-action: none; /* 모바일에서 드래그 시 화면 스크롤 방지 */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* 캔버스 내부 요소 (박스/텍스트) */
        .canvas-el { position: absolute; box-sizing: border-box; cursor: grab; user-select: none; word-break: break-all; }
        .canvas-el:active { cursor: grabbing; }
        
        /* 선택된 요소의 외곽선 및 리사이즈 핸들 */
        .canvas-el.selected { border: 2px dashed #f7768e !important; z-index: 100; }
        .resize-handle { 
            position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; 
            background-color: #f7768e; border-radius: 50%; cursor: nwse-resize; display: none; z-index: 101;
        }
        .canvas-el.selected .resize-handle { display: block; }

        /* 속성 편집기 패널 */
        .prop-group { margin-bottom: 12px; }
        .prop-group label { display: flex; justify-content: space-between; font-size: 12px; color: #a9b1d6; margin-bottom: 5px; font-weight: bold; }
        .prop-input, textarea { background-color: #1a1b26; color: #c0caf5; border: 1px solid #414868; border-radius: 6px; padding: 8px; font-size: 13px; width: 100%; box-sizing: border-box; outline: none; }
        textarea { resize: vertical; min-height: 60px; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { width: 35px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; }
        input[type="range"] { flex-grow: 1; accent-color: #7aa2f7; }

        /* 결과 코드 출력 */
        .code-box { background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 8px; padding: 15px; font-family: Consolas, monospace; font-size: 12px; min-height: 100px; word-break: break-all; white-space: pre-wrap; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        .action-btn { background-color: #9ece6a; color: #1a1b26; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }

        @media (hover: hover) {
            .tool-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .action-btn:hover { background-color: #73daca; }
        }
        
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-title">
            <span>🎨 자유 캔버스 에디터</span>
        </div>

        <!-- 툴바 -->
        <div class="toolbar">
            <button class="tool-btn" onclick="addElement('box')">🟦 상자(도형) 추가</button>
            <button class="tool-btn" onclick="addElement('text')">📝 텍스트 추가</button>
            <button class="tool-btn" onclick="deleteSelected()" style="background-color: #59444a; color: #f7768e;">🗑️ 선택 삭제</button>
            <button class="tool-btn" onclick="bringToFront()">⬆️ 맨 앞으로</button>
        </div>

        <div class="workspace">
            <!-- 그림판 (캔버스) 영역 -->
            <div class="canvas-section">
                <div class="section-title">✨ 캔버스 (드래그하여 이동 & 우측 하단 점으로 크기 조절)</div>
                <div id="canvas"></div>
                
                <div style="margin-top: 20px;">
                    <div class="section-title">📝 완성된 HTML 코드 (반응형 자동 변환)</div>
                    <button class="action-btn" onclick="copyCode(this)">전체 코드 복사하기</button>
                    <div id="codeBox" class="code-box"></div>
                </div>
            </div>

            <!-- 속성 편집 영역 -->
            <div class="property-section">
                <div class="section-title">🛠️ 속성 편집기</div>
                <div id="inspector">
                    <div class="empty-msg">캔버스에서 요소를 선택해주세요.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const inspector = document.getElementById('inspector');
        const codeBox = document.getElementById('codeBox');
        
        let elements = [];
        let selectedId = null;
        
        // 드래그 & 리사이즈 상태 관리
        let isDragging = false;
        let isResizing = false;
        let startX, startY, initialLeft, initialTop, initialWidth, initialHeight;

        // 고유 ID 생성
        function generateId() { return 'el_' + Date.now().toString(36); }

        // 요소 추가
        function addElement(type) {
            const newEl = {
                id: generateId(),
                type: type,
                x: 50, y: 50, // 기본 위치 (px)
                w: type === 'box' ? 150 : 200, 
                h: type === 'box' ? 100 : 50,
                style: {
                    text: type === 'text' ? '텍스트를 입력하세요' : '',
                    bgColor: type === 'box' ? '#24283b' : 'transparent',
                    color: type === 'box' ? '#c0caf5' : '#1a1b26',
                    fontSize: 14,
                    borderWidth: type === 'box' ? 2 : 0,
                    borderColor: '#414868',
                    borderRadius: 8,
                    padding: 10,
                    zIndex: elements.length + 1
                }
            };
            elements.push(newEl);
            selectedId = newEl.id;
            renderCanvas();
        }

        function deleteSelected() {
            if (!selectedId) return alert('삭제할 요소를 먼저 클릭해서 선택해주세요.');
            elements = elements.filter(el => el.id !== selectedId);
            selectedId = null;
            renderCanvas();
        }

        function bringToFront() {
            if (!selectedId) return;
            const el = elements.find(e => e.id === selectedId);
            const maxZ = Math.max(...elements.map(e => e.style.zIndex), 0);
            el.style.zIndex = maxZ + 1;
            renderCanvas();
        }

        // ==========================================
        // 💡 드래그 & 드롭 & 리사이즈 (핵심 엔진)
        // ==========================================
        canvas.addEventListener('pointerdown', e => {
            const target = e.target;
            
            // 리사이즈 핸들을 클릭했을 때
            if (target.classList.contains('resize-handle')) {
                isResizing = true;
                selectedId = target.parentElement.id;
                const el = elements.find(e => e.id === selectedId);
                startX = e.clientX; startY = e.clientY;
                initialWidth = el.w; initialHeight = el.h;
                e.preventDefault();
            } 
            // 캔버스 안의 요소를 클릭했을 때 (드래그 시작)
            else if (target.classList.contains('canvas-el')) {
                isDragging = true;
                selectedId = target.id;
                const el = elements.find(e => e.id === selectedId);
                startX = e.clientX; startY = e.clientY;
                initialLeft = el.x; initialTop = el.y;
                canvas.setPointerCapture(e.pointerId); // 터치 이탈 방지
                e.preventDefault();
            } 
            // 빈 캔버스를 클릭했을 때 (선택 해제)
            else {
                selectedId = null;
            }
            renderCanvas();
        });

        canvas.addEventListener('pointermove', e => {
            if (!selectedId) return;
            const el = elements.find(e => e.id === selectedId);
            
            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                // 캔버스 밖으로 나가지 않도록 제한(옵션)할 수 있지만 완벽한 자유를 위해 냅둡니다.
                el.x = initialLeft + dx;
                el.y = initialTop + dy;
                
                // DOM만 빠르게 업데이트 (성능 향상)
                const domEl = document.getElementById(el.id);
                domEl.style.left = el.x + 'px';
                domEl.style.top = el.y + 'px';
            } 
            else if (isResizing) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                // 최소 크기 제한 (20px)
                el.w = Math.max(20, initialWidth + dx);
                el.h = Math.max(20, initialHeight + dy);
                
                const domEl = document.getElementById(el.id);
                domEl.style.width = el.w + 'px';
                domEl.style.height = el.h + 'px';
            }
        });

        canvas.addEventListener('pointerup', e => {
            if (isDragging || isResizing) {
                isDragging = false;
                isResizing = false;
                canvas.releasePointerCapture(e.pointerId);
                renderCanvas(); // 최종 데이터 저장 및 HTML 출력 업데이트
            }
        });

        // ==========================================
        // 💡 렌더링 및 HTML 출력
        // ==========================================
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

        function updateProp(key, value) {
            const el = elements.find(e => e.id === selectedId);
            if (el) {
                el.style[key] = value;
                const valDisplay = document.getElementById(`val_${key}`);
                if (valDisplay) valDisplay.textContent = value;
                renderCanvas();
            }
        }

        // 화면 그리기
        function renderCanvas() {
            canvas.innerHTML = '';
            
            elements.forEach(el => {
                const s = el.style;
                const div = document.createElement('div');
                div.id = el.id;
                div.className = `canvas-el ${el.id === selectedId ? 'selected' : ''}`;
                
                // 캔버스 내부는 px로 그림
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.w + 'px';
                div.style.height = el.h + 'px';
                div.style.zIndex = s.zIndex;
                
                // 스타일 적용
                div.style.backgroundColor = s.bgColor;
                div.style.border = `${s.borderWidth}px solid ${s.borderColor}`;
                div.style.borderRadius = `${s.borderRadius}px`;
                div.style.padding = `${s.padding}px`;
                div.style.color = s.color;
                div.style.fontSize = `${s.fontSize}px`;
                
                if (el.type === 'text' || s.text) {
                    div.innerHTML = escapeHTML(s.text).replace(/\n/g, '<br>');
                }

                // 리사이즈 핸들 추가
                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                div.appendChild(handle);
                
                canvas.appendChild(div);
            });

            renderInspector();
            generateFinalHTML();
        }

        // 💡 핵심: px을 %로 자동 변환하여 스마트폰에서도 안 깨지게 만드는 마법의 함수!
        function generateFinalHTML() {
            if(elements.length === 0) {
                codeBox.textContent = '도구를 사용해 캔버스에 요소를 추가하세요.';
                return;
            }

            const cWidth = canvas.clientWidth;
            const cHeight = canvas.clientHeight;
            const baseRule = "box-sizing:border-box; word-break:keep-all; text-wrap:pretty;";

            // 부모 컨테이너 (비율 유지)
            let html = `<div style="position:relative; width:100%; max-width:800px; aspect-ratio:${cWidth}/${cHeight}; margin:0 auto; overflow:hidden; background:transparent;">\n`;

            elements.forEach(el => {
                const s = el.style;
                // px -> % 변환
                const leftPct = (el.x / cWidth * 100).toFixed(2);
                const topPct = (el.y / cHeight * 100).toFixed(2);
                const widthPct = (el.w / cWidth * 100).toFixed(2);
                const heightPct = (el.h / cHeight * 100).toFixed(2);

                const inlineStyle = `position:absolute; left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%; background-color:${s.bgColor}; border:${s.borderWidth}px solid ${s.borderColor}; border-radius:${s.borderRadius}px; padding:${s.padding}px; color:${s.color}; font-size:${s.fontSize}px; z-index:${s.zIndex}; ${baseRule}`;

                html += `  <div style="${inlineStyle}">${escapeHTML(s.text).replace(/\n/g, '<br>')}</div>\n`;
            });

            html += `</div>`;
            codeBox.textContent = html;
        }

        function renderInspector() {
            if (!selectedId) {
                inspector.innerHTML = '<div class="empty-msg">캔버스에서 요소를 선택해주세요.</div>';
                return;
            }
            
            const el = elements.find(e => e.id === selectedId);
            const s = el.style;

            let html = `
                <div class="prop-group">
                    <label>텍스트 내용</label>
                    <textarea oninput="updateProp('text', this.value)">${escapeHTML(s.text)}</textarea>
                </div>
                <div class="flex-row prop-group">
                    <label style="flex:1;">배경 색상</label>
                    <input type="color" value="${s.bgColor === 'transparent' ? '#ffffff' : s.bgColor}" onchange="updateProp('bgColor', this.value)">
                    <button class="tool-btn" style="flex:1; padding:4px;" onclick="updateProp('bgColor', 'transparent')">투명하게</button>
                </div>
                <div class="flex-row prop-group">
                    <label style="flex:1;">글자 색상</label>
                    <input type="color" value="${s.color}" oninput="updateProp('color', this.value)">
                </div>
                <div class="prop-group">
                    <label>글자 크기 <span id="val_fontSize">${s.fontSize}</span>px</label>
                    <input type="range" min="10" max="60" value="${s.fontSize}" oninput="updateProp('fontSize', this.value)">
                </div>
                <div class="prop-group">
                    <label>안쪽 여백 <span id="val_padding">${s.padding}</span>px</label>
                    <input type="range" min="0" max="50" value="${s.padding}" oninput="updateProp('padding', this.value)">
                </div>
                <div class="prop-group">
                    <label>모서리 둥글기 <span id="val_borderRadius">${s.borderRadius}</span>px</label>
                    <input type="range" min="0" max="100" value="${s.borderRadius}" oninput="updateProp('borderRadius', this.value)">
                </div>
                <div class="flex-row prop-group">
                    <label style="flex:1;">테두리 색상</label>
                    <input type="color" value="${s.borderColor}" oninput="updateProp('borderColor', this.value)">
                </div>
                <div class="prop-group">
                    <label>테두리 굵기 <span id="val_borderWidth">${s.borderWidth}</span>px</label>
                    <input type="range" min="0" max="10" value="${s.borderWidth}" oninput="updateProp('borderWidth', this.value)">
                </div>
            `;
            inspector.innerHTML = html;
        }

        function copyCode(btn) {
            const code = codeBox.textContent;
            if(!code || elements.length === 0) return alert('복사할 코드가 없습니다.');
            navigator.clipboard.writeText(code).then(() => {
                const origin = btn.textContent;
                btn.textContent = '복사 완료!';
                setTimeout(() => { btn.textContent = origin; }, 1000);
            });
        }
    </script>
</body>
</html>
