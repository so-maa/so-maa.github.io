<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 HTML 메이커</title>
    <style>
        /* 기존 테마 색상 유지 */
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; padding: 20px; padding-bottom: 100px; margin: 0; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-title { font-size: 20px; font-weight: bold; color: #c0caf5; margin-bottom: 5px; border-bottom: 2px solid #414868; padding-bottom: 10px; }
        
        /* 1. 미리보기 영역 스타일 */
        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .preview-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 20px; min-height: 100px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow-x: hidden; }

        /* 2. 블록 추가 팔레트 영역 */
        .palette-group { display: flex; flex-wrap: wrap; gap: 8px; background-color: #1a1b26; border: 1px dashed #565f89; padding: 15px; border-radius: 12px; }
        .add-block-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 20px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        
        /* 3. 에디터(블록 리스트) 영역 */
        .builder-list { display: flex; flex-direction: column; gap: 10px; }
        .block-editor { background-color: #24283b; border-left: 4px solid #7aa2f7; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .block-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; color: #565f89; }
        .block-actions { display: flex; gap: 5px; }
        .icon-btn { background: none; border: none; color: #565f89; font-size: 14px; cursor: pointer; padding: 2px 5px; transition: color 0.2s; }
        
        /* 입력창 스타일 */
        input[type="text"], textarea { background-color: #1a1b26; color: #c0caf5; border: 1px solid #414868; border-radius: 6px; padding: 10px; font-size: 14px; font-family: inherit; width: 100%; box-sizing: border-box; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: #7aa2f7; }
        textarea { resize: vertical; min-height: 60px; }
        
        /* 가로 분할 입력창 (스탯용) */
        .flex-row { display: flex; gap: 10px; }
        
        /* 4. 최종 코드 결과창 */
        .code-box { background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 8px; padding: 15px; font-family: Consolas, monospace; font-size: 12px; min-height: 100px; word-break: break-all; white-space: pre-wrap; }
        .copy-code-btn { background-color: #9ece6a; color: #1a1b26; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }

        @media (hover: hover) {
            .add-block-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .icon-btn:hover { color: #c0caf5; }
            .icon-btn.delete:hover { color: #f7768e; }
            .copy-code-btn:hover { background-color: #73daca; }
        }
        .add-block-btn:active { background-color: #7aa2f7; color: #1a1b26; }
        .copy-code-btn:active { background-color: #73daca; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">✨ 상태창 메이커</div>

        <!-- 1. 미리보기 영역 -->
        <div>
            <div class="section-title">👀 실시간 미리보기</div>
            <div id="previewBox" class="preview-box">
                <!-- 자바스크립트가 여기에 HTML을 렌더링합니다 -->
                <div style="text-align: center; color: #565f89; margin-top: 30px;">아래에서 블록을 추가해 보세요!</div>
            </div>
        </div>

        <!-- 2. 블록 팔레트 영역 -->
        <div>
            <div class="section-title">🧱 요소 추가하기</div>
            <div class="palette-group">
                <button class="add-block-btn" onclick="addBlock('title')">+ 메인 타이틀</button>
                <button class="add-block-btn" onclick="addBlock('stat')">+ 스탯(항목:값)</button>
                <button class="add-block-btn" onclick="addBlock('quote')">+ 인용구/설명</button>
                <button class="add-block-btn" onclick="addBlock('accordion')">+ 접기/펼치기</button>
                <button class="add-block-btn" onclick="addBlock('divider')">+ 구분선(줄)</button>
            </div>
        </div>

        <!-- 3. 작업 영역 (리스트) -->
        <div>
            <div class="section-title">🛠️ 내용 편집</div>
            <div id="builderList" class="builder-list"></div>
        </div>

        <!-- 4. 결과 코드 출력 영역 -->
        <div>
            <div class="section-title">
                <span>📝 생성된 HTML 코드</span>
                <button class="copy-code-btn" id="copyCodeBtn" onclick="copyResultCode(this)">코드 복사</button>
            </div>
            <div id="codeBox" class="code-box"></div>
        </div>
    </div>

    <script>
        // 현재 조립 중인 블록들의 데이터를 담는 배열
        let blocks = [];

        // HTML 생성 템플릿 (플랫폼 규칙 엄수: 인라인 스타일, 허용 태그만 사용, 반응형 처리)
        const templates = {
            title: (data) => `<h3 style="max-width:100%; width:100%; word-break:keep-all; text-wrap:pretty; text-align:center; padding:10px 0; border-bottom:2px solid #7aa2f7; color:#c0caf5; margin:15px 0 10px 0;"><strong>${escapeHTML(data.text || '제목을 입력하세요')}</strong></h3>`,
            
            stat: (data) => `<div style="display:flex; justify-content:space-between; max-width:100%; width:100%; word-break:keep-all; text-wrap:pretty; border-bottom:1px dotted #414868; padding:8px 0; margin-bottom:2px;"><strong style="color:#a9b1d6;">${escapeHTML(data.name || '항목')}</strong><span style="color:#c0caf5;">${escapeHTML(data.value || '값')}</span></div>`,
            
            quote: (data) => `<blockquote style="max-width:100%; width:100%; word-break:keep-all; text-wrap:pretty; border-left:4px solid #f7768e; margin:15px 0; padding:10px 15px; color:#a9b1d6; background-color:rgba(247,118,142,0.05); box-sizing:border-box;">${escapeHTML(data.text || '설명이나 대사를 입력하세요').replace(/\n/g, '<br>')}</blockquote>`,
            
            accordion: (data) => `<details style="max-width:100%; width:100%; margin:15px 0;"><summary style="cursor:pointer; font-weight:bold; color:#7aa2f7; word-break:keep-all; padding:5px 0;">${escapeHTML(data.title || '클릭해서 펼치기')}</summary><div style="padding:15px; border:1px dashed #414868; margin-top:5px; word-break:keep-all; text-wrap:pretty; color:#a9b1d6; box-sizing:border-box;">${escapeHTML(data.text || '숨겨진 내용').replace(/\n/g, '<br>')}</div></details>`,
            
            divider: () => `<hr style="border:0; height:1px; background-color:#565f89; margin:20px 0; max-width:100%; width:100%;">`
        };

        const previewBox = document.getElementById('previewBox');
        const builderList = document.getElementById('builderList');
        const codeBox = document.getElementById('codeBox');
        const copyCodeBtn = document.getElementById('copyCodeBtn');

        // XSS 방지 및 안전한 출력을 위한 치환 함수
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // 새로운 요소 추가 함수
        function addBlock(type) {
            const newBlock = { type: type, id: Date.now() };
            if(type === 'title') newBlock.text = '';
            if(type === 'stat') { newBlock.name = ''; newBlock.value = ''; }
            if(type === 'quote') newBlock.text = '';
            if(type === 'accordion') { newBlock.title = ''; newBlock.text = ''; }
            
            blocks.push(newBlock);
            renderUI();
            
            // 추가 후 스크롤을 맨 아래로 내려줌
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        // 블록 순서 이동
        function moveBlock(index, dir) {
            if (dir === 'up' && index > 0) {
                [blocks[index - 1], blocks[index]] = [blocks[index], blocks[index - 1]];
            } else if (dir === 'down' && index < blocks.length - 1) {
                [blocks[index + 1], blocks[index]] = [blocks[index], blocks[index + 1]];
            }
            renderUI();
        }

        // 블록 삭제
        function deleteBlock(index) {
            blocks.splice(index, 1);
            renderUI();
        }

        // 입력창 값 변경 시 배열 업데이트
        function updateBlockData(index, field, element) {
            blocks[index][field] = element.value;
            renderPreviewAndCode();
        }

        // 전체 화면 다시 그리기
        function renderUI() {
            builderList.innerHTML = '';
            
            if(blocks.length === 0) {
                previewBox.innerHTML = '<div style="text-align: center; color: #565f89; margin-top: 30px;">아래에서 요소를 추가해 보세요!</div>';
                codeBox.textContent = '<!-- 코드가 여기에 생성됩니다 -->';
                return;
            }

            blocks.forEach((block, index) => {
                const editorDiv = document.createElement('div');
                editorDiv.className = 'block-editor';
                
                // 블록 상단 헤더 (이름 및 컨트롤 버튼)
                let typeName = '';
                if(block.type === 'title') typeName = '📌 메인 타이틀';
                if(block.type === 'stat') typeName = '📊 스탯 (항목:값)';
                if(block.type === 'quote') typeName = '💬 인용구/설명';
                if(block.type === 'accordion') typeName = '📂 접기/펼치기';
                if(block.type === 'divider') typeName = '➖ 구분선';

                let html = `
                    <div class="block-header">
                        <span>${typeName}</span>
                        <div class="block-actions">
                            <button class="icon-btn" onclick="moveBlock(${index}, 'up')" title="위로">↑</button>
                            <button class="icon-btn" onclick="moveBlock(${index}, 'down')" title="아래로">↓</button>
                            <button class="icon-btn delete" onclick="deleteBlock(${index})" title="삭제">✕</button>
                        </div>
                    </div>
                `;

                // 타입별 입력 폼 구성
                if(block.type === 'title') {
                    html += `<input type="text" placeholder="예: ✨ 용사 상태창" value="${block.text}" oninput="updateBlockData(${index}, 'text', this)">`;
                } 
                else if(block.type === 'stat') {
                    html += `
                        <div class="flex-row">
                            <input type="text" placeholder="항목 (예: 체력)" style="flex:1;" value="${block.name}" oninput="updateBlockData(${index}, 'name', this)">
                            <input type="text" placeholder="값 (예: 999/999)" style="flex:2;" value="${block.value}" oninput="updateBlockData(${index}, 'value', this)">
                        </div>`;
                }
                else if(block.type === 'quote') {
                    html += `<textarea placeholder="설명이나 대사를 입력하세요." oninput="updateBlockData(${index}, 'text', this)">${block.text}</textarea>`;
                }
                else if(block.type === 'accordion') {
                    html += `
                        <input type="text" placeholder="펼치기 버튼 제목 (예: 소지품 보기)" value="${block.title}" oninput="updateBlockData(${index}, 'title', this)">
                        <textarea placeholder="숨겨진 내용을 입력하세요." oninput="updateBlockData(${index}, 'text', this)">${block.text}</textarea>`;
                }
                else if(block.type === 'divider') {
                    html += `<div style="color: #565f89; font-size: 12px; padding: 5px 0;">(내용을 입력하지 않는 요소입니다)</div>`;
                }

                editorDiv.innerHTML = html;
                builderList.appendChild(editorDiv);
            });

            renderPreviewAndCode();
        }

        // 미리보기 및 HTML 코드 문자열 업데이트
        function renderPreviewAndCode() {
            let finalHTML = '';
            blocks.forEach(block => {
                finalHTML += templates[block.type](block) + '\n';
            });

            // 미리보기 영역에 삽입
            previewBox.innerHTML = finalHTML;
            // 코드 영역에 삽입
            codeBox.textContent = finalHTML;
        }

        // 결과 코드 복사 기능
        function copyResultCode(btn) {
            if(btn) btn.blur();
            const textToCopy = codeBox.textContent;
            if(!textToCopy || blocks.length === 0) {
                alert('복사할 코드가 없습니다!');
                return;
            }
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyCodeBtn.textContent = '완료!';
                setTimeout(() => { copyCodeBtn.textContent = '코드 복사'; }, 1000);
            }).catch(err => {
                alert('복사에 실패했습니다.');
            });
        }
    </script>
</body>
</html>
