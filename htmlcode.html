<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML 해독기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; display: flex; justify-content: center; }
        
        .app-wrapper { width: 100%; max-width: 900px; transition: filter 0.3s ease; }
        .app-wrapper.blurred { filter: blur(8px) brightness(0.6); pointer-events: none; user-select: none; }
        
        .app-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 10px; }
        .tracker-title { font-size: 20px; font-weight: bold; color: #c0caf5; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
        
        .slot-container { display: flex; gap: 6px; }
        .slot-btn { background-color: #24283b; color: #565f89; border: 1px solid #414868; border-radius: 6px; width: 32px; height: 32px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
        .slot-btn.active { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }

        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 1단계 모바일 화면 꽉 차게 넓이 및 상하 테두리 조정 */
        .preview-box { width: calc(100% + 30px); margin-left: -15px; box-sizing: border-box; background-color: #ffffff; background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 15px 15px; border-top: 2px dashed #565f89; border-bottom: 2px dashed #565f89; border-left: none; border-right: none; border-radius: 0; padding: 15px; min-height: 150px; overflow-x: hidden; color: #333; }

        /* 2단계 모바일 화면 꽉 차게 넓이 및 상하 테두리 조정 */
        .code-editor-container { width: calc(100% + 30px); margin-left: -15px; box-sizing: border-box; }
        .code-textarea { width: 100%; height: 250px; background-color: #16161e; color: #9ece6a; border-top: 1px solid #414868; border-bottom: 1px solid #414868; border-left: none; border-right: none; border-radius: 0; padding: 15px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5; }
        .code-textarea:focus { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2); }
        .code-textarea::selection { background-color: #364A82; color: #ffffff; }

        .usage-bar { display: none; background-color: rgba(187, 154, 247, 0.08); border: 1px dashed #bb9af7; border-radius: 8px; padding: 10px 12px; align-items: center; justify-content: space-between; }
        .usage-bar.active { display: flex; }
        .usage-text { font-size: 11px; font-weight: bold; color: #bb9af7; }
        .usage-subtext { font-size: 10px; color: #a9b1d6; }

        .structure-box { width: 100%; box-sizing: border-box; background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        
        .tree-node { margin: 4px 0; font-size: 13px; line-height: 1.4; }
        .tree-summary { display: inline-block; padding: 6px 10px; background-color: #1f2335; border: 1px solid #414868; border-radius: 6px; cursor: pointer; transition: all 0.2s; color: #c0caf5; user-select: none; word-break: break-all; font-weight: bold; }
        .tree-summary:hover { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        
        .prop-list { margin-top: 5px; margin-bottom: 10px; padding-left: 15px; display: flex; flex-direction: column; gap: 4px; }
        .prop-item { display: flex; align-items: center; padding: 4px 8px; background-color: #1a1b26; border: 1px dashed #414868; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; color: #a9b1d6; }
        .prop-item:hover { background-color: #364A82; color: #fff; border-color: #7aa2f7; }
        .prop-name { color: #9ece6a; font-weight: bold; width: 130px; flex-shrink: 0; }
        .prop-value { color: #c0caf5; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        /* 2단계 연동 시 빛나는 효과 */
        .highlight-match { border: 1px solid #f7768e !important; box-shadow: 0 0 8px rgba(247, 118, 142, 0.4); }

        .tree-children { margin-left: 15px; padding-left: 10px; border-left: 2px dashed #414868; margin-top: 4px; display: flex; flex-direction: column; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; background-color: #414868; color: #a9b1d6; }
        .badge.box { background-color: #7aa2f7; color: #1a1b26; }
        .badge.text { background-color: #bb9af7; color: #1a1b26; }
        .badge.special { background-color: #f7768e; color: #1a1b26; }
        
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
        .action-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background-color: #7aa2f7; color: #1a1b26; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary { background-color: #364A82; border-color: #7aa2f7; color: #fff; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7aa2f7; }

        /* 💡 동그란 단축키 (FAB) */
        .fab-btn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background-color: #bb9af7; color: #1a1b26; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; z-index: 9998; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0); }
        .fab-btn.show { transform: scale(1); }

        /* 💡 선생님 팝업창 (크기 축소 및 마이너스 버튼 추가) */
        .explanation-popup { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 150%); width: 90vw; max-width: 330px; background-color: #1f2335; border: 2px solid #bb9af7; border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 10000; display: flex; flex-direction: column; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .explanation-popup.show { transform: translate(-50%, 0); }
        
        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #414868; padding-bottom: 8px; }
        .popup-title-group { display: flex; align-items: center; gap: 8px; }
        .popup-title { color: #bb9af7; font-weight: bold; font-size: 13px; }
        
        /* 초기화 버튼 위치 이동 */
        .reset-btn { font-size: 11px; font-weight: bold; background: transparent; border: 1px solid #414868; color: #a9b1d6; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .reset-btn:hover { border-color: #f7768e; color: #f7768e; }
        
        .popup-controls { display: flex; gap: 10px; align-items: center; }
        .popup-ctrl-btn { background: none; border: none; color: #a9b1d6; font-size: 18px; cursor: pointer; padding: 0; font-weight: bold; }
        .popup-ctrl-btn:hover { color: #f7768e; }
        
        .popup-prop-name { color: #1a1b26; font-weight: bold; font-size: 13px; background-color: #bb9af7; padding: 6px; border-radius: 6px; text-align: center; margin-top: 5px; }
        
        .chat-log { max-height: 200px; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .chat-msg { font-size: 12px; line-height: 1.5; padding: 10px; border-radius: 8px; word-break: keep-all; }
        .chat-msg.ai { background-color: #24283b; color: #c0caf5; border: 1px solid #414868; border-top-left-radius: 0; }
        .chat-msg.user { background-color: #364A82; color: #ffffff; align-self: flex-end; border-top-right-radius: 0; }
        
        .ai-req-btn { background-color: transparent; border: 1px solid #bb9af7; color: #bb9af7; width: 100%; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .ai-req-btn:hover { background-color: #bb9af7; color: #1a1b26; }
        .retry-btn { font-size: 11px; background: #f7768e; color: #1a1b26; border: none; padding: 4px 8px; border-radius: 4px; margin-top: 5px; font-weight: bold; cursor: pointer; }

        .chat-input-row { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input { flex: 1; background-color: #1a1b26; border: 1px solid #414868; color: #c0caf5; padding: 8px 12px; border-radius: 20px; font-size: 12px; outline: none; font-family: inherit; }
        .chat-input:focus { border-color: #bb9af7; }
        .chat-send-btn { background-color: #bb9af7; color: #1a1b26; border: none; border-radius: 20px; padding: 0 15px; font-weight: bold; cursor: pointer; font-size: 12px; }

        @media (min-width: 768px) {
            .explanation-popup { left: 30px; transform: translateX(-150%); }
            .explanation-popup.show { transform: translateX(0); }
        }

        /* 💡 시작 창 크기 축소 */
        .intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: flex; justify-content: center; align-items: center; background-color: rgba(26, 27, 38, 0.5); }
        .intro-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 25px; width: 90%; max-width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .intro-box h2 { margin: 0; font-size: 16px; color: #bb9af7; }
        .intro-box p { margin: 0; font-size: 12px; color: #a9b1d6; line-height: 1.5; }
        
        .intro-btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .intro-btn { padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-no-api { background-color: #414868; color: #c0caf5; }
        .btn-yes-api { background-color: #bb9af7; color: #1a1b26; }

        .api-input-container { display: none; flex-direction: column; gap: 10px; margin-top: 5px; }
        .api-input { padding: 10px; border-radius: 8px; border: 1px solid #414868; background-color: #1a1b26; color: #c0caf5; outline: none; font-size: 12px; }
        .api-input:focus { border-color: #bb9af7; }
    </style>
</head>
<body>

    <div id="introOverlay" class="intro-overlay">
        <div class="intro-box">
            <h2>✨ AI 해독기 설정</h2>
            <p>API 키를 설정해주세요.<br>(기존 데이터는 보존되어 있습니다)</p>
            
            <div class="intro-btn-group" id="introBtnGroup">
                <button class="intro-btn btn-no-api" onclick="selectNoApi()">API키가 없습니다 (기본사전)</button>
                <button class="intro-btn btn-yes-api" onclick="selectYesApi()">API키가 있습니다 (AI 선생님)</button>
            </div>

            <div class="api-input-container" id="apiInputContainer">
                <input type="text" id="introApiInput" class="api-input" placeholder="AIzaSy... (키를 붙여넣으세요)">
                <button class="intro-btn btn-yes-api" onclick="submitApiKey()">입력 완료 및 시작</button>
            </div>
        </div>
    </div>

    <div id="appWrapper" class="app-wrapper blurred">
        <div class="app-container">
            <div class="top-nav-bar">
                <div class="tracker-title">HTML 해독기</div>
                <div class="slot-container">
                    <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
                    <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
                    <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
                    <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
                    <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
                </div>
            </div>

            <div>
                <div class="section-title">👀 1단계: 실시간 미리보기</div>
                <div id="previewBox" class="preview-box"></div>
            </div>

            <div>
                <div class="section-title">
                    <span>💻 2단계: HTML 코드 편집기</span>
                    <button class="action-btn" onclick="copyCode()">코드 복사</button>
                </div>
                <div class="code-editor-container">
                    <textarea id="codeEditor" class="code-textarea" placeholder="여기에 상태창 코드를 붙여넣으세요!"></textarea>
                </div>
            </div>

            <!-- 사용량 표시 바 -->
            <div id="usageBar" class="usage-bar">
                <span class="usage-text" id="usageCountText"></span>
                <span class="usage-subtext">Gemini 3.7 Flash</span>
            </div>

            <div>
                <!-- 💡 (항목을 눌러 선생님을 호출하세요!) 문구 제거됨 -->
                <div class="section-title">📖 3단계: 구조 분석</div>
                <div id="structureBox" class="structure-box">
                    <div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 💡 동그란 단축키 (FAB) -->
    <div id="fabBtn" class="fab-btn" onclick="openPopupFromFab()">💡</div>

    <!-- 💡 선생님 대화창 -->
    <div id="explanationPopup" class="explanation-popup">
        <div class="popup-header">
            <div class="popup-title-group">
                <span class="popup-title">✨ 1타 강사 상담소</span>
                <!-- 초기화 버튼 위치 변경 -->
                <button class="reset-btn" onclick="resetCurrentChat()">🔄 초기화</button>
            </div>
            <div class="popup-controls">
                <!-- 잠시 닫기(-) 버튼 추가 -->
                <button class="popup-ctrl-btn" onclick="minimizePopup()">─</button>
                <button class="popup-ctrl-btn" onclick="closeExplanation()">✕</button>
            </div>
        </div>
        <div class="popup-prop-name" id="popupPropName">속성 이름</div>
        
        <div id="chatLog" class="chat-log"></div>

        <div class="chat-input-row" id="chatInputRow" style="display: none;">
            <input type="text" id="chatInput" class="chat-input" placeholder="궁금한 점을 질문하세요!" onkeypress="if(event.key==='Enter') sendChatMsg()">
            <button class="chat-send-btn" onclick="sendChatMsg()">전송</button>
        </div>
    </div>

    <script>
        let geminiApiKey = null;
        const MODEL_NAME = "gemini-3.7-flash"; 
        let currentSlot = 1;
        let chatMemories = {}; 
        let currentContextKey = ''; 
        let currentContextValue = '';
        let lastFailedQuestion = ''; // 에러 시 다시 시도할 질문 저장

        const appWrapper = document.getElementById('appWrapper');
        const introOverlay = document.getElementById('introOverlay');
        const usageBar = document.getElementById('usageBar');
        const usageCountText = document.getElementById('usageCountText');
        const previewBox = document.getElementById('previewBox');
        const codeEditor = document.getElementById('codeEditor');
        const structureBox = document.getElementById('structureBox');
        
        const explanationPopup = document.getElementById('explanationPopup');
        const fabBtn = document.getElementById('fabBtn');
        const chatLog = document.getElementById('chatLog');
        const chatInputRow = document.getElementById('chatInputRow');
        const chatInput = document.getElementById('chatInput');

        // ==========================================
        // 1. 초기화 및 API
        // ==========================================
        window.onload = () => { 
            loadData(1); 
            const savedKey = localStorage.getItem('savedGeminiKey');
            if(savedKey) document.getElementById('introApiInput').value = savedKey;
        }

        function selectNoApi() { geminiApiKey = null; closeIntro(); }
        function selectYesApi() {
            document.getElementById('introBtnGroup').style.display = 'none';
            document.getElementById('apiInputContainer').style.display = 'flex';
        }
        function submitApiKey() {
            const key = document.getElementById('introApiInput').value.trim();
            if(key) {
                geminiApiKey = key; localStorage.setItem('savedGeminiKey', key);
                updateUsageDisplay(); closeIntro();
            } else alert('API 키를 입력해주세요!');
        }
        function closeIntro() { introOverlay.style.display = 'none'; appWrapper.classList.remove('blurred'); }

        // ==========================================
        // 2. 스마트 사용량 표시 (1500회 기준)
        // ==========================================
        function updateUsageDisplay() {
            if(!geminiApiKey) return;
            usageBar.classList.add('active');
            
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('geminiUsageData')) || { date: today, count: 0 };
            if (usageData.date !== today) { usageData = { date: today, count: 0 }; localStorage.setItem('geminiUsageData', JSON.stringify(usageData)); }

            const count = usageData.count;
            let statusHtml = '';
            
            if (count >= 1500) {
                statusHtml = `<span style="color:#f7768e;">(오늘 사용량을 모두 소진했습니다! 내일 밤 12시 충전)</span>`;
            } else if (count >= 1400) {
                statusHtml = `<span style="color:#e0af68;">(사용량을 꽤 많이 소진했어요! 내일 밤 12시 충전)</span>`;
            } else {
                statusHtml = `<span style="color:#a9b1d6;">(매일 밤 12시 충전)</span>`;
            }
            usageCountText.innerHTML = `오늘 이용: ${count}회 / 1,500회 ${statusHtml}`;
        }

        function incrementUsage() {
            let usageData = JSON.parse(localStorage.getItem('geminiUsageData'));
            usageData.count++;
            localStorage.setItem('geminiUsageData', JSON.stringify(usageData));
            updateUsageDisplay();
        }
        function getUsageCount() { return (JSON.parse(localStorage.getItem('geminiUsageData')) || {}).count || 0; }

        // ==========================================
        // 3. 2단계 클릭 시 -> 3단계 양방향 연동 (수정됨)
        // ==========================================
        codeEditor.addEventListener('click', () => {
            const cursor = codeEditor.selectionStart;
            const elements = document.querySelectorAll('.tree-summary, .prop-item');
            
            elements.forEach(el => el.classList.remove('highlight-match'));
            
            let match = null;
            elements.forEach(el => {
                const s = parseInt(el.getAttribute('data-start'));
                const e = parseInt(el.getAttribute('data-end'));
                if(cursor >= s && cursor <= e) match = el; // 제일 깊은 자식 덮어쓰기
            });
            
            if(match) {
                match.classList.add('highlight-match');
                // 부모 details 태그들 찾아서 스크롤 이동 없이 모두 열어주기
                let parent = match.parentElement;
                while (parent) {
                    if (parent.tagName === 'DETAILS') {
                        parent.open = true;
                    }
                    parent = parent.parentElement;
                }
            }
        });

        // ==========================================
        // 4. 모바일 키보드 제어 및 에디터 하이라이트
        // ==========================================
        function safeSelectRange(start, end) {
            // 강제 키보드 팝업 방지 기술
            const currentReadOnly = codeEditor.readOnly;
            codeEditor.readOnly = true; 
            codeEditor.focus({ preventScroll: true }); 
            codeEditor.setSelectionRange(start, end);
            setTimeout(() => { codeEditor.readOnly = currentReadOnly; }, 50);
        }

        codeEditor.addEventListener('input', () => {
            const html = codeEditor.value;
            previewBox.innerHTML = html; analyzeCode(html); saveData();
        });

        // ==========================================
        // 5. 플로팅 단축키(FAB) & 팝업 제어
        // ==========================================
        function triggerFab(key, koreanName, value) {
            currentContextKey = key; currentContextValue = value;
            document.getElementById('popupPropName').textContent = koreanName;
            
            explanationPopup.classList.remove('show');
            fabBtn.classList.add('show');
        }

        function openPopupFromFab() {
            fabBtn.classList.remove('show');
            explanationPopup.classList.add('show');
            renderChatUI();
        }

        function minimizePopup() {
            explanationPopup.classList.remove('show');
            fabBtn.classList.add('show');
        }

        function closeExplanation() {
            explanationPopup.classList.remove('show');
            fabBtn.classList.remove('show');
        }

        // ==========================================
        // 6. AI 채팅 로직 & 오류 다시 시도
        // ==========================================
        function addChatMessage(sender, htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${sender}`;
            msgDiv.innerHTML = htmlContent;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function formatAiText(text) { return text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b style="color:#bb9af7;">$1</b>'); }

        function renderChatUI() {
            chatLog.innerHTML = '';
            const history = chatMemories[currentContextKey];
            
            if (history && history.length > 0) {
                history.forEach(msg => addChatMessage(msg.role === 'user' ? 'user' : 'ai', msg.html));
                chatInputRow.style.display = geminiApiKey ? 'flex' : 'none';
                chatLog.scrollTop = chatLog.scrollHeight;
            } else {
                const defaultExplain = explanationFallback[currentContextKey] || getFallbackExplanation(document.getElementById('popupPropName').textContent);
                addChatMessage('ai', defaultExplain);
                
                if (geminiApiKey) {
                    if (getUsageCount() >= 1500) {
                        addChatMessage('ai', '<span style="color:#f7768e; font-weight:bold;">오늘 API 무료 사용량을 모두 소진했습니다. 내일 다시 이용해주세요!</span>');
                        chatInputRow.style.display = 'none';
                    } else {
                        addChatMessage('ai', `<button class="ai-req-btn" onclick="requestInitialAi()">✨ AI 선생님에게 완벽한 해석 요청하기</button>`);
                        chatInputRow.style.display = 'none'; 
                    }
                } else chatInputRow.style.display = 'none';
            }
        }

        function resetCurrentChat() { chatMemories[currentContextKey] = []; renderChatUI(); }

        async function fetchAIResponseCore(contents) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${geminiApiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: contents })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                incrementUsage();
                return data.candidates[0].content.parts[0].text;
            } catch (e) { console.error("AI 에러:", e); return null; }
        }

        async function requestInitialAi() {
            chatLog.lastChild.remove(); 
            const loadingId = 'loading_' + Date.now();
            addChatMessage('ai', `<span id="${loadingId}">코드를 분석하고 비유를 떠올리고 있어요... 💭</span>`);
            
            const questionText = `현재 상태창 코드에서 '${currentContextKey}: ${currentContextValue};' 설정이 사용되었습니다. 이게 무슨 뜻이고 화면에서 어떻게 동작하는지 초보자가 100% 공감할 수 있게 '뽁뽁이', '자석' 같은 일상적인 비유를 써서 3~4문장으로 친절하게 대답해주세요.`;
            
            const aiText = await fetchAIResponseCore([{ role: 'user', parts: [{text: questionText}] }]);
            const loadEl = document.getElementById(loadingId); if(loadEl) loadEl.parentElement.remove();
            
            if(aiText) {
                chatMemories[currentContextKey] = [ { role: 'model', text: aiText, html: formatAiText(aiText) } ];
                renderChatUI(); 
            } else {
                addChatMessage('ai', '<span style="color:#f7768e;">답변을 받아오지 못했습니다. 😢</span><br><button class="retry-btn" onclick="requestInitialAi()">다시 시도</button>');
            }
        }

        async function sendChatMsg(retryMsg = null) {
            const msg = retryMsg || chatInput.value.trim();
            if(!msg) return;
            
            chatInput.value = '';
            if(!retryMsg) { chatMemories[currentContextKey].push({ role: 'user', text: msg, html: msg }); renderChatUI(); }
            
            const loadingId = 'loading_' + Date.now();
            addChatMessage('ai', `<span id="${loadingId}">답변을 작성하고 있어요... 💭</span>`);
            
            let contents = [{ role: 'user', parts: [{ text: `당신은 HTML 왕초보 강사입니다. 선택 속성: '${currentContextKey}'(값: '${currentContextValue}'). 친절한 비유로 답변하세요.` }] }];
            chatMemories[currentContextKey].forEach(m => contents.push({ role: m.role, parts: [{ text: m.text }] }));
            
            const aiText = await fetchAIResponseCore(contents);
            const loadEl = document.getElementById(loadingId); if(loadEl) loadEl.parentElement.remove();
            
            if(aiText) {
                chatMemories[currentContextKey].push({ role: 'model', text: aiText, html: formatAiText(aiText) });
                renderChatUI();
            } else {
                addChatMessage('ai', `<span style="color:#f7768e;">답변을 받아오지 못했습니다. 😢</span><br><button class="retry-btn" onclick="sendChatMsg('${msg}')">다시 시도</button>`);
                if(!retryMsg) chatMemories[currentContextKey].pop(); // 롤백
            }
        }

        // ==========================================
        // 7. 한글 해독기 및 트리 렌더링 (주석 무시됨)
        // ==========================================
        const styleDictionary = { 'background': '🎨 배경', 'background-color': '🎨 배경색', 'color': '🖍️ 글자 색상', 'border': '🔲 테두리', 'border-radius': '↪️ 테두리 둥글기', 'padding': '↔️ 안쪽 여백 (완충재)', 'margin': '↔️ 바깥 여백 (거리두기)', 'width': '📏 가로 너비', 'max-width': '📏 최대 가로 너비', 'height': '↕️ 세로 높이', 'font-size': '🅰️ 글자 크기', 'font-weight': '𝐁 글자 굵기', 'text-align': '📑 글자 정렬', 'line-height': '↕️ 줄 간격', 'word-break': '✂️ 단어 줄바꿈 방식', 'text-wrap': '🎀 문단 맞추기', 'display': '📐 배치 방식 (Flex 등)', 'justify-content': '가로 정렬 방식', 'align-items': '세로 정렬 방식', 'gap': '요소 간격', 'overflow': '넘칠 때 처리', 'position': '📍 요소 위치 기준', 'transform': '🔄 모양 변형', 'z-index': '겹치는 순서', 'box-sizing': '박스 계산법', 'opacity': '👻 투명도' };
        const explanationFallback = { 'margin': '바깥으로 남들이 다가오지 못하게 밀어내는 <b>"거리두기"</b> 구역입니다.', 'padding': '안쪽에 부서지지 않게 <b>"뽁뽁이(완충재)"</b>를 채워 넣는 것과 같습니다.', 'border-radius': '모서리를 <b>"사포로 둥글게 갈아내는"</b> 효과입니다.', 'display': '<b>flex</b>는 레고 블록처럼 유연하게 정렬해주는 도구입니다.' };
        function getFallbackExplanation(koreanName) { return `이 속성은 상태창에서 <b>[ ${koreanName} ]</b> 역할을 합니다.<br><br>값을 바꿔보며 관찰해 보세요!`; }

        function tokenizeHTML(html) {
            const regex = /(<!--[\s\S]*?-->)|<(\/?)([a-zA-Z0-9\-]+)([^>]*?)>|([^<]+)/g;
            let tokens = []; let match;
            while ((match = regex.exec(html)) !== null) {
                if(match[1]) continue; 
                const isTag = !!match[3]; const isClose = match[2] === '/';
                const tagName = match[3] ? match[3].toLowerCase() : null;
                const textContent = match[5] || '';
                if (!isTag && textContent.trim() === '') continue;
                tokens.push({ isTag, isClose, name: tagName, attrs: match[4] || '', text: match[0], rawContent: textContent.trim(), start: match.index, end: regex.lastIndex });
            }
            return tokens;
        }

        function buildTree(tokens, htmlLength) {
            let root = { name: 'root', children: [], start: 0, openEnd: htmlLength, end: htmlLength };
            let stack = [root]; const voidElements = ['br', 'hr', 'img', 'input'];
            for (let t of tokens) {
                let parent = stack[stack.length - 1];
                if (t.isTag && !t.isClose) {
                    let node = { name: t.name, start: t.start, openEnd: t.end, end: t.end, children: [], attrs: t.attrs };
                    parent.children.push(node); if (!voidElements.includes(t.name)) stack.push(node);
                } else if (t.isTag && t.isClose) {
                    for (let i = stack.length - 1; i >= 1; i--) {
                        if (stack[i].name === t.name) { stack[i].end = t.end; stack.length = i; break; }
                    }
                } else if (!t.isTag) parent.children.push({ name: '#text', text: t.rawContent, start: t.start, end: t.end });
            }
            return root.children;
        }

        function translateTag(n, text) {
            if (n === 'div') return { badge: 'box', text: '📦 구역 상자' };
            if (n === 'span') return { badge: 'text', text: '🏷️ 텍스트 꾸밈' };
            if (n === 'details') return { badge: 'special', text: '📂 펼치기 틀' };
            if (n === 'summary') return { badge: 'special', text: '▶ 펼치기 제목' };
            if (n === '#text') return { badge: '', text: `📝 텍스트: "${text.length > 15 ? text.substring(0,15)+'...' : text}"` };
            return { badge: '', text: `<${n}> 태그` };
        }

        function parseStyles(attrString) {
            if (!attrString) return [];
            const styleMatch = attrString.match(/style\s*=\s*(["'])(.*?)\1/i);
            if (!styleMatch) return [];
            let styleStr = styleMatch[2].replace(/\/\*[\s\S]*?\*\//g, '');
            const properties = [];
            styleStr.split(';').filter(r => r.trim() !== '').forEach(rule => {
                const parts = rule.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    properties.push({ key: key, value: parts.slice(1).join(':').trim(), koreanName: styleDictionary[key] || key });
                }
            });
            return properties;
        }

        function renderTreeUI(nodes) {
            let html = '';
            for (let node of nodes) {
                const info = translateTag(node.name, node.text);
                const styles = parseStyles(node.attrs);
                html += `<div class="tree-node">`;
                if (node.name === '#text' || node.name === 'br') {
                    // 💡 data-start 와 data-end 추가
                    html += `<div class="tree-summary" data-start="${node.start}" data-end="${node.end}" onclick="highlightFullTag(event, ${node.start}, ${node.end}, '${node.name}', '${info.text}')">${info.text}</div>`;
                } else {
                    html += `<details><summary class="tree-summary" data-start="${node.start}" data-end="${node.end}" onclick="highlightFullTag(event, ${node.start}, ${node.end}, '${node.name}', '${info.text}')">`;
                    if (info.badge) html += `<span class="badge ${info.badge}">${info.badge.toUpperCase()}</span>`;
                    html += `${info.text} (설정 ${styles.length}개)</summary>`;

                    if (styles.length > 0) {
                        html += `<div class="prop-list">`;
                        styles.forEach(prop => {
                            const safeValue = prop.value.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                            // 💡 data-start 와 data-end 추가
                            html += `<div class="prop-item" data-start="${node.start}" data-end="${node.openEnd}" onclick="highlightSpecificStyle(event, ${node.start}, ${node.openEnd}, '${prop.key}', '${prop.koreanName}', '${safeValue}')">
                                <span class="prop-name">${prop.koreanName}</span><span class="prop-value">${prop.value}</span>
                            </div>`;
                        });
                        html += `</div>`;
                    }
                    if (node.children && node.children.length > 0) html += `<div class="tree-children">${renderTreeUI(node.children)}</div>`;
                    html += `</details>`;
                }
                html += `</div>`;
            }
            return html;
        }

        function analyzeCode(html) {
            if (!html.trim()) { structureBox.innerHTML = '<div class="empty-msg">코드를 입력하면 분석 결과가 나타납니다.</div>'; return; }
            structureBox.innerHTML = renderTreeUI(buildTree(tokenizeHTML(html), html.length));
        }

        function highlightFullTag(event, start, end, tagName, tagKoreanName) {
            if(event) event.stopPropagation();
            safeSelectRange(start, end);
            if(tagName && tagName !== '#text') {
                const explainKey = (tagName === 'div' || tagName === 'details' || tagName === 'span') ? tagName : '기본 태그';
                triggerFab(explainKey, tagKoreanName, '태그 전체');
            }
        }

        function highlightSpecificStyle(event, nodeStart, nodeOpenEnd, cssKey, cssKoreanName, value) {
            event.stopPropagation(); 
            const code = codeEditor.value;
            const tagCode = code.substring(nodeStart, nodeOpenEnd);
            const regex = new RegExp(`(?<![\\w-])${cssKey.replace(/-/g, '\\-')}\\s*:\\s*[^;"]+`, 'i');
            const match = tagCode.match(regex);
            
            if (match) safeSelectRange(nodeStart + match.index, nodeStart + match.index + match[0].length);
            else safeSelectRange(nodeStart, nodeOpenEnd);
            
            triggerFab(cssKey, cssKoreanName, value);
        }

        function switchSlot(num) {
            if(currentSlot === num) return;
            localStorage.setItem('htmlCodeSlot_' + currentSlot, codeEditor.value);
            currentSlot = num;
            document.querySelectorAll('.slot-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('slot-' + num).classList.add('active');
            loadData(num);
            closeExplanation();
        }

        function loadData(num) {
            codeEditor.value = localStorage.getItem('htmlCodeSlot_' + num) || '';
            codeEditor.dispatchEvent(new Event('input')); 
        }

        function copyCode() {
            if(!codeEditor.value) return alert('복사할 코드가 없습니다.');
            navigator.clipboard.writeText(codeEditor.value).then(() => alert('복사 완료!'));
        }

        // ==========================================
        // 8. 키보드 활성화 시 FAB 및 팝업창 위치 조정
        // ==========================================
        if (window.visualViewport) {
            const adjustPopupPosition = () => {
                const viewportHeight = window.visualViewport.height;
                const windowHeight = window.innerHeight;
                // 브라우저 UI 변화나 키보드로 인한 뷰포트 축소 시 offset을 계산
                let offset = Math.max(0, windowHeight - viewportHeight);
                fabBtn.style.bottom = `${offset + 20}px`;
                explanationPopup.style.bottom = `${offset + 20}px`;
            };
            window.visualViewport.addEventListener('resize', adjustPopupPosition);
            window.visualViewport.addEventListener('scroll', adjustPopupPosition);
        }
    </script>
</body>
