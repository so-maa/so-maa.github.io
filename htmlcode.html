<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 코드 해독기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-title { font-size: 22px; font-weight: bold; color: #c0caf5; margin-bottom: 5px; border-bottom: 2px solid #414868; padding-bottom: 10px; }
        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 1. 상단: 미리보기 영역 */
        .preview-box { background-color: #ffffff; background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 15px 15px; border: 2px dashed #565f89; border-radius: 12px; padding: 20px; min-height: 200px; overflow-x: hidden; color: #333; }

        /* 2. 중단: 코드 편집기 영역 */
        .code-editor-container { position: relative; }
        .code-textarea { width: 100%; height: 250px; background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 12px; padding: 15px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5; }
        .code-textarea:focus { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2); }
        .code-textarea::selection { background-color: #364A82; color: #ffffff; }

        /* 3. 하단: 한글 코드 해독기 (구조 분석) 영역 */
        .structure-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        
        /* 트리(Tree) 구조 스타일 */
        .tree-node { margin: 4px 0; font-size: 13px; line-height: 1.4; }
        .tree-item { display: inline-block; padding: 6px 10px; background-color: #1f2335; border: 1px solid #414868; border-radius: 6px; cursor: pointer; transition: all 0.2s; color: #c0caf5; user-select: none; word-break: break-all; }
        .tree-item:hover { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        
        /* 자식 요소 들여쓰기 */
        .tree-children { margin-left: 20px; padding-left: 10px; border-left: 2px dashed #414868; margin-top: 4px; display: flex; flex-direction: column; }
        
        /* 태그별 색상 뱃지 */
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; background-color: #414868; color: #a9b1d6; }
        .badge.box { background-color: #7aa2f7; color: #1a1b26; }
        .badge.text { background-color: #bb9af7; color: #1a1b26; }
        .badge.special { background-color: #f7768e; color: #1a1b26; }
        
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
        .action-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background-color: #7aa2f7; color: #1a1b26; }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7aa2f7; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-title">🔍 상태창 코드 해독기 (Anatomy & Editor)</div>

        <!-- 1. 미리보기 영역 -->
        <div>
            <div class="section-title">👀 1단계: 실시간 미리보기</div>
            <div id="previewBox" class="preview-box"></div>
        </div>

        <!-- 2. 코드 편집기 영역 -->
        <div>
            <div class="section-title">
                <span>💻 2단계: HTML 코드 편집기 (이곳에 코드를 붙여넣으세요)</span>
                <button class="action-btn" onclick="copyCode()">코드 복사</button>
            </div>
            <div class="code-editor-container">
                <textarea id="codeEditor" class="code-textarea" placeholder="여기에 예시 코드를 붙여넣거나 직접 작성해 보세요!"></textarea>
            </div>
        </div>

        <!-- 3. 한글 코드 해독기 영역 -->
        <div>
            <div class="section-title">📖 3단계: 구조 해독기 (클릭하면 위의 코드 위치를 찾아줍니다)</div>
            <div id="structureBox" class="structure-box">
                <div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>
            </div>
        </div>
    </div>

    <script>
        const previewBox = document.getElementById('previewBox');
        const codeEditor = document.getElementById('codeEditor');
        const structureBox = document.getElementById('structureBox');

        // 입력창에 코드를 칠 때마다 즉시 실행
        codeEditor.addEventListener('input', () => {
            const html = codeEditor.value;
            // 미리보기 업데이트
            previewBox.innerHTML = html;
            // 코드 해독기 실행
            analyzeCode(html);
        });

        // 💡 핵심 1: HTML 코드를 쪼개서 시작/끝 위치(Index)를 기억하는 토크나이저
        function tokenizeHTML(html) {
            const regex = /<(\/?)([a-zA-Z0-9\-]+)([^>]*?)>|([^<]+)/g;
            let tokens = [];
            let match;
            
            while ((match = regex.exec(html)) !== null) {
                const isTag = !!match[2];
                const isClose = match[1] === '/';
                const tagName = match[2] ? match[2].toLowerCase() : null;
                const attributes = match[3] || '';
                const textContent = match[4] || '';
                
                // 순수 공백 텍스트는 건너뜀
                if (!isTag && textContent.trim() === '') continue;

                tokens.push({
                    isTag: isTag,
                    isClose: isClose,
                    name: tagName,
                    attrs: attributes,
                    text: match[0],
                    rawContent: textContent.trim(),
                    start: match.index,
                    end: regex.lastIndex
                });
            }
            return tokens;
        }

        // 💡 핵심 2: 쪼갠 토큰들을 부모-자식 트리(Tree) 구조로 조립
        function buildTree(tokens, htmlLength) {
            let root = { name: 'root', children: [], start: 0, end: htmlLength };
            let stack = [root];
            
            // 닫는 태그가 없는 단일 태그들
            const voidElements = ['br', 'hr', 'img', 'input', 'meta', 'link'];

            for (let t of tokens) {
                let parent = stack[stack.length - 1];
                
                if (t.isTag && !t.isClose) {
                    let node = { 
                        name: t.name, 
                        start: t.start, 
                        end: t.end, 
                        children: [], 
                        attrs: t.attrs 
                    };
                    parent.children.push(node);
                    
                    if (!voidElements.includes(t.name)) {
                        stack.push(node); // 자식을 가질 수 있으므로 스택에 추가
                    }
                } 
                else if (t.isTag && t.isClose) {
                    // 짝이 맞는 여는 태그를 찾아 스택에서 뺌
                    for (let i = stack.length - 1; i >= 1; i--) {
                        if (stack[i].name === t.name) {
                            stack[i].end = t.end; // 닫는 태그의 끝 위치 기록
                            stack.length = i; 
                            break;
                        }
                    }
                } 
                else if (!t.isTag) {
                    // 단순 텍스트 노드
                    parent.children.push({ 
                        name: '#text', 
                        text: t.rawContent, 
                        start: t.start, 
                        end: t.end 
                    });
                }
            }
            return root.children;
        }

        // 💡 핵심 3: 영어 태그 이름을 친절한 한글과 뱃지로 번역
        function translateTag(node) {
            const n = node.name;
            if (n === 'div') return { badge: 'box', text: '📦 구역 상자' };
            if (n === 'span') return { badge: 'text', text: '🏷️ 텍스트 꾸밈' };
            if (n === 'details') return { badge: 'special', text: '📂 접기/펼치기 틀' };
            if (n === 'summary') return { badge: 'special', text: '▶ 펼치기 제목' };
            if (n === 'br') return { badge: 'text', text: '↵ 줄바꿈' };
            if (n === 'hr') return { badge: 'box', text: '➖ 가로선' };
            if (n === 'strong' || n === 'b') return { badge: 'text', text: '𝗕 굵은 글씨' };
            if (n === 'img') return { badge: 'special', text: '🖼️ 이미지' };
            if (n === '#text') {
                // 텍스트가 너무 길면 말줄임표 처리
                const previewText = node.text.length > 20 ? node.text.substring(0, 20) + '...' : node.text;
                return { badge: '', text: `📝 "${previewText}"` };
            }
            return { badge: '', text: `<${n}> 태그` }; // 기타 태그
        }

        // 스타일 속성에서 중요한 힌트(배경색, 글자색 등)를 추출하여 요약
        function extractHints(attrs) {
            if (!attrs) return '';
            let hints = [];
            
            // 정규식으로 색상 코드나 특정 속성 뽑아내기
            const bgMatch = attrs.match(/background(-color)?:\s*([^;"]+)/i);
            if (bgMatch) hints.push(`배경: ${bgMatch[2].trim()}`);
            
            const colorMatch = attrs.match(/(?<!-|\w)color:\s*([^;"]+)/i);
            if (colorMatch) hints.push(`글자색: ${colorMatch[1].trim()}`);

            return hints.length > 0 ? ` <span style="color:#565f89; font-size:11px;">(${hints.join(' / ')})</span>` : '';
        }

        // 트리를 돌면서 HTML UI로 렌더링
        function renderTreeUI(nodes) {
            let html = '';
            for (let node of nodes) {
                const info = translateTag(node);
                const hints = extractHints(node.attrs);
                
                html += `<div class="tree-node">`;
                
                // 클릭 시 해당 코드 범위를 하이라이트(드래그)하도록 함수 연결
                html += `<div class="tree-item" onclick="highlightCode(${node.start}, ${node.end})">`;
                if (info.badge) html += `<span class="badge ${info.badge}">${info.badge === 'box' ? 'BOX' : info.badge === 'text' ? 'TXT' : 'SPL'}</span>`;
                html += `${info.text}${hints}`;
                html += `</div>`;

                // 자식 노드가 있으면 재귀적으로 들여쓰기 박스 안에 그림
                if (node.children && node.children.length > 0) {
                    html += `<div class="tree-children">${renderTreeUI(node.children)}</div>`;
                }
                html += `</div>`;
            }
            return html;
        }

        // 메인 분석 함수
        function analyzeCode(html) {
            if (!html.trim()) {
                structureBox.innerHTML = '<div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>';
                return;
            }
            const tokens = tokenizeHTML(html);
            const tree = buildTree(tokens, html.length);
            structureBox.innerHTML = renderTreeUI(tree);
        }

        // 💡 핵심 4: 클릭 시 코드 편집기의 해당 텍스트를 드래그하고 스크롤 이동
        function highlightCode(start, end) {
            codeEditor.focus(); // 텍스트창 포커스
            codeEditor.setSelectionRange(start, end); // 파란색으로 블록 지정

            // 스크롤을 해당 위치로 부드럽게 이동시키는 계산식
            const textUpToStart = codeEditor.value.substring(0, start);
            const lineBreaks = (textUpToStart.match(/\n/g) || []).length;
            
            // 대략적인 줄 높이(line-height)를 20px로 잡고 스크롤 위치 계산
            const lineHeight = 20; 
            codeEditor.scrollTop = (lineBreaks * lineHeight) - 50; // 살짝 여백을 두고 스크롤
        }

        function copyCode() {
            const code = codeEditor.value;
            if(!code) return alert('복사할 코드가 없습니다.');
            navigator.clipboard.writeText(code).then(() => {
                alert('코드 복사가 완료되었습니다!');
            });
        }

        // 초기 테스트용 예시 코드 삽입 (사용자가 테스트해볼 수 있도록)
        window.onload = () => {
            const sampleCode = `<div style="background-color: #2b2b2b; padding: 20px; border-radius: 10px; border: 2px solid #555;">\n  <span style="color: pink; font-weight: bold;">💖 사랑스러운 상태창 💖</span>\n  <hr style="border: 1px dashed #666; margin: 10px 0;">\n  <div style="color: white;">\n    체력: 100/100<br>\n    마나: 50/50\n  </div>\n</div>`;
            codeEditor.value = sampleCode;
            codeEditor.dispatchEvent(new Event('input')); // 강제로 한번 실행
        }
    </script>
</body>
</html>
