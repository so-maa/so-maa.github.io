<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML 해독기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; display: flex; justify-content: center; }
        .app-wrapper { width: 100%; max-width: 900px; transition: filter 0.3s ease; }
        .app-wrapper.blurred { filter: blur(8px) brightness(0.6); pointer-events: none; user-select: none; }
        .app-container { display: flex; flex-direction: column; gap: 20px; }
        
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 10px; }
        .tracker-title { font-size: 20px; font-weight: bold; color: #c0caf5; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
        .slot-container { display: flex; gap: 6px; }
        .slot-btn { background-color: #24283b; color: #565f89; border: 1px solid #414868; border-radius: 6px; width: 32px; height: 32px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
        .slot-btn.active { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }

        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .preview-box { background-color: #ffffff; background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 15px 15px; border: 2px dashed #565f89; border-radius: 12px; padding: 20px; min-height: 200px; overflow-x: hidden; color: #333; }

        .code-editor-container { position: relative; }
        .code-textarea { width: 100%; height: 250px; background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 12px; padding: 15px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5; }
        .code-textarea:focus { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2); }
        .code-textarea::selection { background-color: #364A82; color: #ffffff; }

        .usage-bar { display: none; background-color: rgba(187, 154, 247, 0.1); border: 1px dashed #bb9af7; border-radius: 8px; padding: 12px 15px; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .usage-bar.active { display: flex; }
        .usage-text { font-size: 12px; font-weight: bold; color: #bb9af7; }
        .usage-subtext { font-size: 11px; color: #a9b1d6; }

        .structure-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        .tree-node { margin: 4px 0; font-size: 13px; line-height: 1.4; }
        .tree-summary { display: inline-block; padding: 6px 10px; background-color: #1f2335; border: 1px solid #414868; border-radius: 6px; cursor: pointer; transition: all 0.2s; color: #c0caf5; user-select: none; word-break: break-all; font-weight: bold; }
        .tree-summary:hover { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        .prop-list { margin-top: 5px; margin-bottom: 10px; padding-left: 15px; display: flex; flex-direction: column; gap: 4px; }
        .prop-item { display: flex; align-items: center; padding: 4px 8px; background-color: #1a1b26; border: 1px dashed #414868; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; color: #a9b1d6; }
        .prop-item:hover { background-color: #364A82; color: #fff; border-color: #7aa2f7; }
        .prop-name { color: #9ece6a; font-weight: bold; width: 140px; flex-shrink: 0; }
        .prop-value { color: #c0caf5; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .tree-children { margin-left: 15px; padding-left: 10px; border-left: 2px dashed #414868; margin-top: 4px; display: flex; flex-direction: column; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; background-color: #414868; color: #a9b1d6; }
        .badge.box { background-color: #7aa2f7; color: #1a1b26; }
        .badge.text { background-color: #bb9af7; color: #1a1b26; }
        .badge.special { background-color: #f7768e; color: #1a1b26; }
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
        
        .action-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary { background-color: #364A82; border-color: #7aa2f7; color: #fff; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7aa2f7; }

        /* 팝업창 & 채팅 UI */
        .explanation-popup { position: fixed; bottom: 25px; left: 25px; width: 320px; background-color: #1f2335; border: 2px solid #bb9af7; border-radius: 12px; padding: 15px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 9999; display: flex; flex-direction: column; gap: 8px; transform: translateX(-150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .explanation-popup.show { transform: translateX(0); }
        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #414868; padding-bottom: 8px; }
        .popup-title { color: #bb9af7; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .popup-close-btn { background: none; border: none; color: #a9b1d6; font-size: 18px; cursor: pointer; padding: 0; }
        .popup-close-btn:hover { color: #f7768e; }
        .popup-prop-name { color: #1a1b26; font-weight: bold; font-size: 14px; background-color: #bb9af7; padding: 5px; border-radius: 6px; text-align: center; margin-bottom: 2px; }
        .chat-log { max-height: 250px; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .chat-msg { font-size: 13px; line-height: 1.5; padding: 10px; border-radius: 8px; word-break: keep-all; }
        .chat-msg.ai { background-color: #24283b; color: #c0caf5; border: 1px solid #414868; border-top-left-radius: 0; }
        .chat-msg.user { background-color: #364A82; color: #ffffff; align-self: flex-end; border-top-right-radius: 0; }
        .ai-req-btn { background-color: transparent; border: 1px solid #bb9af7; color: #bb9af7; width: 100%; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .ai-req-btn:hover { background-color: #bb9af7; color: #1a1b26; }
        .chat-input-row { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input { flex: 1; background-color: #1a1b26; border: 1px solid #414868; color: #c0caf5; padding: 8px 12px; border-radius: 20px; font-size: 12px; outline: none; font-family: inherit; }
        .chat-input:focus { border-color: #bb9af7; }
        .chat-send-btn { background-color: #bb9af7; color: #1a1b26; border: none; border-radius: 20px; padding: 0 15px; font-weight: bold; cursor: pointer; font-size: 12px; }

        @media (max-width: 768px) {
            .explanation-popup { left: 50%; bottom: 20px; transform: translate(-50%, 150%); width: 90vw; max-width: 340px; }
            .explanation-popup.show { transform: translate(-50%, 0); }
        }

        /* 인트로 오버레이 */
        .intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: flex; justify-content: center; align-items: center; background-color: rgba(26, 27, 38, 0.4); }
        .intro-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 25px; width: 90%; max-width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .intro-box h2 { margin: 0; font-size: 18px; color: #bb9af7; }
        .intro-box p { margin: 0; font-size: 13px; color: #a9b1d6; line-height: 1.5; }
        .intro-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .intro-btn { padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-no-api { background-color: #414868; color: #c0caf5; }
        .btn-yes-api { background-color: #bb9af7; color: #1a1b26; }
        .intro-btn:hover { filter: brightness(1.1); }
        .api-input-container { display: none; flex-direction: column; gap: 10px; margin-top: 5px; }
        .api-input { padding: 10px; border-radius: 8px; border: 1px solid #414868; background-color: #1a1b26; color: #c0caf5; outline: none; font-size: 13px; }
        .api-input:focus { border-color: #bb9af7; }
    </style>
</head>
<body>
    <div id="introOverlay" class="intro-overlay">
        <div class="intro-box">
            <h2>✨ AI 해독기 설정</h2>
            <p>선생님 기능을 담당할 AI를 설정해주세요.<br>(기존 데이터는 뒤에 안전하게 보존되어 있습니다!)</p>
            <div class="intro-btn-group" id="introBtnGroup">
                <button class="intro-btn btn-no-api" onclick="selectNoApi()">API키가 없습니다. (기본사전 사용)</button>
                <button class="intro-btn btn-yes-api" onclick="selectYesApi()">API키가 있습니다. (AI 선생님 호출)</button>
            </div>
            <div class="api-input-container" id="apiInputContainer">
                <input type="text" id="introApiInput" class="api-input" placeholder="AIzaSy... (API 키를 붙여넣으세요)">
                <button class="intro-btn btn-yes-api" onclick="submitApiKey()">입력 완료 및 시작</button>
            </div>
        </div>
    </div>

    <div id="appWrapper" class="app-wrapper blurred">
        <div class="app-container">
            <div class="top-nav-bar">
                <div class="tracker-title">HTML 해독기</div>
                <div class="slot-container">
                    <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
                    <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
                    <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
                    <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
                    <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
                </div>
            </div>

            <div>
                <div class="section-title">👀 1단계: 실시간 미리보기</div>
                <div id="previewBox" class="preview-box"></div>
            </div>

            <div>
                <div class="section-title">
                    <span>💻 2단계: HTML 코드 편집기</span>
                    <button class="action-btn" onclick="copyCode()">코드 복사</button>
                </div>
                <div class="code-editor-container">
                    <textarea id="codeEditor" class="code-textarea" placeholder="여기에 상태창 코드를 붙여넣으세요!"></textarea>
                </div>
            </div>

            <div id="usageBar" class="usage-bar">
                <span class="usage-text" id="usageCountText">오늘 AI 질문 횟수: 0회 / 1,500회</span>
                <span class="usage-subtext">Gemini 3.7 Flash 가동 중</span>
            </div>

            <div>
                <div class="section-title">📖 3단계: 구조 분석</div>
                <div id="structureBox" class="structure-box">
                    <div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>
                </div>
            </div>
        </div>
    </div>

    <div id="explanationPopup" class="explanation-popup">
        <div class="popup-header">
            <span class="popup-title">✨ AI 코딩 상담소</span>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="popup-close-btn" style="font-size:12px; font-weight:bold; border:1px solid #414868; padding:2px 6px; border-radius:4px;" onclick="resetCurrentChat()">🔄 초기화</button>
                <button class="popup-close-btn" onclick="closeExplanation()">✕</button>
            </div>
        </div>
        <div class="popup-prop-name" id="popupPropName">속성 이름</div>
        <div id="chatLog" class="chat-log"></div>
        <div class="chat-input-row" id="chatInputRow" style="display: none;">
            <input type="text" id="chatInput" class="chat-input" placeholder="궁금한 점을 더 물어보세요!" onkeypress="if(event.key==='Enter') sendChatMsg()">
            <button class="chat-send-btn" onclick="sendChatMsg()">전송</button>
        </div>
    </div>

    <script>
        // 변수 및 DOM 캐싱 (코드 압축)
        const MODEL_NAME = "gemini-3.7-flash"; 
        let geminiApiKey = null, currentSlot = 1, chatMemories = {}, currentContextKey = '', currentContextValue = '';
        const $ = id => document.getElementById(id);
        const [appWrapper, introOverlay, usageBar, usageCountText, previewBox, codeEditor, structureBox, explanationPopup, chatLog, chatInputRow, chatInput, introApiInput, introBtnGroup, apiInputContainer, popupPropName] = ['appWrapper', 'introOverlay', 'usageBar', 'usageCountText', 'previewBox', 'codeEditor', 'structureBox', 'explanationPopup', 'chatLog', 'chatInputRow', 'chatInput', 'introApiInput', 'introBtnGroup', 'apiInputContainer', 'popupPropName'].map($);

        // 사전 압축
        const styleDictionary = {'background':'🎨 배경 통합','background-color':'🎨 배경색','background-image':'🖼️ 배경 이미지','background-size':'📏 배경 크기','background-position':'📍 배경 위치','background-clip':'✂️ 배경 자르기','color':'🖍️ 글자 색상','border':'🔲 테두리','border-top':'🔼 윗면 테두리','border-bottom':'🔽 아랫면 테두리','border-left':'◀️ 좌측 테두리','border-right':'▶️ 우측 테두리','border-radius':'↪️ 테두리 둥글기','padding':'↔️ 안쪽 여백','padding-top':'위쪽 안쪽 여백','padding-bottom':'아래쪽 안쪽 여백','padding-left':'왼쪽 안쪽 여백','padding-right':'오른쪽 안쪽 여백','margin':'↔️ 바깥 여백','margin-top':'위쪽 바깥 여백','margin-bottom':'아래쪽 바깥 여백','margin-left':'왼쪽 바깥 여백','margin-right':'오른쪽 바깥 여백','width':'📏 가로 너비','max-width':'📏 최대 가로 너비','min-width':'📏 최소 가로 너비','height':'↕️ 세로 높이','max-height':'↕️ 최대 세로 높이','font-size':'🅰️ 글자 크기','font-weight':'𝐁 글자 굵기','font-family':'🔤 폰트','text-align':'📑 글자 정렬','line-height':'↕️ 줄 간격','letter-spacing':'↔️ 자간','word-break':'✂️ 줄바꿈 방식','text-wrap':'🎀 문단 맞추기','text-decoration':'밑줄/취소선','box-shadow':'👤 박스 그림자','text-shadow':'👤 글자 그림자','opacity':'👻 투명도','display':'📐 화면 배치(Flex)','flex-direction':'나열 방향','justify-content':'가로 정렬','align-items':'세로 정렬','gap':'요소 간격','overflow':'넘침 처리','overflow-x':'가로 넘침 처리','overflow-y':'세로 넘침 처리','position':'📍 위치 기준','top':'위쪽 위치','bottom':'아래쪽 위치','left':'왼쪽 위치','right':'오른쪽 위치','transform':'🔄 모양 변형','z-index':'겹치는 순서','box-sizing':'박스 크기 계산','cursor':'🖱️ 커서 모양','aspect-ratio':'비율','-webkit-mask-image':'🎭 마스크 효과','-webkit-background-clip':'✂️ 글자 모양 자르기','-webkit-overflow-scrolling':'📱 관성 스크롤','scroll-snap-type':'🧲 스크롤 자석'};
        const explanationFallback = {'margin':'내 상자의 울타리 바깥으로 남들이 다가오지 못하게 밀어내는 <b>"거리두기"</b> 구역입니다.','padding':'상자 안쪽에 부서지지 않게 <b>"뽁뽁이(완충재)"</b>를 채워 넣는 것과 같습니다.','border-radius':'각진 네모 상자의 모서리를 <b>"사포로 둥글게 갈아내는"</b> 효과입니다.','box-sizing':'<b>border-box</b>를 쓰면 상자 크기가 망가지지 않게 여백을 안쪽으로 욱여넣습니다.','display':'<b>flex</b>는 상자 안의 내용물들을 레고 블록처럼 유연하게 정렬해주는 마법의 도구입니다.'};

        window.onload = () => { 
            loadData(1); 
            const k = localStorage.getItem('savedGeminiKey');
            if(k) introApiInput.value = k;
        };

        function selectNoApi() { geminiApiKey = null; closeIntro(); }
        function selectYesApi() { introBtnGroup.style.display = 'none'; apiInputContainer.style.display = 'flex'; }
        function submitApiKey() {
            const k = introApiInput.value.trim();
            if(!k) return alert('API 키를 입력해주세요!');
            geminiApiKey = k; localStorage.setItem('savedGeminiKey', k); updateUsageDisplay(); closeIntro();
        }
        function closeIntro() { introOverlay.style.display = 'none'; appWrapper.classList.remove('blurred'); }

        codeEditor.addEventListener('input', () => { previewBox.innerHTML = codeEditor.value; analyzeCode(); saveData(); });

        function updateUsageDisplay() {
            if(!geminiApiKey) return;
            usageBar.classList.add('active');
            const today = new Date().toDateString();
            let d = JSON.parse(localStorage.getItem('geminiUsageData')) || { date: today, count: 0 };
            if(d.date !== today) { d = { date: today, count: 0 }; localStorage.setItem('geminiUsageData', JSON.stringify(d)); }
            let sHtml = d.count >= 1500 ? `<span style="color:#f7768e;">(소진 완료! 내일 초기화)</span>` : d.count >= 1400 ? `<span style="color:#e0af68;">(한도 임박! 내일 초기화)</span>` : `<span style="color:#a9b1d6;">(매일 밤 12시 초기화)</span>`;
            usageCountText.innerHTML = `오늘 AI 질문 횟수: ${d.count}회 / 1,500회 ${sHtml}`;
        }
        function incrementUsage() {
            const t = new Date().toDateString();
            let d = JSON.parse(localStorage.getItem('geminiUsageData')) || { date: t, count: 0 };
            d.count++; localStorage.setItem('geminiUsageData', JSON.stringify(d)); updateUsageDisplay();
        }
        function getUsageCount() { return (JSON.parse(localStorage.getItem('geminiUsageData')) || {}).count || 0; }

        function addChatMessage(sender, html) {
            const d = document.createElement('div'); d.className = `chat-msg ${sender}`; d.innerHTML = html;
            chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
        }

        function formatAiText(t) { return t.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b style="color:#bb9af7;">$1</b>'); }

        function renderChatUI() {
            chatLog.innerHTML = '';
            const h = chatMemories[currentContextKey];
            if (h && h.length > 0) {
                h.forEach(m => addChatMessage(m.role==='user'?'user':'ai', m.html));
                chatInputRow.style.display = geminiApiKey ? 'flex' : 'none';
            } else {
                addChatMessage('ai', explanationFallback[currentContextKey] || `<b>[ ${popupPropName.textContent} ]</b> 설정입니다.<br><br>숫자나 색상을 바꿔보며 디자인을 확인해보세요!`);
                if (geminiApiKey) {
                    if (getUsageCount() >= 1500) { addChatMessage('ai', '<span style="color:#f7768e;font-weight:bold;">일일 한도를 모두 소진했습니다. 내일 다시 이용해주세요!</span>'); chatInputRow.style.display = 'none'; }
                    else { addChatMessage('ai', `<button class="ai-req-btn" onclick="requestInitialAi()">✨ AI 선생님에게 상세 해석 맡기기</button>`); chatInputRow.style.display = 'none'; }
                } else chatInputRow.style.display = 'none';
            }
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function resetCurrentChat() { chatMemories[currentContextKey] = []; renderChatUI(); }

        async function fetchAIResponseCore(contents) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${geminiApiKey}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contents}) });
                const d = await r.json(); if(d.error) throw new Error(d.error.message);
                incrementUsage(); return d.candidates[0].content.parts[0].text;
            } catch (e) { return null; }
        }

        async function requestInitialAi() {
            chatLog.lastChild.remove();
            const id = 'l_'+Date.now(); addChatMessage('ai', `<span id="${id}">코드 분석 중... 💭</span>`);
            const q = `상태창 코드 '${currentContextKey}: ${currentContextValue};'의 역할을 '뽁뽁이', '자석' 등 초보자가 100% 공감할 비유를 써서 3문장으로 쉽고 친절하게 대답해줘.`;
            const r = await fetchAIResponseCore([{ role: 'user', parts: [{text: q}] }]);
            const el = $(id); if(el) el.parentElement.remove();
            if(r) { chatMemories[currentContextKey] = [{ role:'model', text:r, html:formatAiText(r) }]; renderChatUI(); }
            else addChatMessage('ai', '<span style="color:#f7768e;">통신 에러. 한도 초과이거나 네트워크 문제일 수 있습니다.</span>');
        }

        async function sendChatMsg() {
            const m = chatInput.value.trim(); if(!m) return;
            chatInput.value = ''; chatMemories[currentContextKey].push({ role:'user', text:m, html:m }); renderChatUI();
            const id = 'l_'+Date.now(); addChatMessage('ai', `<span id="${id}">답변 작성 중... 💭</span>`);
            let c = [{ role:'user', parts:[{ text:`당신은 코딩 초보자 강사입니다. 속성 '${currentContextKey}'(값:'${currentContextValue}')에 대한 질문에 친절하고 쉬운 비유로 답하세요.` }]}];
            chatMemories[currentContextKey].forEach(mem => c.push({ role:mem.role, parts:[{text:mem.text}] }));
            const r = await fetchAIResponseCore(c);
            const el = $(id); if(el) el.parentElement.remove();
            if(r) { chatMemories[currentContextKey].push({ role:'model', text:r, html:formatAiText(r) }); renderChatUI(); }
            else { addChatMessage('ai', '<span style="color:#f7768e;">에러 발생.</span>'); chatMemories[currentContextKey].pop(); }
        }

        // 트리 로직
        function analyzeCode() {
            const v = codeEditor.value; if (!v.trim()) return structureBox.innerHTML = '<div class="empty-msg">분석 결과가 나타납니다.</div>';
            const tk = [], rx = /(<!--[\s\S]*?-->)|<(\/?)([a-zA-Z0-9\-]+)([^>]*?)>|([^<]+)/g; let m;
            while ((m = rx.exec(v)) !== null) {
                if(m[1]) continue; 
                const n = m[3] ? m[3].toLowerCase() : null, t = m[5]||'';
                if (!m[3] && t.trim()==='') continue;
                tk.push({ isT:!!m[3], isC:m[2]==='/', n:n, a:m[4]||'', txt:m[0], raw:t.trim(), s:m.index, e:rx.lastIndex });
            }
            let r={n:'root', c:[], s:0, oe:v.length, e:v.length}, st=[r], ve=['br','hr','img','input'];
            tk.forEach(t => {
                let p = st[st.length-1];
                if(t.isT && !t.isC) { let nd={n:t.n, s:t.s, oe:t.e, e:t.e, c:[], a:t.a}; p.c.push(nd); if(!ve.includes(t.n)) st.push(nd); }
                else if(t.isT && t.isC) { for(let i=st.length-1; i>=1; i--) if(st[i].n===t.n){ st[i].e=t.e; st.length=i; break; } }
                else p.c.push({n:'#text', txt:t.raw, s:t.s, e:t.e});
            });
            structureBox.innerHTML = renderTreeUI(r.c);
        }

        function tTag(n, t) {
            return n==='div'?{b:'box',t:'📦 구역 상자'}:n==='span'?{b:'text',t:'🏷️ 텍스트 꾸밈'}:n==='details'?{b:'special',t:'📂 펼치기 틀'}:n==='summary'?{b:'special',t:'▶ 펼치기 제목'}:n==='br'?{b:'text',t:'↵ 줄바꿈'}:n==='hr'?{b:'box',t:'➖ 가로선'}:n==='strong'||n==='b'?{b:'text',t:'𝗕 굵은 글씨'}:n==='#text'?{b:'',t:`📝 텍스트: "${t.length>15?t.substring(0,15)+'...':t}"`}:{b:'',t:`<${n}> 태그`};
        }

        function renderTreeUI(nodes) {
            let h = '';
            nodes.forEach(nd => {
                const i = tTag(nd.n, nd.txt), pr = [];
                if(nd.a) {
                    nd.a.replace(/\/\*[\s\S]*?\*\//g,'').match(/style\s*=\s*(["'])(.*?)\1/i)?.[2].split(';').filter(x=>x.trim()).forEach(rl=>{
                        let p=rl.split(':'); if(p.length>=2) pr.push({k:p[0].trim().toLowerCase(), v:p.slice(1).join(':').trim()});
                    });
                }
                h += `<div class="tree-node">`;
                if(nd.n==='#text'||nd.n==='br') h += `<div class="tree-summary" onclick="hltTag(event,${nd.s},${nd.e},'${nd.n}','${i.t}')">${i.t}</div>`;
                else {
                    h += `<details><summary class="tree-summary" onclick="hltTag(event,${nd.s},${nd.e},'${nd.n}','${i.t}')">${i.b?`<span class="badge ${i.b}">${i.b.toUpperCase()}</span>`:''}${i.t} (설정 ${pr.length}개)</summary>`;
                    if(pr.length>0) {
                        h += `<div class="prop-list">`;
                        pr.forEach(p=>{ const kn=styleDictionary[p.k]||p.k, sv=p.v.replace(/'/g,"\\'").replace(/"/g,'&quot;'); h+=`<div class="prop-item" onclick="hltSty(event,${nd.s},${nd.oe},'${p.k}','${kn}','${sv}')"><span class="prop-name">${kn}</span><span class="prop-value">${p.v}</span></div>`;});
                        h += `</div>`;
                    }
                    if(nd.c.length>0) h += `<div class="tree-children">${renderTreeUI(nd.c)}</div>`;
                    h += `</details>`;
                }
                h += `</div>`;
            }); return h;
        }

        function openExp(k, kn, v) { currentContextKey=k; currentContextValue=v; popupPropName.textContent=kn; explanationPopup.classList.add('show'); renderChatUI(); }
        function closeExplanation() { explanationPopup.classList.remove('show'); }
        function hltTag(e, s, ed, n, kn) { if(e)e.stopPropagation(); codeEditor.focus({preventScroll:true}); codeEditor.setSelectionRange(s, ed); if(n&&n!=='#text') openExp(n==='div'||n==='details'||n==='span'?n:'기본 태그', kn, '태그 전체'); }
        function hltSty(e, s, oe, k, kn, v) {
            e.stopPropagation(); const c=codeEditor.value.substring(s, oe), m=c.match(new RegExp(`(?<![\\w-])${k.replace(/-/g,'\\-')}\\s*:\\s*[^;"]+`,'i'));
            codeEditor.focus({preventScroll:true}); codeEditor.setSelectionRange(m?s+m.index:s, m?s+m.index+m[0].length:oe); openExp(k, kn, v);
        }
        function switchSlot(num) { if(currentSlot===num) return; saveData(); currentSlot=num; document.querySelectorAll('.slot-btn').forEach(b=>b.classList.remove('active')); $('slot-'+num).classList.add('active'); loadData(num); closeExplanation(); }
        function saveData() { localStorage.setItem('htmlCodeSlot_'+currentSlot, codeEditor.value); }
        function loadData(num) { codeEditor.value = localStorage.getItem('htmlCodeSlot_'+num)||''; codeEditor.dispatchEvent(new Event('input')); }
        function copyCode() { if(!codeEditor.value) return alert('복사할 코드가 없습니다.'); navigator.clipboard.writeText(codeEditor.value).then(()=>alert('복사 완료!')); }
    </script>
</body>
</html>
