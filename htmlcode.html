<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 코드 해독기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        
        /* 💡 수정된 상단 네비게이션 (타이틀 + 5개 템플릿 슬롯) */
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .tracker-title { font-size: 20px; font-weight: bold; color: #c0caf5; letter-spacing: 0.5px; }
        
        .slot-container { display: flex; gap: 6px; }
        .slot-btn { background-color: #24283b; color: #565f89; border: 1px solid #414868; border-radius: 6px; width: 32px; height: 32px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
        .slot-btn.active { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }

        .section-title { font-size: 14px; font-weight: bold; color: #7aa2f7; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 1. 상단: 미리보기 영역 */
        .preview-box { background-color: #ffffff; background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 15px 15px; border: 2px dashed #565f89; border-radius: 12px; padding: 20px; min-height: 200px; overflow-x: hidden; color: #333; }

        /* 2. 중단: 코드 편집기 영역 */
        .code-editor-container { position: relative; }
        .code-textarea { width: 100%; height: 250px; background-color: #16161e; color: #9ece6a; border: 1px solid #414868; border-radius: 12px; padding: 15px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; outline: none; resize: vertical; line-height: 1.5; }
        .code-textarea:focus { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2); }
        .code-textarea::selection { background-color: #364A82; color: #ffffff; }

        /* 3. 하단: 한글 코드 해독기 영역 */
        .structure-box { background-color: #24283b; border: 1px solid #414868; border-radius: 12px; padding: 15px; min-height: 300px; max-height: 500px; overflow-y: auto; }
        
        .tree-node { margin: 4px 0; font-size: 13px; line-height: 1.4; }
        .tree-summary { display: inline-block; padding: 6px 10px; background-color: #1f2335; border: 1px solid #414868; border-radius: 6px; cursor: pointer; transition: all 0.2s; color: #c0caf5; user-select: none; word-break: break-all; font-weight: bold; }
        .tree-summary:hover { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }
        
        .prop-list { margin-top: 5px; margin-bottom: 10px; padding-left: 15px; display: flex; flex-direction: column; gap: 4px; }
        .prop-item { display: flex; align-items: center; padding: 4px 8px; background-color: #1a1b26; border: 1px dashed #414868; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; color: #a9b1d6; }
        .prop-item:hover { background-color: #364A82; color: #fff; border-color: #7aa2f7; }
        .prop-name { color: #9ece6a; font-weight: bold; width: 130px; flex-shrink: 0; }
        .prop-value { color: #c0caf5; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        .tree-children { margin-left: 15px; padding-left: 10px; border-left: 2px dashed #414868; margin-top: 4px; display: flex; flex-direction: column; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; background-color: #414868; color: #a9b1d6; }
        .badge.box { background-color: #7aa2f7; color: #1a1b26; }
        .badge.text { background-color: #bb9af7; color: #1a1b26; }
        .badge.special { background-color: #f7768e; color: #1a1b26; }
        
        .empty-msg { text-align: center; color: #565f89; font-size: 13px; margin-top: 50px; }
        .action-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        @media (hover: hover) {
            .action-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .slot-btn:hover:not(.active) { background-color: #414868; color: #c0caf5; }
        }
        .action-btn:active { background-color: #7aa2f7; color: #1a1b26; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary { background-color: #364A82; border-color: #7aa2f7; color: #fff; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1b26; }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #7aa2f7; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 💡 상단 트래커 스타일 네비게이션 (타이틀 변경 및 템플릿 슬롯 추가) -->
        <div class="top-nav-bar">
            <div class="tracker-title">HTML 해독기</div>
            <div class="slot-container">
                <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
                <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
                <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
                <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
                <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
            </div>
        </div>

        <!-- 1. 미리보기 영역 -->
        <div>
            <div class="section-title">👀 1단계: 실시간 미리보기</div>
            <div id="previewBox" class="preview-box"></div>
        </div>

        <!-- 2. 코드 편집기 영역 -->
        <div>
            <div class="section-title">
                <span>💻 2단계: HTML 코드 편집기</span>
                <button class="action-btn" onclick="copyCode()">코드 복사</button>
            </div>
            <div class="code-editor-container">
                <textarea id="codeEditor" class="code-textarea" placeholder="여기에 상태창 코드를 붙여넣으세요!"></textarea>
            </div>
        </div>

        <!-- 3. 한글 코드 해독기 영역 -->
        <div>
            <div class="section-title">📖 3단계: 구조 분석 (항목을 누르면 세부 설정이 열리고, 설정을 누르면 코드를 짚어줍니다)</div>
            <div id="structureBox" class="structure-box">
                <div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>
            </div>
        </div>
    </div>

    <script>
        const previewBox = document.getElementById('previewBox');
        const codeEditor = document.getElementById('codeEditor');
        const structureBox = document.getElementById('structureBox');
        
        let currentSlot = 1;

        const styleDictionary = {
            'background': '🎨 배경 (색상/그라데이션)',
            'background-color': '🎨 배경색',
            'color': '🖍️ 글자색',
            'border': '🔲 테두리 선',
            'border-top': '윗면 테두리',
            'border-bottom': '아랫면 테두리',
            'border-left': '좌측 테두리',
            'border-right': '우측 테두리',
            'border-radius': '↪️ 테두리 둥글기 (라운드)',
            'padding': '↔️ 내부 여백 (안쪽)',
            'padding-top': '위쪽 내부 여백',
            'padding-bottom': '아래쪽 내부 여백',
            'padding-left': '왼쪽 내부 여백',
            'padding-right': '오른쪽 내부 여백',
            'margin': '↔️ 외부 여백 (바깥 간격)',
            'margin-top': '위쪽 외부 여백',
            'margin-bottom': '아래쪽 외부 여백',
            'width': '📏 가로 너비',
            'max-width': '📏 최대 가로 너비',
            'height': '↕️ 세로 높이',
            'font-size': '🅰️ 글자 크기',
            'font-weight': '𝐁 글자 굵기',
            'font-family': '🔤 폰트(글꼴)',
            'text-align': '📑 글자 정렬',
            'line-height': '줄 간격',
            'box-shadow': '👤 그림자 효과',
            'opacity': '👻 투명도 (0~1)',
            'display': '📐 배치 방식 (Flex 등)',
            'justify-content': '가로 정렬 방식',
            'align-items': '세로 정렬 방식',
            'gap': '요소 사이 간격',
            'overflow': '넘침 처리 방식',
            'position': '위치 지정 기준',
            'transform': '도형 변형 (이동/회전)'
        };

        // 💡 1. 템플릿 슬롯 및 자동 저장 기능
        function switchSlot(num) {
            if(currentSlot === num) return;
            saveData(); // 기존 데이터 저장
            
            currentSlot = num;
            document.querySelectorAll('.slot-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('slot-' + num).classList.add('active');
            
            loadData(num); // 새 데이터 불러오기
        }

        function saveData() {
            localStorage.setItem('htmlCodeSlot_' + currentSlot, codeEditor.value);
        }

        function loadData(num) {
            const savedCode = localStorage.getItem('htmlCodeSlot_' + num) || '';
            codeEditor.value = savedCode;
            codeEditor.dispatchEvent(new Event('input')); // 입력 이벤트 강제 발생시켜 화면 새로고침
        }

        // 입력 시 자동 저장 및 화면 업데이트
        codeEditor.addEventListener('input', () => {
            const html = codeEditor.value;
            previewBox.innerHTML = html;
            analyzeCode(html);
            saveData();
        });

        // 💡 2. 코드 구조 파악 (정밀 위치 기록 포함)
        function tokenizeHTML(html) {
            const regex = /<(\/?)([a-zA-Z0-9\-]+)([^>]*?)>|([^<]+)/g;
            let tokens = [];
            let match;
            
            while ((match = regex.exec(html)) !== null) {
                const isTag = !!match[2];
                const isClose = match[1] === '/';
                const tagName = match[2] ? match[2].toLowerCase() : null;
                const attributes = match[3] || '';
                const textContent = match[4] || '';
                
                if (!isTag && textContent.trim() === '') continue;

                tokens.push({
                    isTag: isTag, isClose: isClose, name: tagName, attrs: attributes,
                    text: match[0], rawContent: textContent.trim(),
                    start: match.index, end: regex.lastIndex
                });
            }
            return tokens;
        }

        function buildTree(tokens, htmlLength) {
            let root = { name: 'root', children: [], start: 0, openEnd: htmlLength, end: htmlLength };
            let stack = [root];
            const voidElements = ['br', 'hr', 'img', 'input'];

            for (let t of tokens) {
                let parent = stack[stack.length - 1];
                
                if (t.isTag && !t.isClose) {
                    // 여는 태그가 끝나는 위치(openEnd)를 정확히 기록합니다.
                    let node = { name: t.name, start: t.start, openEnd: t.end, end: t.end, children: [], attrs: t.attrs };
                    parent.children.push(node);
                    if (!voidElements.includes(t.name)) stack.push(node);
                } 
                else if (t.isTag && t.isClose) {
                    for (let i = stack.length - 1; i >= 1; i--) {
                        if (stack[i].name === t.name) {
                            stack[i].end = t.end; 
                            stack.length = i; 
                            break;
                        }
                    }
                } 
                else if (!t.isTag) {
                    parent.children.push({ name: '#text', text: t.rawContent, start: t.start, end: t.end });
                }
            }
            return root.children;
        }

        function translateTag(node) {
            const n = node.name;
            if (n === 'div') return { badge: 'box', text: '📦 구역 (도형/상자)' };
            if (n === 'span') return { badge: 'text', text: '🏷️ 짧은 텍스트' };
            if (n === 'details') return { badge: 'special', text: '📂 접기/펼치기 전체 틀' };
            if (n === 'summary') return { badge: 'special', text: '▶ 펼치기 제목' };
            if (n === 'br') return { badge: 'text', text: '↵ 줄바꿈' };
            if (n === 'hr') return { badge: 'box', text: '➖ 가로선' };
            if (n === 'strong' || n === 'b') return { badge: 'text', text: '𝗕 굵은 글씨' };
            if (n === '#text') {
                const previewText = node.text.length > 15 ? node.text.substring(0, 15) + '...' : node.text;
                return { badge: '', text: `📝 텍스트 내용: "${previewText}"` };
            }
            return { badge: '', text: `<${n}> 태그` };
        }

        function parseStyles(attrString) {
            if (!attrString) return [];
            const styleMatch = attrString.match(/style\s*=\s*(["'])(.*?)\1/i);
            if (!styleMatch) return [];
            
            const styleContent = styleMatch[2];
            const properties = [];
            const rules = styleContent.split(';').filter(rule => rule.trim() !== '');
            
            rules.forEach(rule => {
                const parts = rule.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const value = parts.slice(1).join(':').trim(); 
                    
                    properties.push({
                        key: key,
                        value: value,
                        koreanName: styleDictionary[key] || key 
                    });
                }
            });
            return properties;
        }

        function renderTreeUI(nodes) {
            let html = '';
            for (let node of nodes) {
                const info = translateTag(node);
                const styles = parseStyles(node.attrs);
                
                html += `<div class="tree-node">`;
                
                if (node.name === '#text' || node.name === 'br') {
                    html += `<div class="tree-summary" onclick="highlightFullTag(${node.start}, ${node.end})">`;
                    html += `${info.text}</div>`;
                } 
                else {
                    html += `<details>`;
                    html += `<summary class="tree-summary" onclick="highlightFullTag(${node.start}, ${node.end})">`;
                    if (info.badge) html += `<span class="badge ${info.badge}">${info.badge === 'box' ? 'BOX' : info.badge === 'text' ? 'TXT' : 'SPL'}</span>`;
                    html += `${info.text} (속성 ${styles.length}개)`;
                    html += `</summary>`;

                    if (styles.length > 0) {
                        html += `<div class="prop-list">`;
                        styles.forEach(prop => {
                            // 💡 오픈 엔드(여는 태그 끝) 인덱스를 함께 전달하여 정밀 검색 수행
                            html += `<div class="prop-item" onclick="highlightSpecificStyle(event, ${node.start}, ${node.openEnd}, '${prop.key}')">`;
                            html += `<span class="prop-name">${prop.koreanName}</span>`;
                            html += `<span class="prop-value">${prop.value}</span>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    }

                    if (node.children && node.children.length > 0) {
                        html += `<div class="tree-children">${renderTreeUI(node.children)}</div>`;
                    }
                    html += `</details>`;
                }
                html += `</div>`;
            }
            return html;
        }

        function analyzeCode(html) {
            if (!html.trim()) {
                structureBox.innerHTML = '<div class="empty-msg">코드를 입력하면 여기에 분석 결과가 나타납니다.</div>';
                return;
            }
            const tokens = tokenizeHTML(html);
            const tree = buildTree(tokens, html.length);
            structureBox.innerHTML = renderTreeUI(tree);
        }

        function highlightFullTag(start, end) {
            codeEditor.focus();
            codeEditor.setSelectionRange(start, end);
            scrollToPosition(start);
        }

        // 💡 3. 오류 100% 수정된 초정밀 속성 하이라이트 엔진
        function highlightSpecificStyle(event, nodeStart, nodeOpenEnd, cssKey) {
            event.stopPropagation(); 
            
            const code = codeEditor.value;
            // 🚨 핵심 포인트: '여는 태그 안에서만' 검색하여 자식 태그의 속성을 잘못 찾는 일 원천 차단
            const tagCode = code.substring(nodeStart, nodeOpenEnd);
            
            // 🚨 핵심 포인트: 정규식에 (?<![\w-]) 를 추가하여 color가 background-color에 반응하는 오차 원천 차단
            // cssKey에 붙어있는 앞 글자가 알파벳이나 하이픈(-)이 아닐 때만 매칭!
            const regex = new RegExp(`(?<![\\w-])${cssKey.replace(/-/g, '\\-')}\\s*:\\s*[^;"]+`, 'i');
            const match = tagCode.match(regex);
            
            if (match) {
                const exactStart = nodeStart + match.index;
                const exactEnd = exactStart + match[0].length;
                
                codeEditor.focus();
                codeEditor.setSelectionRange(exactStart, exactEnd);
                scrollToPosition(exactStart);
            } else {
                // 만약 구문이 특이해서 못 찾을 경우, 여는 태그만 블록 지정
                highlightFullTag(nodeStart, nodeOpenEnd);
            }
        }

        function scrollToPosition(index) {
            const textUpToStart = codeEditor.value.substring(0, index);
            const lineBreaks = (textUpToStart.match(/\n/g) || []).length;
            const lineHeight = 19.5; 
            codeEditor.scrollTop = (lineBreaks * lineHeight) - 50;
        }

        function copyCode() {
            const code = codeEditor.value;
            if(!code) return alert('복사할 코드가 없습니다.');
            navigator.clipboard.writeText(code).then(() => {
                alert('코드 복사가 완료되었습니다!');
            });
        }

        // 💡 창이 열릴 때 1번 슬롯(혹은 기존 내용)을 자동으로 불러옵니다.
        window.onload = () => {
            loadData(1);
        }
    </script>
</body>
</html>
