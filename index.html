<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상태창 및 항목 템플릿 생성기</title>
    <style>
        body {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px; /* 좌우 폭 고정 */
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .header .title-mark {
            color: #f7768e;
            margin-right: 5px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-start;
        }
        /* 입력창 공통 스타일 */
        textarea {
            background-color: #24283b;
            color: #c0caf5;
            border: none;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 15px;
            font-family: inherit;
            resize: none; /* 사용자 임의 크기 조절 방지 */
            overflow: hidden; /* 스크롤바 숨김 */
            min-height: 24px;
            line-height: 1.5;
            box-sizing: border-box;
            outline: none;
        }
        textarea::placeholder {
            color: #565f89;
        }
        /* 항목 이름 적는 곳 (짧은 너비) */
        .item-name {
            width: 30%;
        }
        /* 항목 세부 설정 적는 곳 (긴 너비) */
        .item-value {
            width: 60%;
            flex-grow: 1;
        }
        /* 삭제 버튼 */
        .delete-btn {
            background: none;
            border: none;
            color: #565f89;
            font-size: 18px;
            cursor: pointer;
            padding: 12px 5px;
            transition: color 0.2s;
        }
        .delete-btn:hover {
            color: #f7768e;
        }
        /* 항목 추가 버튼 */
        .add-btn {
            width: 100%;
            background-color: transparent;
            color: #7aa2f7;
            border: 1.5px dashed #414868;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .add-btn:hover {
            border-color: #7aa2f7;
            background-color: rgba(122, 162, 247, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div><span class="title-mark">*</span>항목</div>
            <div id="charCount" style="color: #565f89; font-size: 14px;">0 / 1,000</div>
        </div>

        <div id="itemList">
            <!-- 기본 항목 1개 제공 -->
            <div class="item-row">
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            </div>
        </div>

        <button class="add-btn" onclick="addRow()">+ 항목 추가</button>
    </div>

    <script>
        const itemList = document.getElementById('itemList');
        const charCountDisplay = document.getElementById('charCount');

        // 입력 시 자동으로 높이를 조절하고 글자 수를 세는 이벤트
        document.addEventListener('input', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                // 상하 길이 자동 조절 핵심 로직
                e.target.style.height = 'auto'; // 높이를 초기화한 후
                e.target.style.height = (e.target.scrollHeight) + 'px'; // 내용물의 높이만큼 다시 설정
                
                updateCharCount();
            }
        });

        // 새로운 항목 줄을 추가하는 함수
        function addRow() {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            `;
            itemList.appendChild(row);
        }

        // 특정 항목 줄을 삭제하는 함수
        function deleteRow(btn) {
            const row = btn.parentElement;
            row.remove();
            updateCharCount();
        }

        // 전체 글자 수를 계산하는 함수 (이미지 우측 상단 기능 구현)
        function updateCharCount() {
            const textareas = document.querySelectorAll('textarea');
            let totalLength = 0;
            textareas.forEach(textarea => {
                totalLength += textarea.value.length;
            });
            charCountDisplay.textContent = `${totalLength.toLocaleString()} / 1,000`;
        }
    </script>
</body>
</html>
