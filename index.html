<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SO-MAA TOOLS</title>
    <style>
        /* 기존 툴들과 동일한 다크 테마 배경 및 폰트 */
        body {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 전체 높이를 차지하여 요소를 정중앙에 배치 */
            margin: 0;
            overflow: hidden; /* 스크롤 방지 */
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px; /* 버튼이 너무 넓어지지 않도록 최대 폭 고정 */
            padding: 20px;
        }

        /* 중앙 동그란 이미지 스타일 */
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* 완벽한 원형 만들기 */
            object-fit: cover; /* 이미지가 찌그러지지 않고 원 안에 꽉 차도록 설정 */
            margin-bottom: 40px; /* 사진과 버튼 사이의 간격 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); /* 사진 아래에 은은한 그림자 */
            border: 3px solid #24283b; /* 사진 테두리에 살짝 어두운 라인 추가 */
        }

        /* 좌우가 둥글고 살짝 얇은 캡슐 형태의 버튼 모음 */
        .btn-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 16px; /* 버튼과 버튼 사이의 세로 간격 */
        }

        .nav-btn {
            display: block;
            width: 100%;
            background-color: transparent;
            color: #c0caf5;
            border: 1.5px solid #414868;
            border-radius: 40px; /* 좌우 끝을 완전히 둥글게 (캡슐 형태) */
            padding: 14px 20px; /* 상하 여백을 살짝 줄여서 얇은 느낌 연출 */
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none; /* 링크(a태그)의 밑줄 제거 */
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* 마우스 오버 및 터치 시 스타일 (기존 테마 포인트 컬러인 #7aa2f7 사용) */
        @media (hover: hover) {
            .nav-btn:hover {
                background-color: #7aa2f7;
                color: #1a1b26;
                border-color: #7aa2f7;
                transform: translateY(-2px); /* 마우스 올렸을 때 살짝 위로 뜨는 효과 */
            }
        }
        
        .nav-btn:active {
            background-color: #7aa2f7;
            color: #1a1b26;
            border-color: #7aa2f7;
            transform: translateY(0); /* 터치 시 다시 눌리는 느낌 */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 💡 요청하신 중앙 동그란 프로필 이미지 -->
        <img src="https://i.postimg.cc/SN91Vkk3/IMG-3082.png" alt="Profile Image" class="profile-img">

        <!-- 💡 페이지 이동 버튼 2개 -->
        <div class="btn-group">
            <a href="tracker.html" class="nav-btn">트래커 만들기</a>
            <a href="htmlcode.html" class="nav-btn">HTML 해독기</a>
        </div>
    </div>

</body>
</html>
