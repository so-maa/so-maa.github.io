<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 및 항목 템플릿 생성기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; padding: 40px 20px; padding-bottom: 150px; margin: 0; }
        .container { width: 100%; max-width: 600px; }
        
        /* 💡 상단 트래커 및 슬롯 라인 레이아웃 */
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .tracker-title { font-size: 20px; font-weight: bold; color: #c0caf5; letter-spacing: 0.5px; }
        
        .slot-container { display: flex; gap: 6px; }
        .slot-btn { background-color: #24283b; color: #565f89; border: 1px solid #414868; border-radius: 6px; width: 32px; height: 32px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
        .slot-btn.active { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }

        /* 💡 기능 버튼 라인 (항목이 있던 자리에 일렬 배치) */
        .header-actions { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
        .header-actions::-webkit-scrollbar { display: none; }
        
        .action-btn { background-color: transparent; color: #7aa2f7; border: 1px solid #7aa2f7; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
        .template-paste-btn { background-color: rgba(158, 206, 106, 0.1); color: #9ece6a; border-color: #9ece6a; }

        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
        textarea { background-color: #24283b; color: #c0caf5; border: none; border-radius: 8px; padding: 12px 15px; font-size: 16px; font-family: inherit; resize: none; overflow: hidden; min-height: 24px; line-height: 1.5; box-sizing: border-box; outline: none; }
        textarea:focus { box-shadow: 0 0 0 2px #7aa2f7; }
        textarea::placeholder { color: #565f89; }
        .item-name { width: 30%; }
        .item-value { width: 60%; flex-grow: 1; }
        
        .delete-btn { background: none; border: none; color: #565f89; font-size: 18px; cursor: pointer; padding: 12px 5px; transition: color 0.2s; }
        .add-btn { width: 100%; background-color: transparent; color: #7aa2f7; border: 1.5px dashed #414868; border-radius: 8px; padding: 15px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        
        .shortcut-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: rgba(36, 40, 59, 0.95); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; gap: 6px; align-items: center; z-index: 1000; max-width: 95vw; overflow-x: auto; white-space: nowrap; }
        .shortcut-bar::-webkit-scrollbar { display: none; }

        .shortcut-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 20px; padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background-color 0.2s, color 0.2s; white-space: nowrap; }
        .divider { width: 1px; height: 20px; background-color: #565f89; margin: 0 2px; flex-shrink: 0; }
        .copy-btn { background-color: #9ece6a; color: #1a1b26; }
        .move-btn { background-color: #24283b; border: 1px solid #565f89; }

        /* 모달 공통 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(26, 27, 38, 0.8); backdrop-filter: blur(3px); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-content { background-color: #24283b; width: 90%; max-width: 450px; border-radius: 12px; padding: 25px 20px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        .modal-close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #565f89; font-size: 20px; cursor: pointer; padding: 5px; }
        .modal-content h3 { margin-top: 0; color: #c0caf5; font-size: 16px; margin-bottom: 5px; }
        .modal-content p { font-size: 12px; color: #565f89; margin-bottom: 15px; margin-top: 0; line-height: 1.4; }
        
        .modal-textarea { width: 100%; background-color: #1a1b26; border: 1px solid #414868; border-radius: 8px; padding: 12px; color: #c0caf5; font-size: 14px; resize: vertical; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; outline: none; }
        .modal-textarea:focus { border-color: #7aa2f7; }
        
        .modal-confirm-btn { width: 100%; background-color: #7aa2f7; color: #1a1b26; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* 💡 4가지 선택 모드 버튼 스타일 */
        .merge-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .merge-option-btn { width: 100%; background-color: #1a1b26; color: #c0caf5; border: 1px solid #414868; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: left; transition: all 0.2s; }
        .merge-option-btn:hover { background-color: #7aa2f7; color: #1a1b26; border-color: #7aa2f7; }

        @media (hover: hover) {
            .shortcut-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .copy-btn:hover { background-color: #73daca; }
            .delete-btn:hover { color: #f7768e; }
            .add-btn:hover { border-color: #7aa2f7; background-color: rgba(122, 162, 247, 0.1); }
            .action-btn:hover { background-color: #7aa2f7; color: #1a1b26; } 
            .template-paste-btn:hover { background-color: #9ece6a; color: #1a1b26; }
            .slot-btn:hover:not(.active) { background-color: #414868; color: #c0caf5; }
            .modal-close-btn:hover { color: #f7768e; }
            .modal-confirm-btn:hover { background-color: #8db0f8; }
            .merge-option-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
        }
        
        .shortcut-btn:active { background-color: #7aa2f7; color: #1a1b26; }
        .copy-btn:active { background-color: #73daca; }
        .delete-btn:active { color: #f7768e; }
        .add-btn:active { border-color: #7aa2f7; background-color: rgba(122, 162, 247, 0.1); }
        .action-btn:active { background-color: #7aa2f7; color: #1a1b26; } 
        .template-paste-btn:active { background-color: #9ece6a; color: #1a1b26; }
        .slot-btn:active:not(.active) { background-color: #414868; color: #c0caf5; }
        .merge-option-btn:active { background-color: #7aa2f7; color: #1a1b26; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 💡 상단 트래커 타이틀 및 슬롯 번호 라인 -->
        <div class="top-nav-bar">
            <div class="tracker-title">트래커</div>
            <div class="slot-container">
                <button class="slot-btn active" id="slot-1" onclick="switchSlot(1)">1</button>
                <button class="slot-btn" id="slot-2" onclick="switchSlot(2)">2</button>
                <button class="slot-btn" id="slot-3" onclick="switchSlot(3)">3</button>
                <button class="slot-btn" id="slot-4" onclick="switchSlot(4)">4</button>
                <button class="slot-btn" id="slot-5" onclick="switchSlot(5)">5</button>
            </div>
        </div>

        <!-- 💡 기능 버튼들을 일렬로 배치한 헤더 영역 -->
        <div class="header-actions">
            <button class="action-btn" id="copyAllBtn" onclick="copyAllData(this)">전체 복사</button>
            <button class="action-btn" onclick="openImportModal(this)">붙여넣기</button>
            <button class="action-btn" id="copyTemplateBtn" onclick="copyTemplateData(this)">템플릿 복사</button>
            <button class="action-btn template-paste-btn" id="pasteTemplateBtn" onclick="triggerTemplatePaste(this)" style="display: none;">템플릿 붙이기</button>
        </div>

        <div id="itemList"></div>

        <button class="add-btn" onclick="addRow(this)">+ 항목 추가</button>
    </div>

    <!-- 💡 외부 텍스트 입력 모달 -->
    <div id="importModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeImportModal()">✕</button>
            <h3>외부 텍스트 붙여넣기</h3>
            <p>'항목이름: 항목설명' 형식의 텍스트를 붙여넣으세요.</p>
            <textarea id="importTextarea" class="modal-textarea" rows="8" placeholder="예시)&#10;이름: 홍길동&#10;성격: 활발하고 밝음"></textarea>
            <button class="modal-confirm-btn" onclick="submitImportText()">확인</button>
        </div>
    </div>

    <!-- 💡 기존 내용이 있을 때 나타나는 4가지 병합 선택 모달 -->
    <div id="mergeModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeMergeModal()">✕</button>
            <h3>중복 데이터 감지</h3>
            <p>현재 템플릿에 이미 작성된 내용이 있습니다. 방식을 선택해 주세요.</p>
            <div class="merge-btn-group">
                <button class="merge-option-btn" onclick="executeMerge('overwrite')">1. 기존 내용 삭제 후 붙여넣기</button>
                <button class="merge-option-btn" onclick="executeMerge('top')">2. 기존 내용 최상단에 붙여넣기</button>
                <button class="merge-option-btn" onclick="executeMerge('bottom')">3. 기존 내용 최하단에 붙여넣기</button>
                <button class="merge-option-btn" onclick="executeMerge('match')">4. 기존 내용 순서에 맞게 붙여넣기</button>
            </div>
        </div>
    </div>

    <div class="shortcut-bar" id="shortcutBar">
        <button class="shortcut-btn" onclick="insertShortcut(this, '→')">→</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, '↔')">↔</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, '·')">·</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, 'char')">char</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, 'user')">user</button>
        
        <div class="divider"></div>
        
        <button class="shortcut-btn move-btn" onclick="moveRow(this, 'up')">↑</button>
        <button class="shortcut-btn move-btn" onclick="moveRow(this, 'down')">↓</button>
        
        <button class="shortcut-btn copy-btn" id="copyBtn" onclick="copyFocusedField(this)">복사</button>
    </div>

    <script>
        const itemList = document.getElementById('itemList');
        const shortcutBar = document.getElementById('shortcutBar');
        const copyBtn = document.getElementById('copyBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const copyTemplateBtn = document.getElementById('copyTemplateBtn');
        const pasteTemplateBtn = document.getElementById('pasteTemplateBtn');
        
        const importModal = document.getElementById('importModal');
        const importTextarea = document.getElementById('importTextarea');
        const mergeModal = document.getElementById('mergeModal');

        let lastFocusedTextarea = null;
        let currentSlot = 1; 
        let pendingImportData = null; // 병합 모달에서 사용할 대기 중인 데이터

        // ==========================================
        // 💡 텍스트 파싱 유틸리티 함수
        // ==========================================
        function parseTextToItems(text) {
            const lines = text.split('\n');
            let parsedItems = [];
            let currentItem = null;

            lines.forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const nameStr = line.substring(0, colonIndex).trim();
                    const valueStr = line.substring(colonIndex + 1).trim();
                    currentItem = { name: nameStr, value: valueStr };
                    parsedItems.push(currentItem);
                } else if (currentItem && line.trim() !== '') {
                    currentItem.value += '\n' + line.trim();
                }
            });
            return parsedItems;
        }

        // 현재 슬롯이 완전히 비어있는지 확인하는 함수
        function isCurrentSlotEmpty() {
            const rows = document.querySelectorAll('.item-row');
            if (rows.length === 0) return true;
            if (rows.length === 1) {
                const name = rows[0].querySelector('.item-name').value.trim();
                const value = rows[0].querySelector('.item-value').value.trim();
                if (name === '' && value === '') return true;
            }
            return false;
        }

        // ==========================================
        // 💡 [붙여넣기] 및 [템플릿 붙이기] 통합 공통 분기 처리
        // ==========================================
        function openImportModal(btn) {
            if (btn) btn.blur();
            importModal.style.display = 'flex';
            importTextarea.value = '';
            importTextarea.focus();
        }

        function closeImportModal() { importModal.style.display = 'none'; }
        function closeMergeModal() { mergeModal.style.display = 'none'; pendingImportData = null; }

        function submitImportText() {
            const text = importTextarea.value;
            const newItems = parseTextToItems(text);

            if (newItems.length === 0) {
                alert('올바른 형식(항목이름: 항목설명)의 텍스트를 찾을 수 없습니다.');
                return;
            }

            closeImportModal();
            handleIncomingData(newItems);
        }

        function triggerTemplatePaste(btn) {
            if (btn) btn.blur();
            const savedClipboard = localStorage.getItem('clipboardTemplateData');
            if (!savedClipboard) return;

            const newItems = JSON.parse(savedClipboard);
            handleIncomingData(newItems);

            // 템플릿 붙이기 완료 후 클립보드 데이터 정리
            localStorage.removeItem('clipboardTemplateData');
            localStorage.removeItem('clipboardSourceSlot');
            checkClipboardState();
        }

        // 데이터가 들어왔을 때 빈 슬롯인지, 내용이 있는지 판별하여 모달을 띄우거나 바로 적용
        function handleIncomingData(newItems) {
            if (isCurrentSlotEmpty()) {
                applyMergeData('overwrite', newItems);
            } else {
                pendingImportData = newItems;
                mergeModal.style.display = 'flex';
            }
        }

        // ==========================================
        // 💡 4가지 병합 모드 실행 로직
        // ==========================================
        function executeMerge(mode) {
            if (!pendingImportData) return;
            const dataToProcess = pendingImportData;
            closeMergeModal();
            applyMergeData(mode, dataToProcess);
        }

        function applyMergeData(mode, newItems) {
            let existingItems = [];
            if (mode !== 'overwrite') {
                document.querySelectorAll('.item-row').forEach(row => {
                    const name = row.querySelector('.item-name').value;
                    const value = row.querySelector('.item-value').value;
                    if (name.trim() !== '' || value.trim() !== '') {
                        existingItems.push({ name, value });
                    }
                });
            }

            let finalItems = [];

            if (mode === 'overwrite') {
                finalItems = newItems;
            } else if (mode === 'top') {
                finalItems = [...newItems, ...existingItems];
            } else if (mode === 'bottom') {
                finalItems = [...existingItems, ...newItems];
            } else if (mode === 'match') {
                // 기존 내용 순서에 맞게 붙여넣기 (기존 항목명 뒤에 새 항목들을 차례대로 매칭 혹은 하단 추가)
                let map = {};
                existingItems.forEach(item => {
                    if (!map[item.name]) map[item.name] = [];
                    map[item.name].push(item.value);
                });

                // 기존에 있는 이름의 항목들은 해당 위치 아래에 값을 이어붙이고, 새로운 이름은 맨 아래로 보냄
                let processedNames = new Set();
                existingItems.forEach(item => {
                    if (!processedNames.has(item.name)) {
                        processedNames.add(item.name);
                        // 기존 값들 추가
                        map[item.name].forEach(val => finalItems.push({ name: item.name, value: val }));
                        // 새로 들어온 데이터 중 이름이 일치하는 것들 추가
                        newItems.filter(ni => ni.name === item.name).forEach(ni => finalItems.push(ni));
                    }
                });

                // 기존에 없던 완전히 새로운 이름의 항목들은 최하단에 추가
                newItems.forEach(ni => {
                    if (!processedNames.has(ni.name)) {
                        finalItems.push(ni);
                    }
                });
            }

            // 화면 반영 및 저장
            itemList.innerHTML = '';
            if (finalItems.length > 0) {
                finalItems.forEach(item => addRow(null, item.name, item.value));
            } else {
                addRow();
            }
            saveData();
        }

        // ==========================================
        // 템플릿 복사 상태 관리
        // ==========================================
        function copyTemplateData(btn) {
            if (btn) btn.blur();
            const rows = document.querySelectorAll('.item-row');
            const dataToCopy = [];
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                dataToCopy.push({ name: nameStr, value: valueStr });
            });

            localStorage.setItem('clipboardTemplateData', JSON.stringify(dataToCopy));
            localStorage.setItem('clipboardSourceSlot', currentSlot.toString());

            copyTemplateBtn.textContent = '복사 완료!';
            setTimeout(() => { copyTemplateBtn.textContent = '템플릿 복사'; }, 1000);
            checkClipboardState();
        }

        function checkClipboardState() {
            const hasData = localStorage.getItem('clipboardTemplateData');
            const sourceSlot = parseInt(localStorage.getItem('clipboardSourceSlot'));
            if (hasData && sourceSlot !== currentSlot) {
                pasteTemplateBtn.style.display = 'inline-block';
            } else {
                pasteTemplateBtn.style.display = 'none';
            }
        }

        function switchSlot(slotNumber) {
            if (currentSlot === slotNumber) return; 
            saveData();
            
            currentSlot = slotNumber;
            document.querySelectorAll('.slot-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('slot-' + slotNumber).classList.add('active');

            lastFocusedTextarea = null;
            itemList.innerHTML = '';

            loadData(slotNumber);
            checkClipboardState();
        }

        function copyAllData(btn) {
            if (btn) btn.blur(); 
            const rows = document.querySelectorAll('.item-row');
            let resultText = [];
            
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                if (nameStr.trim() !== '' || valueStr.trim() !== '') {
                    resultText.push(`${nameStr}: ${valueStr}`);
                }
            });

            const finalString = resultText.join('\n');
            if (finalString === '') {
                alert('복사할 내용이 없습니다!');
                return;
            }

            navigator.clipboard.writeText(finalString).then(() => {
                copyAllBtn.textContent = '완료!';
                setTimeout(() => { copyAllBtn.textContent = '전체 복사'; }, 1000);
            }).catch(err => {
                alert('복사에 실패했습니다.');
            });
        }

        function saveData() {
            const rows = document.querySelectorAll('.item-row');
            const dataToSave = [];
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                dataToSave.push({ name: nameStr, value: valueStr });
            });
            localStorage.setItem('charTemplateData_' + currentSlot, JSON.stringify(dataToSave));
        }

        function loadData(slotNumber = 1) {
            if (slotNumber === 1 && !localStorage.getItem('charTemplateData_1') && localStorage.getItem('charTemplateData')) {
                localStorage.setItem('charTemplateData_1', localStorage.getItem('charTemplateData'));
            }

            const savedData = localStorage.getItem('charTemplateData_' + slotNumber);
            if (savedData) {
                const dataArray = JSON.parse(savedData);
                if (dataArray.length > 0) {
                    dataArray.forEach(item => addRow(null, item.name, item.value));
                    checkClipboardState();
                    return;
                }
            }
            addRow();
            checkClipboardState();
        }

        document.addEventListener('focusin', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                lastFocusedTextarea = e.target;
            }
        });

        document.addEventListener('input', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                adjustHeight(e.target);
                updateCharCount();
                saveData();
            }
        });

        function adjustHeight(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function insertShortcut(btn, text) {
            if (btn) btn.blur(); 
            if (lastFocusedTextarea) {
                setTimeout(() => {
                    const start = lastFocusedTextarea.selectionStart;
                    const end = lastFocusedTextarea.selectionEnd;
                    const currentValue = lastFocusedTextarea.value;
                    
                    lastFocusedTextarea.value = currentValue.substring(0, start) + text + currentValue.substring(end);
                    lastFocusedTextarea.selectionStart = lastFocusedTextarea.selectionEnd = start + text.length;
                    
                    adjustHeight(lastFocusedTextarea);
                    updateCharCount();
                    saveData();
                    lastFocusedTextarea.focus();
                }, 10);
            }
        }

        function moveRow(btn, direction) {
            if (btn) btn.blur();
            if (!lastFocusedTextarea) return;
            const currentRow = lastFocusedTextarea.closest('.item-row');
            if (!currentRow) return;

            if (direction === 'up') {
                const prevRow = currentRow.previousElementSibling;
                if (prevRow) {
                    itemList.insertBefore(currentRow, prevRow);
                    saveData();
                    lastFocusedTextarea.focus();
                }
            } else if (direction === 'down') {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    itemList.insertBefore(currentRow, nextRow.nextElementSibling);
                    saveData();
                    lastFocusedTextarea.focus();
                }
            }
        }

        function copyFocusedField(btn) {
            if (btn) btn.blur();
            if (lastFocusedTextarea) {
                const textToCopy = lastFocusedTextarea.value;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = '완료!';
                    setTimeout(() => { copyBtn.textContent = '복사'; }, 1000);
                }).catch(err => {
                    alert('복사에 실패했습니다.');
                });
                lastFocusedTextarea.focus();
            }
        }

        function addRow(btn = null, nameStr = '', valueStr = '') {
            if (btn) btn.blur();

            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            `;
            
            const textareas = row.querySelectorAll('textarea');
            textareas[0].value = nameStr;
            textareas[1].value = valueStr;
            
            itemList.appendChild(row);
            
            setTimeout(() => {
                textareas.forEach(ta => adjustHeight(ta));
                updateCharCount();
            }, 0);
            saveData();
        }

        function deleteRow(btn) {
            if (btn) btn.blur();
            const row = btn.parentElement;
            row.remove();
            if (itemList.children.length === 0) {
                addRow();
            } else {
                updateCharCount();
                saveData();
            }
        }

        function updateCharCount() {
            const textareas = document.querySelectorAll('textarea');
            let totalLength = 0;
            textareas.forEach(textarea => {
                totalLength += textarea.value.length;
            });
            // (참고용 글자수 표시 엘리먼트가 상단에서 빠졌으므로 내부 계산용으로만 유지)
        }

        if (window.visualViewport) {
            const updateBarPosition = () => {
                const viewportHeight = window.visualViewport.height;
                const offsetTop = window.visualViewport.offsetTop;
                shortcutBar.style.bottom = 'auto';
                shortcutBar.style.top = (offsetTop + viewportHeight - 70) + 'px';
            };
            window.visualViewport.addEventListener('resize', updateBarPosition);
            window.visualViewport.addEventListener('scroll', updateBarPosition);
            updateBarPosition();
        }

        loadData(1);
    </script>
</body>
</html>
