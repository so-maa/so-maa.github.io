<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 및 항목 템플릿 생성기</title>
    <style>
        body {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px 10px; /* 전체 화면 여백도 살짝 줄였습니다 */
            padding-bottom: 120px; 
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px; /* 헤더 글자 크기 축소 */
            font-weight: bold;
        }
        .header .title-mark {
            color: #f7768e;
            margin-right: 5px;
        }
        .item-row {
            display: flex;
            gap: 6px; /* 칸 사이 간격 축소 */
            margin-bottom: 8px; /* 줄 사이 간격 축소 */
            align-items: flex-start;
        }
        
        /* 💡 추가된 순서 변경 버튼 스타일 */
        .order-controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 2px;
        }
        .order-btn {
            background: none;
            border: none;
            color: #565f89;
            font-size: 10px; /* 화살표 크기를 작게 */
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .order-btn:hover {
            color: #7aa2f7;
        }

        textarea {
            background-color: #24283b;
            color: #c0caf5;
            border: none;
            border-radius: 6px; /* 테두리 둥글기 살짝 축소 */
            padding: 8px 10px; /* 💡 핵심: 내부 여백을 확 줄여서 날씬하게 만듦 */
            font-size: 16px; /* 모바일 강제 확대 방지를 위해 16px 유지 */
            font-family: inherit;
            resize: none;
            overflow: hidden;
            min-height: 20px;
            line-height: 1.4; /* 줄간격을 살짝 타이트하게 */
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            box-shadow: 0 0 0 1.5px #7aa2f7; 
        }
        textarea::placeholder {
            color: #565f89;
        }
        .item-name {
            width: 28%;
        }
        .item-value {
            width: 60%;
            flex-grow: 1;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #565f89;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 4px;
            margin-top: 2px;
            transition: color 0.2s;
        }
        .delete-btn:hover {
            color: #f7768e;
        }
        .add-btn {
            width: 100%;
            background-color: transparent;
            color: #7aa2f7;
            border: 1.5px dashed #414868;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px; /* 버튼 글자 크기 축소 */
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s;
        }
        .add-btn:hover {
            border-color: #7aa2f7;
            background-color: rgba(122, 162, 247, 0.1);
        }
        .shortcut-bar {
            position: fixed;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(36, 40, 59, 0.95);
            backdrop-filter: blur(5px);
            padding: 10px 16px; /* 단축키 바 크기도 살짝 축소 */
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 1000;
        }
        .shortcut-btn {
            background-color: #414868;
            color: #c0caf5;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .shortcut-btn:hover, .shortcut-btn:active {
            background-color: #7aa2f7;
            color: #1a1b26;
        }
        .divider { width: 1px; height: 16px; background-color: #565f89; margin: 0 4px; }
        .copy-btn { background-color: #9ece6a; color: #1a1b26; }
        .copy-btn:hover, .copy-btn:active { background-color: #73daca; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div><span class="title-mark">*</span>항목 설정</div>
            <div id="charCount" style="color: #565f89; font-size: 12px;">0 / 1,000</div>
        </div>

        <div id="itemList"></div>

        <button class="add-btn" onclick="addRow()">+ 항목 추가</button>
    </div>

    <div class="shortcut-bar" id="shortcutBar">
        <button class="shortcut-btn" onclick="insertShortcut('→')">→</button>
        <button class="shortcut-btn" onclick="insertShortcut('·')">·</button>
        <button class="shortcut-btn" onclick="insertShortcut('char')">char</button>
        <button class="shortcut-btn" onclick="insertShortcut('user')">user</button>
        <div class="divider"></div>
        <button class="shortcut-btn copy-btn" id="copyBtn" onclick="copyFocusedField()">복사</button>
    </div>

    <script>
        const itemList = document.getElementById('itemList');
        const charCountDisplay = document.getElementById('charCount');
        const shortcutBar = document.getElementById('shortcutBar');
        const copyBtn = document.getElementById('copyBtn');
        
        let lastFocusedTextarea = null;

        function saveData() {
            const rows = document.querySelectorAll('.item-row');
            const dataToSave = [];
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                dataToSave.push({ name: nameStr, value: valueStr });
            });
            localStorage.setItem('charTemplateData', JSON.stringify(dataToSave));
        }

        function loadData() {
            const savedData = localStorage.getItem('charTemplateData');
            if (savedData) {
                const dataArray = JSON.parse(savedData);
                if (dataArray.length > 0) {
                    dataArray.forEach(item => addRow(item.name, item.value));
                    return;
                }
            }
            addRow();
        }

        document.addEventListener('focusin', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                lastFocusedTextarea = e.target;
            }
        });

        document.addEventListener('input', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                adjustHeight(e.target);
                updateCharCount();
                saveData();
            }
        });

        function adjustHeight(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function insertShortcut(text) {
            if (lastFocusedTextarea) {
                const start = lastFocusedTextarea.selectionStart;
                const end = lastFocusedTextarea.selectionEnd;
                const currentValue = lastFocusedTextarea.value;
                
                lastFocusedTextarea.value = currentValue.substring(0, start) + text + currentValue.substring(end);
                lastFocusedTextarea.selectionStart = lastFocusedTextarea.selectionEnd = start + text.length;
                
                adjustHeight(lastFocusedTextarea);
                updateCharCount();
                saveData();
                lastFocusedTextarea.focus();
            }
        }

        function copyFocusedField() {
            if (lastFocusedTextarea) {
                const textToCopy = lastFocusedTextarea.value;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = '완료!';
                    setTimeout(() => { copyBtn.textContent = '복사'; }, 1000);
                }).catch(err => {
                    console.log('클립보드 복사 실패:', err);
                    alert('복사에 실패했습니다.');
                });
                lastFocusedTextarea.focus();
            }
        }

        // ==========================================
        // 💡 새롭게 추가된 기능: 위로 이동 / 아래로 이동
        // ==========================================
        function moveUp(btn) {
            const row = btn.closest('.item-row');
            // 이전 형제 요소(위쪽 줄)가 존재한다면 자리를 바꿉니다.
            if (row.previousElementSibling) {
                row.parentNode.insertBefore(row, row.previousElementSibling);
                saveData(); // 순서가 바뀌었으니 자동 저장
            }
        }

        function moveDown(btn) {
            const row = btn.closest('.item-row');
            // 다음 형제 요소(아래쪽 줄)가 존재한다면 자리를 바꿉니다.
            if (row.nextElementSibling) {
                row.parentNode.insertBefore(row.nextElementSibling, row);
                saveData(); // 순서가 바뀌었으니 자동 저장
            }
        }
        // ==========================================

        function addRow(nameStr = '', valueStr = '') {
            const row = document.createElement('div');
            row.className = 'item-row';
            // 왼쪽에 위/아래 이동 버튼(▲, ▼)이 추가되었습니다.
            row.innerHTML = `
                <div class="order-controls">
                    <button class="order-btn" onclick="moveUp(this)">▲</button>
                    <button class="order-btn" onclick="moveDown(this)">▼</button>
                </div>
                <textarea class="item-name" rows="1" placeholder="이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            `;
            
            const textareas = row.querySelectorAll('textarea');
            textareas[0].value = nameStr;
            textareas[1].value = valueStr;
            
            itemList.appendChild(row);
            
            setTimeout(() => {
                textareas.forEach(ta => adjustHeight(ta));
                updateCharCount();
            }, 0);

            saveData();
        }

        function deleteRow(btn) {
            const row = btn.parentElement;
            row.remove();
            
            if (itemList.children.length === 0) {
                addRow();
            } else {
                updateCharCount();
                saveData();
            }
        }

        function updateCharCount() {
            const textareas = document.querySelectorAll('textarea');
            let totalLength = 0;
            textareas.forEach(textarea => {
                totalLength += textarea.value.length;
            });
            charCountDisplay.textContent = `${totalLength.toLocaleString()} / 1,000`;
        }

        if (window.visualViewport) {
            const updateBarPosition = () => {
                const viewportHeight = window.visualViewport.height;
                const offsetTop = window.visualViewport.offsetTop;
                shortcutBar.style.bottom = 'auto';
                shortcutBar.style.top = (offsetTop + viewportHeight - 70) + 'px';
            };
            window.visualViewport.addEventListener('resize', updateBarPosition);
            window.visualViewport.addEventListener('scroll', updateBarPosition);
            updateBarPosition();
        }

        loadData();
    </script>
</body>
</html>
