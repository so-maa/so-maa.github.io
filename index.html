<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 수 세기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        textarea {
            width: 90%;
            max-width: 600px;
            height: 250px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 20px;
        }
        .result-box {
            background-color: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 18px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: #0366d6;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>📝 글자 수 세기</h1>
    <textarea id="textInput" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요..."></textarea>
    
    <div class="result-box">
        공백 포함: <span id="withSpaces" class="highlight">0</span> 자<br>
        공백 제외: <span id="withoutSpaces" class="highlight">0</span> 자
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const withSpaces = document.getElementById('withSpaces');
        const withoutSpaces = document.getElementById('withoutSpaces');

        // 텍스트가 입력될 때마다 실행되는 함수
        textInput.addEventListener('input', () => {
            const text = textInput.value;
            
            // 공백 포함 글자 수 (줄바꿈 포함)
            withSpaces.textContent = text.length;
            
            // 공백 제외 글자 수 (띄어쓰기, 줄바꿈 모두 제거)
            withoutSpaces.textContent = text.replace(/[\s\n\r]/g, '').length;
        });
    </script>
</body>
</html>
