<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 및 항목 템플릿 생성기</title>
    <style>
        body {
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            /* 하단 단축키 바에 컨텐츠가 가려지지 않도록 여백 추가 */
            padding-bottom: 100px; 
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .header .title-mark {
            color: #f7768e;
            margin-right: 5px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-start;
        }
        textarea {
            background-color: #24283b;
            color: #c0caf5;
            border: none;
            border-radius: 8px;
            padding: 12px 15px;
            /* 모바일 자동 확대 방지를 위해 16px 이상으로 설정 필수 */
            font-size: 16px; 
            font-family: inherit;
            resize: none;
            overflow: hidden;
            min-height: 24px;
            line-height: 1.5;
            box-sizing: border-box;
            outline: none;
        }
        textarea::placeholder {
            color: #565f89;
        }
        .item-name {
            width: 30%;
        }
        .item-value {
            width: 60%;
            flex-grow: 1;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #565f89;
            font-size: 18px;
            cursor: pointer;
            padding: 12px 5px;
            transition: color 0.2s;
        }
        .delete-btn:hover {
            color: #f7768e;
        }
        .add-btn {
            width: 100%;
            background-color: transparent;
            color: #7aa2f7;
            border: 1.5px dashed #414868;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .add-btn:hover {
            border-color: #7aa2f7;
            background-color: rgba(122, 162, 247, 0.1);
        }

        /* 하단 고정 단축키 바 스타일 */
        .shortcut-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(36, 40, 59, 0.9);
            backdrop-filter: blur(5px);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .shortcut-btn {
            background-color: #414868;
            color: #c0caf5;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shortcut-btn:hover, .shortcut-btn:active {
            background-color: #7aa2f7;
            color: #1a1b26;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div><span class="title-mark">*</span>항목</div>
            <div id="charCount" style="color: #565f89; font-size: 14px;">0 / 1,000</div>
        </div>

        <div id="itemList">
            <div class="item-row">
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            </div>
        </div>

        <button class="add-btn" onclick="addRow()">+ 항목 추가</button>
    </div>

    <div class="shortcut-bar">
        <button class="shortcut-btn" onclick="insertShortcut('→')">→</button>
        <button class="shortcut-btn" onclick="insertShortcut('·')">·</button>
        <button class="shortcut-btn" onclick="insertShortcut('{{char}}')">char</button>
        <button class="shortcut-btn" onclick="insertShortcut('{{user}}')">user</button>
    </div>

    <script>
        const itemList = document.getElementById('itemList');
        const charCountDisplay = document.getElementById('charCount');
        
        // 마지막으로 클릭(포커스)된 텍스트 영역을 기억하는 변수
        let lastFocusedTextarea = null;

        // 화면 내의 어떤 textarea든 클릭하면 그 위치를 기억함
        document.addEventListener('focusin', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                lastFocusedTextarea = e.target;
            }
        });

        // 텍스트 입력 시 높이 자동 조절 및 글자 수 세기
        document.addEventListener('input', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                adjustHeight(e.target);
                updateCharCount();
            }
        });

        function adjustHeight(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        // 단축키 삽입 및 복사 함수
        function insertShortcut(text) {
            // 1. 클립보드에 복사
            navigator.clipboard.writeText(text).catch(err => {
                console.log('클립보드 복사 실패:', err);
            });

            // 2. 입력창에 붙여넣기
            if (lastFocusedTextarea) {
                const start = lastFocusedTextarea.selectionStart;
                const end = lastFocusedTextarea.selectionEnd;
                const currentValue = lastFocusedTextarea.value;
                
                // 커서 위치에 텍스트 삽입
                lastFocusedTextarea.value = currentValue.substring(0, start) + text + currentValue.substring(end);
                
                // 삽입한 텍스트 바로 뒤로 커서 이동
                lastFocusedTextarea.selectionStart = lastFocusedTextarea.selectionEnd = start + text.length;
                
                // 텍스트가 길어졌을 수 있으므로 높이 및 글자 수 업데이트 강제 실행
                adjustHeight(lastFocusedTextarea);
                updateCharCount();
                
                // 다시 입력창에 포커스를 주어 타이핑을 계속할 수 있게 함
                lastFocusedTextarea.focus();
            } else {
                // 선택된 창이 없을 경우 경고 메시지 (선택 사항)
                // alert('입력할 칸을 먼저 선택해주세요!');
            }
        }

        function addRow() {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            `;
            itemList.appendChild(row);
        }

        function deleteRow(btn) {
            const row = btn.parentElement;
            row.remove();
            updateCharCount();
        }

        function updateCharCount() {
            const textareas = document.querySelectorAll('textarea');
            let totalLength = 0;
            textareas.forEach(textarea => {
                totalLength += textarea.value.length;
            });
            charCountDisplay.textContent = `${totalLength.toLocaleString()} / 1,000`;
        }
    </script>
</body>
</html>
