<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상태창 및 항목 템플릿 생성기</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; padding: 40px 20px; padding-bottom: 150px; margin: 0; }
        .container { width: 100%; max-width: 600px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .header .title-area { display: flex; align-items: center; } /* 타이틀과 전체복사 버튼 정렬을 위해 추가 */
        .header .title-mark { color: #f7768e; margin-right: 5px; }
        
        /* 💡 새롭게 추가된 전체 복사 버튼 스타일 */
        .copy-all-btn {
            background-color: transparent;
            color: #7aa2f7;
            border: 1px solid #7aa2f7;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
        textarea { background-color: #24283b; color: #c0caf5; border: none; border-radius: 8px; padding: 12px 15px; font-size: 16px; font-family: inherit; resize: none; overflow: hidden; min-height: 24px; line-height: 1.5; box-sizing: border-box; outline: none; }
        textarea:focus { box-shadow: 0 0 0 2px #7aa2f7; }
        textarea::placeholder { color: #565f89; }
        .item-name { width: 30%; }
        .item-value { width: 60%; flex-grow: 1; }
        
        .delete-btn { background: none; border: none; color: #565f89; font-size: 18px; cursor: pointer; padding: 12px 5px; transition: color 0.2s; }
        .add-btn { width: 100%; background-color: transparent; color: #7aa2f7; border: 1.5px dashed #414868; border-radius: 8px; padding: 15px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        
        .shortcut-bar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: rgba(36, 40, 59, 0.95); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; gap: 6px; align-items: center; z-index: 1000; max-width: 95vw; overflow-x: auto; white-space: nowrap; }
        .shortcut-bar::-webkit-scrollbar { display: none; }
        .shortcut-bar { -ms-overflow-style: none; scrollbar-width: none; }

        .shortcut-btn { background-color: #414868; color: #c0caf5; border: none; border-radius: 20px; padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background-color 0.2s, color 0.2s; white-space: nowrap; }
        .divider { width: 1px; height: 20px; background-color: #565f89; margin: 0 2px; flex-shrink: 0; }
        .copy-btn { background-color: #9ece6a; color: #1a1b26; }
        .move-btn { background-color: #24283b; border: 1px solid #565f89; }

        /* PC (마우스) 환경 Hover 설정 */
        @media (hover: hover) {
            .shortcut-btn:hover { background-color: #7aa2f7; color: #1a1b26; }
            .copy-btn:hover { background-color: #73daca; }
            .delete-btn:hover { color: #f7768e; }
            .add-btn:hover { border-color: #7aa2f7; background-color: rgba(122, 162, 247, 0.1); }
            .copy-all-btn:hover { background-color: #7aa2f7; color: #1a1b26; } /* 전체 복사 호버 */
        }
        
        /* 모바일 터치 (Active) 설정 */
        .shortcut-btn:active { background-color: #7aa2f7; color: #1a1b26; }
        .copy-btn:active { background-color: #73daca; }
        .delete-btn:active { color: #f7768e; }
        .add-btn:active { border-color: #7aa2f7; background-color: rgba(122, 162, 247, 0.1); }
        .copy-all-btn:active { background-color: #7aa2f7; color: #1a1b26; } /* 전체 복사 터치 */
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-area">
                <div><span class="title-mark">*</span>항목</div>
                <!-- 전체 복사 버튼 추가 -->
                <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllData(this)">전체 복사</button>
            </div>
            <div id="charCount" style="color: #565f89; font-size: 14px;">0 / 1,000</div>
        </div>

        <div id="itemList"></div>

        <button class="add-btn" onclick="addRow(this)">+ 항목 추가</button>
    </div>

    <div class="shortcut-bar" id="shortcutBar">
        <button class="shortcut-btn" onclick="insertShortcut(this, '→')">→</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, '·')">·</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, 'char')">char</button>
        <button class="shortcut-btn" onclick="insertShortcut(this, 'user')">user</button>
        
        <div class="divider"></div>
        
        <button class="shortcut-btn move-btn" onclick="moveRow(this, 'up')">↑</button>
        <button class="shortcut-btn move-btn" onclick="moveRow(this, 'down')">↓</button>
        
        <button class="shortcut-btn copy-btn" id="copyBtn" onclick="copyFocusedField(this)">복사</button>
    </div>

    <script>
        const itemList = document.getElementById('itemList');
        const charCountDisplay = document.getElementById('charCount');
        const shortcutBar = document.getElementById('shortcutBar');
        const copyBtn = document.getElementById('copyBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        
        let lastFocusedTextarea = null;

        // ==========================================
        // 💡 새롭게 추가된 기능: 전체 내용 포맷팅 복사
        // ==========================================
        function copyAllData(btn) {
            if (btn) btn.blur(); // 버튼 포커스 해제

            const rows = document.querySelectorAll('.item-row');
            let resultText = [];
            
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                
                // 이름과 세부설정 둘 다 비어있지 않은 경우에만 텍스트로 합침
                if (nameStr.trim() !== '' || valueStr.trim() !== '') {
                    resultText.push(`${nameStr}: ${valueStr}`);
                }
            });

            // 줄바꿈으로 모든 항목을 합침
            const finalString = resultText.join('\n');

            if (finalString === '') {
                alert('복사할 내용이 없습니다!');
                return;
            }

            navigator.clipboard.writeText(finalString).then(() => {
                copyAllBtn.textContent = '완료!';
                setTimeout(() => { copyAllBtn.textContent = '전체 복사'; }, 1000);
            }).catch(err => {
                console.log('전체 복사 실패:', err);
                alert('복사에 실패했습니다.');
            });
        }
        // ==========================================

        function saveData() {
            const rows = document.querySelectorAll('.item-row');
            const dataToSave = [];
            rows.forEach(row => {
                const nameStr = row.querySelector('.item-name').value;
                const valueStr = row.querySelector('.item-value').value;
                dataToSave.push({ name: nameStr, value: valueStr });
            });
            localStorage.setItem('charTemplateData', JSON.stringify(dataToSave));
        }

        function loadData() {
            const savedData = localStorage.getItem('charTemplateData');
            if (savedData) {
                const dataArray = JSON.parse(savedData);
                if (dataArray.length > 0) {
                    dataArray.forEach(item => addRow(null, item.name, item.value));
                    return;
                }
            }
            addRow();
        }

        document.addEventListener('focusin', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                lastFocusedTextarea = e.target;
            }
        });

        document.addEventListener('input', function(e) {
            if (e.target.tagName.toLowerCase() === 'textarea') {
                adjustHeight(e.target);
                updateCharCount();
                saveData();
            }
        });

        function adjustHeight(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function insertShortcut(btn, text) {
            if (btn) btn.blur();

            if (lastFocusedTextarea) {
                const start = lastFocusedTextarea.selectionStart;
                const end = lastFocusedTextarea.selectionEnd;
                const currentValue = lastFocusedTextarea.value;
                
                lastFocusedTextarea.value = currentValue.substring(0, start) + text + currentValue.substring(end);
                lastFocusedTextarea.selectionStart = lastFocusedTextarea.selectionEnd = start + text.length;
                
                adjustHeight(lastFocusedTextarea);
                updateCharCount();
                saveData();
                lastFocusedTextarea.focus();
            }
        }

        function moveRow(btn, direction) {
            if (btn) btn.blur();

            if (!lastFocusedTextarea) return;
            const currentRow = lastFocusedTextarea.closest('.item-row');
            if (!currentRow) return;

            if (direction === 'up') {
                const prevRow = currentRow.previousElementSibling;
                if (prevRow) {
                    itemList.insertBefore(currentRow, prevRow);
                    saveData();
                    lastFocusedTextarea.focus();
                }
            } else if (direction === 'down') {
                const nextRow = currentRow.nextElementSibling;
                if (nextRow) {
                    itemList.insertBefore(currentRow, nextRow.nextElementSibling);
                    saveData();
                    lastFocusedTextarea.focus();
                }
            }
        }

        function copyFocusedField(btn) {
            if (btn) btn.blur();

            if (lastFocusedTextarea) {
                const textToCopy = lastFocusedTextarea.value;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = '완료!';
                    setTimeout(() => { copyBtn.textContent = '복사'; }, 1000);
                }).catch(err => {
                    console.log('클립보드 복사 실패:', err);
                    alert('복사에 실패했습니다.');
                });
                lastFocusedTextarea.focus();
            }
        }

        function addRow(btn = null, nameStr = '', valueStr = '') {
            if (btn) btn.blur();

            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <textarea class="item-name" rows="1" placeholder="항목 이름"></textarea>
                <textarea class="item-value" rows="1" placeholder="세부 설정"></textarea>
                <button class="delete-btn" onclick="deleteRow(this)">✕</button>
            `;
            
            const textareas = row.querySelectorAll('textarea');
            textareas[0].value = nameStr;
            textareas[1].value = valueStr;
            
            itemList.appendChild(row);
            
            setTimeout(() => {
                textareas.forEach(ta => adjustHeight(ta));
                updateCharCount();
            }, 0);
            saveData();
        }

        function deleteRow(btn) {
            if (btn) btn.blur();

            const row = btn.parentElement;
            row.remove();
            if (itemList.children.length === 0) {
                addRow();
            } else {
                updateCharCount();
                saveData();
            }
        }

        function updateCharCount() {
            const textareas = document.querySelectorAll('textarea');
            let totalLength = 0;
            textareas.forEach(textarea => {
                totalLength += textarea.value.length;
            });
            charCountDisplay.textContent = `${totalLength.toLocaleString()} / 1,000`;
        }

        if (window.visualViewport) {
            const updateBarPosition = () => {
                const viewportHeight = window.visualViewport.height;
                const offsetTop = window.visualViewport.offsetTop;
                shortcutBar.style.bottom = 'auto';
                shortcutBar.style.top = (offsetTop + viewportHeight - 70) + 'px';
            };
            window.visualViewport.addEventListener('resize', updateBarPosition);
            window.visualViewport.addEventListener('scroll', updateBarPosition);
            updateBarPosition();
        }

        loadData();
    </script>
</body>
</html>
